<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../app/"><title>COPY-0020 가상 인물 견본</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="today.css"><style>.preview-controls{padding:16px;max-width:960px;margin:auto;border-bottom:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.preview-controls label{display:flex;gap:8px;align-items:center}.preview-controls p{width:100%;margin:0}.preview-controls select{max-width:180px}</style></head><body class="today-page"><div class="preview-controls"><p><b>검수 전용 · 모두 지어낸 생년월일입니다.</b> 날짜를 바꾸면 같은 화면을 실제 계산으로 다시 그립니다.</p><label>견본 날짜 <select id="fixture-date"><option>2026-11-01</option><option>2026-11-02</option><option>2026-11-09</option></select></label><label>테마 <select id="fixture-theme"><option value="light">낮</option><option value="dark">밤 · 같은 종이 바탕</option></select></label><label><input type="checkbox" id="fixture-blocked">저장 차단</label><button id="fixture-seed" type="button">가상 인물로 실제 페이지 열기</button></div><div id="fixture-view"></div><script src="astro.js"></script><script src="engine.js"></script><script src="sipseong.js"></script><script src="sipseong-byeonhwa.js"></script><script src="today-core.js"></script><script src="today-pieces.js"></script><script src="people.js"></script><script src="today.js"></script><script>
const cases=[{id:'fiction-a',name:'가상 인물 A',birth:{year:1994,month:3,day:14,hour:9,minute:10,gender:'F',longitude:127,tzOffset:9}},{id:'fiction-b',name:'가상 인물 B',birth:{year:1987,month:8,day:22,hour:16,minute:30,gender:'M',longitude:127,tzOffset:9}},{id:'fiction-c',name:'가상 인물 C · 시각 모름',birth:{year:2001,month:12,day:5,hour:null,minute:null,gender:'F',longitude:127,tzOffset:9}}];
let chosen='fiction-a';const people={migrate(){},activeId(){return chosen},list(){return cases},toProfile(p){return p.birth},setActive(id){chosen=id}};
const blocked={getItem(){throw Error('blocked')},setItem(){throw Error('blocked')}};
const store={getItem(k){if(document.getElementById('fixture-blocked').checked)return blocked.getItem(k);return localStorage.getItem('copy0020.fixture.'+k)},setItem(k,v){if(document.getElementById('fixture-blocked').checked)return blocked.setItem(k,v);localStorage.setItem('copy0020.fixture.'+k,v)}};
function day(){return new Date(document.getElementById('fixture-date').value+'T12:00:00')}
const view=ChaeksaTodayView.mount(document.getElementById('fixture-view'),{people,storage:store,clock:day,track:{event(){},watchEnd(){}}});
document.getElementById('fixture-view').id='today-app';
document.getElementById('fixture-date').onchange=view.render;document.getElementById('fixture-blocked').onchange=view.render;document.getElementById('fixture-theme').onchange=e=>{document.documentElement.dataset.theme=e.target.value;};
document.getElementById('fixture-seed').onclick=()=>{if(!['localhost','127.0.0.1'].includes(location.hostname)){alert('실제 페이지 저장 검사는 로컬 견본에서만 실행합니다.');return;}cases.forEach(p=>{if(!ChaeksaPeople.list().some(x=>x.name===p.name))ChaeksaPeople.add({name:p.name,birth:p.birth,relation:'그 사람',isSelf:false});});const p=ChaeksaPeople.list().find(x=>x.name===cases[0].name);ChaeksaPeople.setActive(p.id);location.href='today.html';};
</script></body></html>
