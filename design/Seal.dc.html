<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@200;300;400;500;700;900&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #b3562e; } a:hover { color: #9b4123; }
  </style>
</helmet>

<div style="width: 375px; min-height: 900px; position: relative; background: #f7f2e8; font-family: 'Noto Sans KR', sans-serif; color: #332c23; box-sizing: border-box; padding: 40px 34px 104px; display: flex; flex-direction: column">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="font-size: 11.5px; color: #a0937d; letter-spacing: .18em">丙午年 丙申月</div>
    <div style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; color: #a0937d">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .33 1.76l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.6 1.6 0 0 0 15 19.4a1.6 1.6 0 0 0-1 1.47V21a2 2 0 1 1-4 0v-.09A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.76.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.6 1.6 0 0 0 4.6 15a1.6 1.6 0 0 0-1.47-1H3a2 2 0 1 1 0-4h.09A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.33-1.76l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.6 1.6 0 0 0 9 4.6h.09A1.6 1.6 0 0 0 10 3.13V3a2 2 0 1 1 4 0v.09A1.6 1.6 0 0 0 15 4.6a1.6 1.6 0 0 0 1.76-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.6 1.6 0 0 0 19.4 9v.09a1.6 1.6 0 0 0 1.47 1H21a2 2 0 1 1 0 4h-.09a1.6 1.6 0 0 0-1.47 1z"/></svg>
    </div>
  </div>

  <!-- 인장이 주인공. 오늘 하루에 찍는 도장 하나 -->
  <div style="display: flex; align-items: center; gap: 22px; padding: 62px 0 0">
    <div style="width: 96px; height: 96px; flex-shrink: 0; border-radius: 8px; background: linear-gradient(145deg,#c4603a,#9b4123); box-shadow: 0 10px 30px rgba(155,65,35,.26); display: flex; align-items: center; justify-content: center; color: #fdf6ec; font-family: 'Noto Serif KR', serif">
      <div style="display: flex; flex-direction: column; align-items: center; line-height: 1; font-size: 34px; font-weight: 900; letter-spacing: .02em">
        <div>辛</div>
        <div>未</div>
      </div>
    </div>
    <div>
      <div style="font-family: 'Noto Serif KR', serif; font-size: 40px; font-weight: 200; line-height: 1; letter-spacing: -.03em">8.25</div>
      <div style="font-size: 12.5px; color: #6b6154; margin-top: 9px; letter-spacing: .06em">화요일 · 스물다섯째 날</div>
      <div style="display: inline-block; margin-top: 12px; font-size: 12px; font-weight: 500; color: #9b4123; border: 1px solid rgba(179,86,46,.34); border-radius: 3px; padding: 4px 9px; letter-spacing: .04em">편재</div>
    </div>
  </div>

  <!-- 오늘의 한 문장. 이 화면에 문장은 하나뿐이다 -->
  <p style="font-family: 'Noto Serif KR', serif; font-size: 27px; font-weight: 400; line-height: 1.62; letter-spacing: -.028em; margin: 64px 0 0; text-wrap: pretty">움직일수록<br>기회가 붙습니다.<br><span style="color: #a0937d">크게 걸면 잃습니다.</span></p>

  <div style="margin-top: 44px; padding-top: 22px; border-top: 1px solid #dbcbad">
    <div style="font-size: 10.5px; color: #b3562e; letter-spacing: .2em; font-weight: 500">오늘 할 하나</div>
    <p style="font-family: 'Gowun Batang', serif; font-size: 17px; line-height: 1.8; margin: 10px 0 0; text-wrap: pretty">미뤄둔 약속 하나를 잡고, 오늘 쓸 돈은 작게 쪼개세요.</p>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; align-items: center; gap: 8px; padding-top: 34px; color: #a0937d">
    <div style="font-size: 12.5px">왜 그런지 · 이번 주 · 원국</div>
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 30px 18px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 44px; color: #b3562e">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><circle cx="12" cy="12" r="4"/></svg>
      <div style="font-size: 10.5px; font-weight: 700">오늘</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 44px; color: #a0937d">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="4" height="16" rx="1"/><rect x="9.7" y="4" width="4" height="16" rx="1"/><rect x="15.9" y="4" width="4" height="16" rx="1"/></svg>
      <div style="font-size: 10.5px">원국</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 44px; color: #a0937d">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5c0 1.1-.9 2-2 2H8l-4 3.5v-13c0-1.1.9-2 2-2h12c1.1 0 2 .9 2 2z"/><path d="M9 9.5h6M9 12.5h4"/></svg>
      <div style="font-size: 10.5px">상담</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 44px; color: #a0937d">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16.5 5.6a3.2 3.2 0 0 1 0 6.3M18 14.9c2 .7 3.4 2.6 3.4 5.1"/></svg>
      <div style="font-size: 10.5px">사람</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
