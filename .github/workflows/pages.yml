name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # 10-02 개편 3묶음 「배포 짐 덜기」 — 저장소의 파일은 그대로 두고, 손님 사이트(배포 묶음)에서만 뺀다.
      #  · art/exec-*.png     그림 생성 원본 PNG 40장(약 91MB, 배포 묶음의 65%). 어느 화면도 부르지 않는다.
      #  · tests_*.html       기계 시험 쪽 — 개발 서버(내 컴퓨터)에서만 돌린다.
      #  · *-wongo-view.html  검수용 원고 보기 — 주소를 알면 유료 원고 전체가 보였다(docs/97 25번 「배포에서 뺀다」).
      # 여기서 지우는 것은 배포 기계의 임시 사본이다. 저장소와 내 컴퓨터의 파일은 그대로 남는다.
      - name: Drop files the live site does not use
        run: |
          rm -f app/art/exec-*.png app/tests_*.html app/*-wongo-view.html
          du -sh app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
