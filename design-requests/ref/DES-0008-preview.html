<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>정통사주 · 새 견본</title><link rel="stylesheet" href="DES-0008-theme.css"><style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}.review{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 20px}.bar{width:100%;max-width:750px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 auto 20px;font-size:12px;color:var(--ink2)}.widths{display:flex;gap:4px}.widths button{font:inherit;font-size:11px;background:transparent;border:1px solid var(--line);padding:5px 8px;color:var(--ink2);cursor:pointer;border-radius:5px}.widths button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}.bar a{color:inherit;text-underline-offset:4px}.device{width:390px;max-width:100%;height:calc(100vh - 82px);min-height:520px;border:1px solid var(--line2);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-lift);background:var(--bg)}iframe{border:0;width:100%;height:100%;display:block}@media(max-width:460px){.review{padding:0}.bar{padding:12px 18px;margin:0}.device{border:0;border-radius:0;width:100%;height:calc(100vh - 42px);min-height:0}}</style></head><body><main class="review"><div class="bar"><span>책사 정통사주 · 휴대폰 견본</span><div class="widths" aria-label="견본 폭"><button type="button" data-width="360" aria-pressed="false">360px</button><button type="button" data-width="390" aria-pressed="true">390px</button><button type="button" data-width="430" aria-pressed="false">430px</button></div><a href="DES-0008-jeongtong.html" target="_blank" rel="noopener">큰 화면으로 열기 ↗</a></div><div class="device"><iframe src="DES-0008-jeongtong.html" title="스크롤로 보는 정통사주 견본"></iframe></div></main><script>document.querySelectorAll("[data-width]").forEach(b=>b.onclick=()=>{document.querySelector(".device").style.width=b.dataset.width+"px";document.querySelectorAll("[data-width]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));});</script></body></html>
