<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>옛 책이 당신을 좋게 본 이유 — 정통사주 견본</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="DES-0009-story.css">
</head>
<body>
<header class="masthead"><div class="mast-inner"><a class="brand" href="#top"><b>策</b>책사</a><div class="mast-actions"><span class="preview">정통사주 · 새 견본</span><select class="sample-select" id="person" aria-label="가상 인물 선택"></select></div></div></header>
<main class="page" id="top"><p class="empty" role="status">옛 책이 좋게 본 조건을 모으고 있습니다.</p></main>
<footer class="footer"><p>이름으로 읽는 나의 바탕,<br>시간으로 읽는 나의 가능성.</p><span>가상 인물로 만든 디자인 견본입니다.<br>운영 화면에는 아직 적용하지 않았습니다.</span></footer>
<script src="DES-0009-story.js"></script>
<script>
'use strict';
fetch('DES-0009-data.json').then(r=>{if(!r.ok)throw new Error('data');return r.json();}).then(data=>{
  const select=document.getElementById('person');
  data.forEach((m,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent='견본 '+(i+1)+' · '+m.identity.name;select.appendChild(o);});
  const show=()=>window.ChaeksaNameSeason.mount(document.getElementById('top'),data[Number(select.value)||0]);
  select.onchange=show;show();
}).catch(()=>{document.getElementById('top').innerHTML='<p class="empty" role="alert">견본 자료를 불러오지 못했습니다. 로컬 미리보기 주소에서 다시 열어 주세요.</p>';});
</script>
</body>
</html>
