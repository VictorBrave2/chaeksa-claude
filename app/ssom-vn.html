<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연애궁합 — 장면으로 보기 · 책사</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#fff;--box:rgba(20,16,40,.78);--line:rgba(255,255,255,.18);--accent:#e8798b}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0d0b1f;color:var(--ink);font-family:'Noto Sans KR',sans-serif;overflow:hidden}
  .stage{position:fixed;inset:0;max-width:520px;margin:0 auto;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .bg{position:absolute;inset:-4%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease;animation:drift 18s ease-in-out infinite alternate}
  .bg.on{opacity:1}
  @keyframes drift{from{transform:scale(1.02) translateY(0)}to{transform:scale(1.1) translateY(-2%)}}
  .shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 30%,rgba(10,8,30,.2) 55%,rgba(10,8,30,.85) 100%)}
  .petal{position:absolute;top:-20px;width:9px;height:9px;border-radius:60% 0 60% 0;background:rgba(240,120,140,.75);animation:fall linear infinite}
  @keyframes fall{to{transform:translate(-60px,110vh) rotate(540deg)}}
  .top{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;font-size:13px;opacity:.85}
  .top a{color:#fff;text-decoration:none}
  .box{position:absolute;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));min-height:170px;padding:26px 18px 18px;border-radius:18px;background:var(--box);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .who{position:absolute;top:-15px;left:16px;padding:5px 14px;border-radius:999px;background:var(--accent);font-weight:700;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
  .who.you{background:#5a6fd6}.who.them{background:#d08a3c}.who.ex{background:#6b6b8a}.who.jw{background:#7a5bb5}.who.tk{background:#3f8f76}
  .txt{word-break:keep-all;font-family:'Gowun Batang',serif;font-size:17px;line-height:1.85;min-height:92px;white-space:pre-wrap}
  .txt b{color:#ffd6de}
  .txt.say{font-size:18px}
  .who.scene{display:none}.txt.scene{font-style:italic;opacity:.85;font-size:16px}
  .who.dan{background:#3f8f76}.txt.dan{font-size:15px}
  .next{position:absolute;right:16px;bottom:10px;font-size:12px;opacity:.6;animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.15}}
  .copy{display:none;margin-top:10px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font-size:13px}
  .copy.on{display:inline-block}
  .choices{position:absolute;left:18px;right:18px;bottom:calc(210px + env(safe-area-inset-bottom));display:none;flex-direction:column;gap:10px}
  .choices.on{display:flex;animation:up .4s ease;max-height:55vh;overflow-y:auto}
  @keyframes up{from{opacity:0;transform:translateY(12px)}}
  .choices button{padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-size:15px;text-align:left;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .choices button:active{background:rgba(232,121,139,.5)}
  .chap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(8,6,24,.9);transition:opacity .8s;z-index:5;text-align:center;padding:24px}
  .chap.off{opacity:0;pointer-events:none}
  .chap small{letter-spacing:.3em;opacity:.7}.chap h1{word-break:keep-all;font-family:'Gowun Batang',serif;font-size:26px;margin:12px 0 6px}.chap p{opacity:.75;font-size:14px}
.toc{position:absolute;inset:0;z-index:8;background:rgba(10,8,26,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 20px 24px}
  .toc.on{display:flex;animation:up .3s ease}
  .toc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.toc-h b{font-family:'Gowun Batang',serif;font-size:20px}
  .toc-x{background:none;border:0;color:#fff;font-size:22px;padding:4px 8px;cursor:pointer}
  .toc-body{overflow-y:auto;flex:1;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
  .toc-body::-webkit-scrollbar{width:4px}.toc-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:4px}
  .toc-g{font-size:12px;letter-spacing:.08em;opacity:.6;margin:16px 0 6px}
  .toc-i{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.08);color:#fff;padding:11px 2px;font-size:15px;cursor:pointer}
  .toc-i span{opacity:.5;font-size:12px;min-width:18px}.toc-i.now{color:#ffb3c1}.toc-i.now span{opacity:1}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>
  <div class="shade"></div>
  <div id="petals"></div>
  <div class="top"><a href="ssom.html" id="back">← 글로 보기</a><span id="prog"></span><a href="#" id="toc">목차</a></div>
  <div class="choices" id="choices"></div>
  <div class="box" id="box"><div class="who" id="who">책사</div><div class="txt" id="txt"></div><div class="next" id="nx">▼ 눌러서 계속</div></div>
  <div class="chap" id="chap"></div>
  <div class="toc" id="tocPanel"><div class="toc-h"><b>목차</b><button class="toc-x" id="tocX" type="button">✕</button></div><div class="toc-body" id="tocBody"></div></div>
</div>
<script src="config.js?v=1049"></script><script src="astro.js?v=1049"></script><script src="lunar.js?v=1049"></script><script src="engine.js?v=1049"></script>
<script src="saenggeuk.js?v=1049"></script><script src="gise.js?v=1049"></script><script src="panjeong.js?v=1049"></script><script src="typecard.js?v=1049"></script><script src="gyeokguk.js?v=1049"></script>
<script src="ssom-gwanjeom.js?v=1049"></script><script src="ssom-baram.js?v=1049"></script><script src="ssom-daehwa.js?v=1049"></script><script src="ssom-webtoon.js?v=1049"></script><script src="ssom-webtoon-2.js?v=1049"></script><script src="ssom-wongo.js?v=1049"></script><script src="ssom-dangye.js?v=1049"></script><script src="ssom.js?v=1049"></script>
<script>
// 연애궁합 장면 보기(09-25) — 글 보기와 같은 대본(ssom.js 대본)을 처음부터 끝까지 한 줄씩. 글을 새로 쓰지 않는다.
// 두 사람 · 만난 달 · 단계는 글 보기에서 이 탭(sessionStorage)으로만 넘겨받는다 — 주소에 싣지 않는다. 없으면 사장님 쌍 견본으로 연다.
(function () {
  const S = window.ChaeksaSsom, P = window.ChaeksaSsomPage;
  let v = null; try { v = JSON.parse(sessionStorage.getItem('chaeksa.ssomVn') || 'null'); } catch (e) {}
  if (!v || !v.a) v = { a: { year: 1992, month: 4, day: 21, hour: 0, minute: 20, gender: 'M', longitude: 126.98 }, b: { year: 1999, month: 12, day: 20, hour: 20, minute: 0, gender: 'F', longitude: 126.98 }, opts: { 만난: { y: 2026, m: 8 }, 단계: '썸' }, 견본: true };
  let 대; try { 대 = P.대본(v.a, v.b, v.opts || {}); } catch (e) { 대 = null; }
  const $ = (id) => document.getElementById(id);
  const bgs = [$('bgA'), $('bgB')]; let 앞 = 0, 지금배경 = '';
  const 배경바꾸기 = (u) => { if (!u || u === 지금배경) return; 지금배경 = u; 앞 ^= 1; bgs[앞].style.backgroundImage = 'url(art/' + u + '.webp)'; bgs[앞].classList.add('on'); bgs[앞 ^ 1].classList.remove('on'); };
  for (let i = 0; i < 14; i++) { const p = document.createElement('i'); p.className = 'petal'; p.style.left = Math.random() * 110 + '%'; p.style.animationDuration = 7 + Math.random() * 8 + 's'; p.style.animationDelay = -Math.random() * 12 + 's'; p.style.opacity = .4 + Math.random() * .5; $('petals').appendChild(p); }
  const 굵 = (x) => x.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  function 돌아가기() { if (document.referrer && history.length > 1) history.back(); else location.href = 'ssom.html'; }
  $('back').onclick = (e) => { e.preventDefault(); e.stopPropagation(); 돌아가기(); };
  if (!대 || !대.장들.length) { $('chap').innerHTML = '<h1>장면을 만들지 못했어요</h1><p><a href="ssom.html" style="color:#fff">글로 보기로 돌아가기</a></p>'; return; }
  const 장들 = 대.장들, 총론 = 대.총론수 || 5, 첫장 = /[?&]at=stage/.test(location.search) && 장들.length > 총론 ? 총론 : 0;   // 「이 단계를 장면으로 보기」는 단계 첫 장부터
  let 장 = 0, 줄들 = [], n = -1, 치는중 = null, 다침 = true, 멈춤 = false, 표지중 = false, 반응중 = false;
  function 표지(i) {
    장 = i; 멈춤 = true; 표지중 = true; 반응중 = false; $('choices').classList.remove('on');
    $('chap').innerHTML = '<small>' + (i + 1) + ' / ' + 장들.length + '</small><h1>' + 굵(장들[i].제목) + '</h1><p>' + (v.견본 && i === 0 ? '견본 — 사장님 쌍(丁卯 × 丙午, 26년 8월에 만남)<br>' : '') + '눌러서 시작</p>';
    $('chap').classList.remove('off'); 배경바꾸기(장들[i].배경[0]);
  }
  function 시작() { $('chap').classList.add('off'); 표지중 = false; 멈춤 = false; 줄들 = 장들[장].줄.map((x, j, a) => Object.assign({ 배경: 장들[장].배경[Math.min(장들[장].배경.length - 1, Math.floor(j * 장들[장].배경.length / a.length))] }, x)); n = 0; 보이기(); }
  function 보이기() {
    const s = 줄들[n]; 배경바꾸기(s.배경);
    $('who').textContent = s.누가; $('who').className = 'who' + (s.누가 === '당신' ? ' you' : s.누가 === '상대' ? ' them' : s.누가 === '예시' ? ' ex' : s.누가 === '장면' ? ' scene' : s.누가 === '추론의 단서' ? ' dan' : s.쪽 === 1 ? ' jw' : '');
    $('txt').className = 'txt' + (s.누가 === '장면' ? ' scene' : s.누가 === '추론의 단서' ? ' dan' : /당신|상대|예시/.test(s.누가) ? ' say' : ''); $('nx').style.display = '';
    $('prog').textContent = (장 + 1) + '화 — ' + (n + 1) + '/' + 줄들.length;
    const 순 = s.말.replace(/\*\*/g, ''); let k = 0; 다침 = false; clearInterval(치는중);
    치는중 = setInterval(() => { k++; $('txt').textContent = 순.slice(0, k); if (k >= 순.length) { clearInterval(치는중); $('txt').innerHTML = 굵(s.말); 다침 = true; } }, 28);
  }
  function 책사말(말) { $('who').textContent = '책사'; $('who').className = 'who'; $('txt').className = 'txt'; $('txt').innerHTML = 굵(말); $('nx').style.display = 'none'; }
  function 선택(목록, 누르면) {
    $('choices').innerHTML = 목록.map(t => '<button type="button">' + t + '</button>').join('');
    $('choices').classList.add('on');
    $('choices').querySelectorAll('button').forEach((b, j) => b.onclick = (e) => { e.stopPropagation(); $('choices').classList.remove('on'); 누르면(목록[j]); });
  }
  function 장끝() {
    멈춤 = true; const r = 장들[장].반응;
    if (r && !반응중) { 책사말(r.물음); return 선택(r.틀, (답) => { try { S.적기(대.키, r.장, 답); } catch (e) {}
      const 글 = r.글[답]; if (!글) { 책사말('「' + 답 + '」 — 이어지는 글은 쓰고 있어요.'); return 다음단추(); }
      줄들 = 글.map(t => Array.isArray(t) ? (t[0] === '장면' ? { 누가: '장면', 말: t[1], 배경: 지금배경 } : t[0] === '당신' || t[0] === '상대' ? { 누가: t[0], 말: t[1], 배경: 지금배경 } : t[0] === '단서' ? { 누가: '추론의 단서', 말: t[1], 배경: 지금배경 } : { 누가: '책사', 말: t[1], 쪽: t[0] === '인연' ? 0 : 1, 배경: 지금배경 }) : t.indexOf('> ') === 0 ? { 누가: '예시', 말: t.slice(2), 배경: 지금배경 } : { 누가: '책사', 말: t, 배경: 지금배경 }); n = 0; 멈춤 = false; 반응중 = true; 보이기(); }); }
    다음단추();
  }
  function 다음단추() {
    멈춤 = true;
    if (장 + 1 >= 장들.length) { 책사말('끝까지 보셨어요. 두 분의 이야기는 여기까지예요.'); return 선택(['처음부터 다시', '목차', '글로 보기'], (t) => t === '글로 보기' ? 돌아가기() : t === '목차' ? 목차() : 표지(첫장)); }
    선택(['다음 — ' + 장들[장 + 1].제목.replace(/\*\*/g, ''), '목차'], (t) => t === '목차' ? 목차() : 표지(장 + 1));
  }
  function 목차() {
    // 두 사람 이야기(1~5) · 지금 단계의 질문(6~)으로 나눈 목차 판(09-25 사장님 「목차를 적절하게 수정해」)
    const 항 = (c, i) => '<button type="button" class="toc-i' + (i === 장 ? ' now' : '') + '" data-i="' + i + '"><span>' + (i + 1) + '</span>' + c.제목.replace(/\*\*/g, '') + '</button>';
    $('tocBody').innerHTML = (총론 ? '<div class="toc-g">두 사람 이야기</div>' : '') + 장들.slice(0, 총론).map((c, i) => 항(c, i)).join('')
      + (장들.length > 총론 ? '<div class="toc-g">지금 단계의 질문 · ' + String(대.단계 || '').split(' — ')[0] + '</div>' + 장들.slice(총론).map((c, i) => 항(c, i + 총론)).join('') : '');
    $('tocBody').querySelectorAll('.toc-i').forEach(b => b.onclick = (e) => { e.stopPropagation(); $('tocPanel').classList.remove('on'); 표지(+b.dataset.i); });
    $('tocPanel').classList.add('on');
  }
  $('tocX').onclick = (e) => { e.stopPropagation(); $('tocPanel').classList.remove('on'); };
  $('tocPanel').onclick = (e) => e.stopPropagation();
  $('toc').onclick = (e) => { e.preventDefault(); e.stopPropagation(); 목차(); };
  $('stage').onclick = () => {
    if (표지중) return 시작();
    if (멈춤) return;
    if (!다침) { clearInterval(치는중); $('txt').innerHTML = 굵(줄들[n].말); 다침 = true; return; }
    if (n + 1 < 줄들.length) { n++; return 보이기(); }
    if (반응중) { 반응중 = false; return 다음단추(); }
    장끝();
  };
  표지(첫장);   // 「이 단계를 장면으로 보기」는 단계 첫 장부터
})();
</script>
</body>
</html>
