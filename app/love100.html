<!-- 10-02 옛 주소 — 「연애 속의 나 — 100가지 행동 분석」 상품 쪽은 걷었다(ab1b287). 공유된 링크로 오는 손님이 404 를 보지 않게 앱의 연애 탭으로 넘긴다. ?from= 꼬리표는 살려 어디서 왔는지 남긴다. -->
<script>(function(){var q=new URLSearchParams(location.search);var f=q.get('from');location.replace('./?go=love'+(f?'&from='+encodeURIComponent(f):''));})();</script>
