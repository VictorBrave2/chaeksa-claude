<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>궁합총론 — 두 분의 여덟 글자를 나란히 · 책사</title>
<meta name="description" content="두 분의 생년월일시를 넣으면 고전이 한 사람 안에서 짝을 읽는 법을 두 분에게 각각 재서 장마다 나란히 놓아 드립니다. 점수로 합치지 않습니다.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1048">
<style>
  .doc{max-width:660px;margin:0 auto;padding:22px 16px 80px}
  .back{display:inline-block;margin-bottom:16px;font-size:13px;color:var(--ink3);text-decoration:none}
  .doc h1{font-family:var(--serif);font-size:24px;line-height:1.45;margin:0 0 8px}
  .doc .lead{font-size:14.5px;line-height:1.85;color:var(--ink2);margin:0 0 18px}
  .jt-form .jt-notime{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin-top:-2px}
  .jt-form .jt-notime input{width:18px;height:18px;margin:0;padding:0}
  .jt-form input:disabled{opacity:.45}
</style>
</head>
<body>
<div class="doc">
  <a class="back" href="./">← 책사 홈</a>
  <h1>궁합총론<br>두 분의 여덟 글자를 나란히</h1>
  <p class="lead">고전은 두 사람 사주를 맞대는 법을 따로 두지 않았습니다. 한 사람 안에서 짝을 읽는 법만 남겼어요. 그 법을 두 분에게 각각 재서 장마다 나란히 놓아 드려요. 점수로 합치지 않습니다. 회원가입 없이 무료예요.</p>
  <p class="lead"><a href="ssom.html">막 썸을 시작했다면 — 연애궁합 여섯 질문 →</a></p>
  <form id="gcForm" class="card">
    <div class="gc-head">나</div>
    <div class="jt-form">
      <label>생년월일<input type="date" id="gcDateA" required></label>
      <label>태어난 시각<input type="time" id="gcTimeA" value="12:00"></label>
      <label class="jt-notime"><input type="checkbox" id="gcNoTimeA">시간을 몰라요</label>
      <label>성별<select id="gcGA"><option value="F">여</option><option value="M">남</option><option value="">모름</option></select></label>
      <label>태어난 곳<select id="gcPlaceA"><option value="KR:서울">서울</option></select></label>
    </div>
    <div class="gc-head">그 사람</div>
    <div class="jt-form">
      <label>생년월일<input type="date" id="gcDateB" required></label>
      <label>태어난 시각<input type="time" id="gcTimeB" value="12:00"></label>
      <label class="jt-notime"><input type="checkbox" id="gcNoTimeB">시간을 몰라요</label>
      <label>성별<select id="gcGB"><option value="M">남</option><option value="F">여</option><option value="">모름</option></select></label>
      <label>태어난 곳<select id="gcPlaceB"><option value="KR:서울">서울</option></select></label>
    </div>
    <button type="submit" class="btn" style="width:100%">나란히 놓아 보기</button>
  </form>
  <div id="gcOut"></div>
</div>
<script>
(function(){var m=localStorage.getItem('chaeksa.theme')||'auto',h=new Date().getHours();document.documentElement.setAttribute('data-theme',(m==='night'||(m==='auto'&&(h<6||h>=18)))?'night':'day');})()
</script>

</html>
