<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>정통사주 웹툰 원고 보기 · 검수용</title>
<style>
:root{color-scheme:light}body{margin:0;background:#f6f5fb;font-family:"Malgun Gothic",-apple-system,sans-serif;color:#222}
.w{max-width:680px;margin:0 auto;padding:18px 16px 80px}h1{font-size:20px;margin:6px 0 4px}.sub{color:#777;font-size:13px;margin:0 0 14px;line-height:1.6}
h2{font-size:17px;margin:34px 0 4px;color:#5b3fa0;border-bottom:2px solid #e3def5;padding-bottom:6px}h2 small{font-weight:400;color:#999;font-size:12px;margin-left:8px}
p{margin:6px 0;line-height:1.7;font-size:15px}.s{font-style:italic;color:#555}
.b{display:inline-block;min-width:42px;font-size:12px;border-radius:99px;padding:1px 8px;color:#fff;margin-right:6px;text-align:center;font-style:normal}.y{background:#5a6fd6}.c{background:#7a5bb5}
.d{background:#f0edf8;border-left:3px solid #7a5bb5;padding:8px 10px;font-size:14px;border-radius:0 8px 8px 0;margin:8px 0}.d b{font-size:12px;color:#7a5bb5;display:block}
.toc{font-size:13px;color:#666;line-height:1.9;margin:0 0 10px}.toc a{color:#5b3fa0;text-decoration:none;margin-right:10px}
.e{color:#c33;font-size:13px}
.a{font-size:16.5px;font-weight:700;background:#fff;border:1px solid #e3def5;border-radius:12px;padding:10px 12px}
.why{margin:8px 0 0}.why summary{cursor:pointer;font-size:13px;color:#7a5bb5}
</style></head><body><div class="w">
<h1 id="ttl">정통사주 웹툰 원고</h1>
<p class="sub">뼈대 v2(docs/81_v2) 20회 — 한 회 = 컷 셋 · 한 컷 한 줄, 「왜 그럴까」는 접힘 — 를 사장님 명식 한 벌로 쓴 시제품입니다. 사장님 검수용(09-26 「내가 검수부터」). 이름표: 나 = 파랑 · 책사 = 보라 · 단서 = 상자.</p>
<div class="toc" id="toc"></div><div id="out"></div></div>
<script src="config.js?v=1173"></script><script src="places.js?v=1173"></script><script src="astro.js?v=1173"></script><script src="lunar.js?v=1173"></script><script src="engine.js?v=1173"></script><script src="saenggeuk.js?v=1173"></script><script src="gise.js?v=1173"></script><script src="panjeong.js?v=1173"></script><script src="typecard.js?v=1173"></script><script src="gyeokguk.js?v=1173"></script><script src="classic.js?v=1173"></script><script src="samyeong.js?v=1173"></script><script src="ssom-gwanjeom.js?v=1173"></script><script src="jt-webtoon.js?v=1173"></script><script src="jt-webtoon-2.js?v=1173"></script><script src="jt-webtoon-check.js?v=1173"></script><script src="jt-webtoon-proto.js?v=1173"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search), out = document.getElementById('out'), toc = document.getElementById('toc');
  let P = window.ChaeksaJtProto;
  if (!q.get('proto') && window.ChaeksaJtWebtoon) {   // 09-26 조립기 결과를 그린다 — ?y=1992&m=4&d=21&h=0&mi=20&g=M 로 명식 바꿈, ?proto=1 이면 옛 시제품
    const R = ChaeksaEngine.calc({ year: +(q.get('y') || 1992), month: +(q.get('m') || 4), day: +(q.get('d') || 21), hour: +(q.get('h') || 0), minute: +(q.get('mi') || 20), gender: q.get('g') || 'M', longitude: 126.98 });
    const 사 = ChaeksaJtWebtoon.사람(R);
    P = { 명식: 사.일간 + R.pillars.day && (ChaeksaEngine.STEMS[R.pillars.day.stem] + ChaeksaEngine.BRANCHES[R.pillars.day.branch]) + ' · ' + 사.격 + '격 ' + 사.성패 + ' · 조립기', 회: ChaeksaJtWebtoon.조립(R, { 검수: true }) };
  }
  const esc = (t) => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  if (!P || !P.회) { out.innerHTML = '<p class="e">jt-webtoon-proto.js 가 아직 없어요.</p>'; return; }
  document.getElementById('ttl').textContent = '정통사주 웹툰 원고 — ' + P.명식;
  toc.innerHTML = P.회.map(h => '<a href="#h' + h.번호 + '">' + h.번호 + '</a>').join('') + ' · 명식 ' + esc(P.명식) + ' · ' + P.회.length + '회';
  out.innerHTML = P.회.map(h => '<h2 id="h' + h.번호 + '">' + h.번호 + '. ' + esc(h.물음) + '<small>' + esc(h.묶음) + '</small></h2>'
    + (() => { const 줄 = h.줄 || [], 앞 = 줄.filter(x => x[0] !== '해설' && x[0] !== '단서'), 뒤 = 줄.filter(x => x[0] === '해설' || x[0] === '단서');
      const 한 = ([누, 말]) => 누 === '장면' ? '<p class="s"><span class="b y">나</span>' + esc(말) + '</p>'
        : 누 === '나' ? '<p><span class="b y">나</span>' + esc(말) + '</p>'
        : 누 === '답' ? '<p class="a"><span class="b c">책사</span>' + esc(말) + '</p>'
        : 누 === '단서' ? '<div class="d"><b>추론의 단서</b>' + esc(말) + '</div>'
        : '<p><span class="b c">책사</span>' + esc(말) + '</p>';
      return 앞.map(한).join('') + (뒤.length ? '<details class="why"><summary>왜 그럴까</summary>' + 뒤.map(한).join('') + '</details>' : ''); })()).join('');
})();
</script></body></html>
