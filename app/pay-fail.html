<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>결제가 취소되었습니다 · 책사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3c40c5591f">
<style>
  .doc{max-width:520px;margin:0 auto;padding:48px 18px 80px;text-align:center}
  .doc h1{font-family:var(--serif);font-size:var(--t5);margin:18px 0 8px}
  .doc p{font-size:var(--t2);line-height:1.85;color:var(--ink2)}
  .mark{font-size:var(--t7);line-height:1}
  .btn{display:inline-block;margin-top:8px;padding:12px 22px;border-radius:var(--r2);
       text-decoration:none;font-size:var(--t2);font-weight:700}
  .btn.go{background:var(--accent);color:#fff}
  /* 보조 단추는 바탕을 걷는다 — 전역 .btn 의 금색 통에 회색 글씨가 묻혔다(pay-done 과 같은 풀이) */
  .btn.sub{background:transparent;box-shadow:none;color:var(--ink2)}
  .warn{font-size:var(--t1);color:var(--ink3);margin-top:18px}
</style>
</head>
<body>
<div class="doc">
  <div class="mark">止</div>
  <h1 id="h">결제가 취소되었습니다</h1>
  <p id="msg">결제되지 않았습니다. 돈은 빠져나가지 않았습니다.</p>
  <p class="warn" id="code"></p>
  <p id="backBuyNote" hidden></p>
  <p id="backBuy" hidden><a class="btn go" id="backBuyA" href="./">다시 결제하러 가기</a></p>
  <p id="backApply" hidden><a class="btn go" href="taekil-apply.html">신청서로 돌아가 다시 결제하기</a></p>
  <p><a class="btn go" id="backHome" href="./">← 홈</a></p>
  <p><a class="btn sub" id="mailQ" href="mailto:dl4431@naver.com?subject=%5B%EC%B1%85%EC%82%AC%5D%20%EA%B2%B0%EC%A0%9C%20%EB%AC%B8%EC%9D%98">메일로 문의하기</a></p>
</div>

<script src="config.js?v=e0fee3d288"></script>
<script src="cloud.js?v=5eed4be006"></script>
<script src="pay.js?v=ad2566644a"></script>
<script src="yaksok.js?v=c7cb589870"></script>
<script src="oryu.js?v=431856193b"></script>
<script>
(function () {
  var m = localStorage.getItem('chaeksa.theme') || 'auto';
  var h = new Date().getHours();
  var night = m === 'night' || (m === 'auto' && (h < 6 || h >= 18));
  document.documentElement.setAttribute('data-theme', night ? 'night' : 'day');

  var q = new URLSearchParams(location.search);
  var code = q.get('code'), message = q.get('message'), orderId = q.get('orderId');
  // 카카오페이는 돌아올 주소에 pv=kakao 와 why(cancel = 손님이 그만둠 · fail = 결제가 안 됨)를 붙여 두었다(api/pay.js kopen).
  // 네이버페이도 같은 꼴로 보낸다(pay-done.html 이 resultCode 를 보고 why 를 붙여 여기로 옮긴다, 10-03).
  var 카카오 = q.get('pv') === 'kakao' || q.get('pv') === 'naver', why = q.get('why') === 'cancel' ? 'cancel' : 'fail';

  if (카카오) {
    document.getElementById('h').textContent = why === 'cancel' ? '결제를 그만두셨습니다' : '결제가 되지 않았습니다';
    document.getElementById('msg').textContent = '결제되지 않았으므로 돈은 빠져나가지 않았습니다.';
    document.title = (why === 'cancel' ? '결제를 그만두셨습니다' : '결제가 되지 않았습니다') + ' · 책사';
  } else {
    // 사용자가 창을 닫은 것과 카드가 거절된 것은 다른 일이다. 토스가 준 말을 그대로 보여준다.
    if (message) document.getElementById('msg').textContent =
      message + ' 결제되지 않았으므로 돈은 빠져나가지 않았습니다.';
    if (code) document.getElementById('code').textContent = '코드 ' + code;
  }

  // 출산택일이면 신청서로 돌려보낸다 — 적은 것은 이 기기에 남아 있어 그대로 채워진다(2026-09-11 검토:
  // 첫 방문자는 「← 홈」으로 가면 신청 페이지로 가는 길이 없다). 창을 닫아 취소하면 토스가
  // orderId 를 붙이지 않으므로, 이 기기에 신청서 초안이 있는지로도 가린다.
  // 카카오는 늘 orderId 를 붙여 오므로 주문번호로만 가린다(연애 상품을 그만뒀는데 택일 신청서로 보내지 않게).
  // 10-02 연애 두 상품을 그만두거나 막혔으면 그 화면으로 돌려보낸다 — 전에는 「← 홈」뿐이라 사려던 화면을 다시 찾아야 했다.
  // 주문번호 앞부분이 상품이다(ck_love_full_ · ck_love_pair_). 돌아가면 고른 사람 · 넣어 둔 생년월일은 그대로다(pair.js 고른키 · 저장된 사람).
  var 연애곳 = /^ck_love_pair_/.test(orderId || '') ? ['pair', './#pair'] : /^ck_love_full_/.test(orderId || '') ? ['love', './#love'] : null;
  if (연애곳) {
    var Y = window.ChaeksaYaksok, 이름 = (Y && Y.이름(연애곳[0])) || '';
    var 쪽지 = document.getElementById('backBuyNote');
    쪽지.textContent = (이름 ? '「' + 이름 + '」 ' : '') + '결제 화면으로 돌아가요. ' + (연애곳[0] === 'pair' ? '고른 그 사람 그대로예요.' : '넣어 둔 내 생년월일 그대로예요.');
    쪽지.hidden = false;
    document.getElementById('backBuyA').href = 연애곳[1];
    document.getElementById('backBuy').hidden = false;
    document.getElementById('backHome').className = 'btn sub';
  }

  // 문의 메일에 화면 이름 · 주문번호 · 안 된 것을 미리 채운다(oryu.js 메일주소 — 생년월일은 안 싣는다). 그 파일이 없으면 처음 주소 그대로.
  if (window.ChaeksaOryu) document.getElementById('mailQ').href = ChaeksaOryu.메일주소({ 화면: '결제 취소 · 실패', 주문: orderId, 무엇: document.getElementById('msg').textContent, 코드: code });

  var 택일 = !연애곳 && (/^ck_taekil_/.test(orderId || '')
    || (!카카오 && !!(window.ChaeksaPay && ChaeksaPay.주문서 && ChaeksaPay.주문서.초안())));
  if (택일) {
    document.getElementById('backApply').hidden = false;
    document.getElementById('backHome').className = 'btn sub';
  }

  // 열어둔 주문을 닫는다. 안 해도 결제는 안 되지만, 'open' 인 채 남으면 나중에 헷갈린다.
  // 카카오는 서버가 카카오에 「정말 결제 안 됐나」를 물어본 뒤에만 닫는다(로그인 없이도 부른다).
  if (orderId && window.ChaeksaPay) {
    if (카카오) ChaeksaPay.kfail({ orderId: orderId, why: why }).catch(function () {});
    else ChaeksaPay.markFailed({ orderId: orderId, code: code, message: message }).catch(function () {});
  }
})();
</script>
</body>
</html>
