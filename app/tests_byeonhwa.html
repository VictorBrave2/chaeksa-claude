const E = ChaeksaEngine, B = ChaeksaByeonhwa, out = document.getElementById('out');
const R = E.calc({ year: 1992, month: 4, day: 21, hour: 0, minute: 20, gender: 'M', longitude: 126.98 });

const 빠짐글 = (e) => e.빠짐 ? e.빠짐.무리 + ' ' + e.빠짐.층수 + '층 [' + e.빠짐.십성들.map(x => x.십신 + '(' + x.층 + ')').join(' · ') + ']' : '없음';

  ['G5 9/26 말 조각(문장 조립은 작가 몫) — 체 천간 중심 비견 · 겁재, 체 지지 중심 편재 / 용 천간 편관 셋 · 용 지지 편인 셋 / 원문에 십성 이름 · 한자 0', (() => { const 체 = M26.체, 용 = M26.용; const 원문 = [].concat(체.천간.말.map(x => x.중심), 체.지지.말.map(x => x.중심), Object.values(용.천간.뜻), Object.values(용.지지.뜻)).join(' '); return [체.천간.말.map(x => x.십신).join('·'), 체.지지.말.map(x => x.십신).join('·'), 용.천간.십신 + ':' + 용.천간.칸.length, 용.지지.십신 + ':' + 용.지지.칸.length, 용.천간.쪽 + '/' + 용.지지.쪽, /[一-鿿]|비견|겁재|식신|상관|편재|정재|편관|정관|편인|정인/.test(원문) ? '섞임' : '깨끗'].join(' | '); })(), '비견·겁재 | 편재 | 편관:3 | 편인:3 | 생각/몸 | 깨끗'],

  ['G9 9/28 ~ 10/4 — 처음 2 = 10/4 辛亥 하나 · 9/29 丙午 · 9/30 丁未 처음 0(천간 이어짐 4층 · 지지 다시 옴) · 10/2 己酉 지지 이어짐 2층 같은 십성 · 뾰족한 날 10/4', (() => { const d = 주28.날들; const 두 = d.filter(x => x.처음수 === 2).map(x => x.간지).join(','); const 영 = d.filter(x => x.처음수 === 0).map(x => x.간지 + '(' + x.변화.용.천간.상태 + x.변화.용.천간.층수 + '/' + (x.변화.용.지지.다시옴 ? '다시옴' : '?') + ')').join(','); const 기유 = d[4].변화.용.지지; return [두, 영, d[4].간지 + ' ' + 줄글(기유), 주28.뾰족한날.날짜, 주28.띠.map(x => x.변동폭).join(' ')].join(' | '); })(), '辛亥 | 丙午(이어짐4/다시옴),丁未(이어짐4/다시옴) | 己酉 편재 이어짐 2층 | 2026-10-04 | 5 1 1 4 4 5 6'],
  ['G10 9/19 丙申 · 9/20 丁酉 — 두 줄 다 이어짐(요즘 그대로) · 9/20 은 월운과 같은 간지 표시', (() => { const a = 결과(2026, 9, 19), b = 결과(2026, 9, 20); return [a.용.간지 + ' ' + 줄글(a.용.천간) + ' / ' + 줄글(a.용.지지) + ' 새로온 ' + a.새로온수, b.용.간지 + ' 새로온 ' + b.새로온수 + ' 월운과같은간지 ' + b.표시.월운과같은간지 + ' (9/19 ' + a.표시.월운과같은간지 + ')'].join(' | '); })(), '丙申 겁재 이어짐 4층 정편바뀜 / 정재 이어짐 2층 정편바뀜 새로온 0 | 丁酉 새로온 0 월운과같은간지 true (9/19 false)'],
