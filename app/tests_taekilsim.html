<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>택일 시뮬레이터 검사</title>

</head><body>
<h1>택일 시뮬레이터 검사 — 60 · 63조</h1>
<p>판정엔진 + 출산택일 관점 = 화면. 시각이 분 단위로 맞는지, 점수가 안 나가는지, 관점이 엔진 말고 다른 데를 두드리지 않는지를 고정한다.</p>
<div id="out"></div><div id="tkSim" style="display:none"></div>
<script src="config.js"></script><script src="places.js"></script><script src="astro.js"></script><script src="lunar.js"></script><script src="engine.js"></script>
<script src="saenggeuk.js?t=74"></script><script src="gise.js?t=74"></script><script src="panjeong.js?t=74"></script><script src="typecard.js?t=63"></script><script src="gyeokguk.js?v=1220"></script><script src="classic.js?t=2"></script>
<script src="gwanjeom.js?t=74"></script><script src="yaksok.js?t=74"></script><script src="taekilsim.js?t=74"></script>
<script>
const E = ChaeksaEngine, P = ChaeksaPanjeong, W = ChaeksaGwanjeom, S = ChaeksaTaekilSim;
const out = document.getElementById('out'); let 통과 = 0, 실패 = 0;
function 검사(이름, fn) { let 문제 = []; try { const r = fn(); if (r) 문제 = [].concat(r); } catch (e) { 문제 = [e.message + '\n' + e.stack]; }
  const ok = !문제.length; ok ? 통과++ : 실패++;
  out.insertAdjacentHTML('beforeend', '<h2 class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ ' : '✗ ') + 이름 + '</h2>' + (ok ? '' : '<pre>' + 문제.join('\n') + '</pre>')); }

const 하루 = S.하루(2026, 12, 18, 'M', 'KR:서울');
검사('시각 — 2026-12-18 서울 미시·사시의 첫 분이, 엔진을 분 단위로 훑어 찾은 첫 분과 같다(교과서 13:00 이 아니다)', () => {
  // 기대값을 손으로 적지 않는다 — 같은 경도(서울 126.98)로 엔진을 1분씩 훑어 그 시진이 처음 나오는 분을 찾는다.
  const 첫분 = (지) => { for (let t = 0; t < 1440; t++) { const R = E.calc({ year: 2026, month: 12, day: 18, hour: Math.floor(t / 60), minute: t % 60, gender: 'M', longitude: 126.98 }); if (R.pillars.hour.branch === 지) return t; } return -1; };
  const 문제 = []; const 미 = 하루.rows.find(r => r.시진 === '미시'), 사 = 하루.rows.find(r => r.시진 === '사시');
  if (!미 || 미.시작 !== 첫분(7)) 문제.push('미시 시작 ' + (미 && 미.창) + ' · 엔진 첫 분 ' + 첫분(7));
  if (!사 || 사.시작 !== 첫분(5)) 문제.push('사시 시작 ' + (사 && 사.창) + ' · 엔진 첫 분 ' + 첫분(5));
  if (미 && (미.시작 < 13 * 60 + 20 || 미.시작 > 13 * 60 + 40)) 문제.push('미시가 13:20~13:40 밖에서 시작한다: ' + 미.창);
  if (미 && !/乙未/.test(미.시주)) 문제.push('미시 시주 ' + 미.시주);
  return 문제;
});
검사('시각 — 창의 첫 분과 끝 분을 엔진에 넣으면 그 시진이 나오고, 하루 1440분이 빈틈없이 덮인다', () => {
  const 문제 = []; let 덮음 = 0;
  하루.rows.forEach(r => {
    덮음 += r.끝 - r.시작 + 1;
    [r.시작, r.끝].forEach(t => { const R = E.calc({ year: 2026, month: 12, day: 18, hour: Math.floor(t / 60), minute: t % 60, gender: 'M', longitude: 126.98 });
      const 말 = E.BRANCHES_KO[R.pillars.hour.branch] + '시'; if (말 !== r.시진) 문제.push(r.창 + ' 의 ' + t + '분은 ' + 말 + ' 인데 ' + r.시진 + ' 로 적었다'); });
  });
  if (덮음 !== 1440) 문제.push('덮은 분 ' + 덮음 + ' / 1440');
  return 문제;
});
검사('시각 — 다른 곳(부산)은 서울보다 이르다', () => {
  const b = S.하루(2026, 12, 18, 'M', 'KR:부산').rows.find(r => r.시진 === '미시'), s = 하루.rows.find(r => r.시진 === '미시');
  if (!(b.시작 < s.시작)) return '부산 미시 ' + b.창 + ' · 서울 ' + s.창;
});
검사('60조 — 화면에 점수 · 순위 · 등수가 안 나간다', () => {
  const box = document.getElementById('tkSim'); S.render(box, { date: '2026-12-20' });
  box.querySelectorAll('details').forEach(d => { d.open = true; });
  const 글 = box.querySelector('#tkList').textContent + box.querySelector('#tkTop').textContent;
  const m = 글.match(/\d+\s*점|\d+\s*위|순위|등수|랭킹|TOP/i);
  if (m) return '점수 말이 나갔다: ' + m[0];
});
검사('60 · 65조 — 「걸리는 것 없음」은 거르개 둘(궁통보감 · 자평진전)이 다 안 걸릴 때만 붙고, 적천수는 걸림을 안 매긴다', () => {
  const 문제 = [];
  [[2026, 12, 18], [2026, 12, 20], [2026, 12, 15], [2027, 3, 30]].forEach(([y, m, d]) => S.하루(y, m, d, 'M', 'KR:서울').rows.forEach(r => {
    if (!r.본) return; const 걸 = r.본.눈들.filter(n => n.걸림).length;
    if (r.본.없음 && 걸) 문제.push(m + '/' + d + ' ' + r.시진 + ' 걸림 ' + 걸 + ' 인데 없음');
    if (!r.본.없음 && !걸 && !r.본.눈들.some(n => n.모름)) 문제.push(m + '/' + d + ' ' + r.시진 + ' 걸림 0 인데 없음이 아님');
    if (r.본.눈들.length !== 3) 문제.push('눈이 셋이 아니다');
    if (r.본.눈들[2].걸림 || !r.본.눈들[2].보조) 문제.push(m + '/' + d + ' ' + r.시진 + ' 적천수가 걸림을 매겼다');
  }));
  return 문제;
});
검사('68조 — 으뜸은 걸리는 것 없는 자리 가운데, 궁통보감의 먼저 찾는 글자와 돕는 글자가 하늘에 다 뜬 곳이다', () => {
  const 문제 = []; let 으뜸수 = 0;
  for (let d = 1; d <= 31; d++) S.하루(2026, 10, d, 'M', 'KR:서울').rows.forEach(r => {
    if (!r.본 || !r.본.으뜸) return; 으뜸수++;
    if (!r.본.없음) 문제.push(d + '일 ' + r.시진 + ' 걸리는데 으뜸');
    const mid = Math.floor((r.시작 + r.끝) / 2), R = E.calc({ year: 2026, month: 10, day: d, hour: Math.floor(mid / 60), minute: mid % 60, gender: 'M', longitude: 126.98 });
    const j = P.판정(R, new Date(2026, 9, d), { 운들: [] }).층들[0].조후, 하늘 = ['year', 'month', 'hour'].map(k => E.STEMS[R.pillars[k].stem]).join('');
    (j.need + (j.aux || '')).split('').forEach(c => { if (하늘.indexOf(c) < 0) 문제.push(d + '일 ' + r.시진 + ' 으뜸인데 ' + c + ' 가 하늘에 없다(' + 하늘 + ')'); });
    if (!(j.aux || '').length) 문제.push(d + '일 ' + r.시진 + ' 돕는 글자가 없는 칸인데 으뜸');
  });
  if (!으뜸수) 문제.push('10월에 으뜸이 한 곳도 없다');
  return 문제;
});
검사('63조 — 문 하나: 원국 층에 조후와 성패가 실려 나온다', () => {
  const R = E.calc({ year: 2026, month: 12, day: 20, hour: 10, minute: 0, gender: 'M' });
  const 층 = P.판정(R, new Date(2026, 11, 20), { 운들: [] }).층들[0]; const 문제 = [];
  if (!층.조후 || 층.조후.need == null) 문제.push('조후가 없다');
  if (!층.성패 || !층.성패.격) 문제.push('성패가 없다');
  if (!층.표 || !층.표.쌍) 문제.push('생극제화 표가 없다');
  return 문제;
});
검사('66조 — 기세: 적천수 실례 셋(順逆 · 衆寡 · 衰旺)에서 원문이 말한 것과 같다', () => {
  const mk = (t) => { const k = ['year', 'month', 'day', 'hour'], p = {}; t.split(' ').forEach((x, i) => { p[k[i]] = { stem: E.STEMS.indexOf(x[0]), branch: E.BRANCHES.indexOf(x[1]) }; }); return { pillars: p }; };
  const 뜬 = (g) => g.뜬.map(x => E.STEMS[x.stem]).join(''), 선 = (g) => g.선.map(c => c.이름).sort().join('');
  const 문제 = [];
  let g = ChaeksaGise.기세(mk('癸酉 甲子 庚辰 甲申'));   // 順逆 「天干枯木无根，置之不论，谓金水二人同心」
  if (g.꼴 !== '동심' || 선(g) !== '금수' || 뜬(g) !== '甲甲') 문제.push('癸酉 甲子 庚辰 甲申 → ' + g.꼴 + ' ' + 선(g) + ' 뜬 ' + 뜬(g));
  g = ChaeksaGise.기세(mk('戊午 壬戌 丁卯 癸卯'));       // 衆寡 「官煞虽透无根，势在去官」
  if (뜬(g) !== '壬癸') 문제.push('戊午 壬戌 丁卯 癸卯 → 뜬 ' + 뜬(g));
  g = ChaeksaGise.기세(mk('癸卯 乙卯 甲寅 乙亥'));       // 衰旺 「六木两水，别无他气」
  if (g.꼴 !== '동심' || 선(g) !== '목수' || g.으뜸.이름 !== '목' || !g.으뜸이당령) 문제.push('癸卯 乙卯 甲寅 乙亥 → ' + g.꼴 + ' ' + 선(g));
  return 문제;
});
검사('67조 — 원류: 적천수 源流 실례 둘에서 멈춘 곳 · 막는 글자가 원문과 같다', () => {
  const mk = (t) => { const k = ['year', 'month', 'day', 'hour'], p = {}; t.split(' ').forEach((x, i) => { p[k[i]] = { stem: E.STEMS.indexOf(x[0]), branch: E.BRANCHES.indexOf(x[1]) }; }); return { pillars: p }; };
  const 문제 = [];
  let w = ChaeksaGise.원류(mk('庚寅 壬午 戊午 丁巳'));     // 「以火为源头 … 月干壬水隔之，不能流至金」
  if (w.원두.이름 !== '화' || w.멈춤.이름 !== '토' || w.까닭 !== '떨어짐' || w.막는.map(x => E.STEMS[x.stem]).join('') !== '壬') 문제.push('庚寅 壬午 戊午 丁巳 → ' + w.원두.이름 + '…' + w.멈춤.이름 + ' ' + w.까닭);
  w = ChaeksaGise.원류(mk('辛卯 辛卯 丙子 甲午'));         // 「以木为源头，五行无土，不能流至金」
  if (w.원두.이름 !== '목' || w.멈춤.이름 !== '화' || w.까닭 !== '없음') 문제.push('辛卯 辛卯 丙子 甲午 → ' + w.원두.이름 + '…' + w.멈춤.이름 + ' ' + w.까닭);
  return 문제;
});
검사('다리(10-02 개편 3묶음) — 시뮬레이터 끝 비교 상자의 받는 것 · 견본 · 신청 한 줄이 장부 택일 줄 그대로, 신청 단추는 창구 주소대로', () => {
  const Y = window.ChaeksaYaksok; if (!Y) return 'yaksok.js 가 안 실렸다';
  const box = document.getElementById('tkSim'); S.render(box, { date: '2026-12-20' });
  const vs = box.querySelector('.tk-vs'), r = Y.줄('taekil'), 문제 = [];
  if (!vs || !r) return '비교 상자 또는 장부 택일 줄이 없다';
  const 목록 = Array.from(vs.querySelectorAll('li')).map(li => li.textContent);
  if (JSON.stringify(목록) !== JSON.stringify(Y.받는것목록('taekil'))) 문제.push('받는 것이 장부와 다르다: ' + 목록.join(' / '));
  if (!vs.textContent.includes(r.상품이름)) 문제.push('상품이름이 없다');
  if (!r.견본 || !vs.querySelector('a[href^="' + r.견본 + '"]')) 문제.push('견본 보기 단추가 없다(장부 견본 ' + r.견본 + ')');
  if (!vs.textContent.includes(Y.신청글('taekil'))) 문제.push('신청 한 줄이 장부 신청글이 아니다');
  const 단추 = vs.querySelector('#tkApply'), 폼 = String(window.CHAEKSA_TAEKIL_INTAKE_URL || '').trim();
  if (!단추) 문제.push('신청 단추가 없다');
  else if (폼 ? 단추.getAttribute('href') !== 폼 : !/^taekil-apply\.html/.test(단추.getAttribute('href'))) 문제.push('신청 단추 길 ' + 단추.getAttribute('href') + ' · 창구 ' + 폼);
  if (/\d[\d,]*\s?원/.test(vs.textContent)) 문제.push('값을 손으로 적었다(값은 상품표에서): ' + vs.textContent.match(/\d[\d,]*\s?원/)[0]);
  return 문제;
});
(async () => {
  const 문제 = [];
  for (const f of ['gwanjeom.js', 'taekilsim.js']) {
    const t = (await fetch(f + '?x=' + Date.now()).then(r => r.text())).replace(/\/\*[\s\S]*?\*\//g, '').replace(/(^|[^:'"`\\])\/\/[^\n]*/g, '$1');
    const m = t.match(/ChaeksaClassic|ChaeksaTypecard|ChaeksaGyeok|ChaeksaChaeyong|\.strength\b|scoreDay|\.총점/);
    if (m) 문제.push(f + ' 가 ' + m[0] + ' 를 직접 부른다');
  }
  const ok = !문제.length; ok ? 통과++ : 실패++;
  out.insertAdjacentHTML('beforeend', '<h2 class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ ' : '✗ ') + '63조 — 관점과 화면은 엔진 문 말고 다른 판정기를 직접 두드리지 않는다</h2>' + (ok ? '' : '<pre>' + 문제.join('\n') + '</pre>'));
  // 서버와 같은 답(10-02 설계서 ②) — 같은 고정 묶음(지어낸 기간 넷)을 이 브라우저 사슬로 돌린 지문이
  // 비공개 서버 health 의 taekil.지문(lib/taekil-engine.js 지문())과 같아야 초록이다. 엔진을 고치고 비공개 쪽을 안 맞췄으면 여기서 빨개진다.
  {
    const 문제 = [], 서버주소 = 'https://chaeksa-behavior-core.vercel.app/api/health';
    const 묶음 = [['2027-04-12', 5, 'M', 'KR:서울'], ['2026-11-02', 7, 'F', 'KR:부산'], ['2027-01-18', 14, 'M', 'KR:대구'], ['2027-03-10', 3, 'F', 'AB:뉴욕']];
    let s = '', 지문 = '', 서버 = null;
    try {
      for (const [첫, n, g, p] of 묶음) {
        const [y, m, d] = 첫.split('-').map(Number), 곳 = ChaeksaPlaces.resolve(p);
        for (let i = 0; i < n; i++) {
          const t = new Date(Date.UTC(y, m - 1, d + i)), Y = t.getUTCFullYear(), M = t.getUTCMonth() + 1, D = t.getUTCDate();
          const h = S.하루(Y, M, D, g, p);
          s += JSON.stringify([Y, M, D, '일월화수목금토'[t.getUTCDay()], h]);
          h.rows.filter(r => r.본 && r.본.없음).forEach(r => {
            const c = Math.floor((r.시작 + r.끝) / 2);
            const R = E.calc({ year: Y, month: M, day: D, hour: Math.floor(c / 60), minute: c % 60, gender: g, longitude: 곳.lon, tzOffset: 곳.tzOffset });
            s += JSON.stringify(W.대운(R, g));
          });
        }
      }
      const 해시 = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
      지문 = Array.from(new Uint8Array(해시)).map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
    } catch (e) { 문제.push('브라우저 지문을 못 냈다: ' + e.message); }
    try {
      const j = await fetch(서버주소, { cache: 'no-store' }).then(r => r.json());
      서버 = j && j.taekil;
      if (!서버 || !서버.지문) 문제.push('비공개 서버 health 에 taekil 지문이 없다' + (서버 && 서버.오류 ? '(' + 서버.오류 + ')' : '(비공개 서버 배포 전이면 배포 뒤 다시)'));
    } catch (e) { 문제.push('비공개 서버에 닿지 못했다(' + 서버주소 + '): ' + e.message); }
    if (지문 && 서버 && 서버.지문 && 지문 !== 서버.지문) 문제.push('브라우저 ' + 지문 + ' · 서버 ' + 서버.지문 + ' — 공개 엔진과 비공개 vendor 가 다르다(비공개 저장소 node tools/sync-vendor.js --check)');
    const ok = !문제.length; ok ? 통과++ : 실패++;
    out.insertAdjacentHTML('beforeend', '<h2 class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ ' : '✗ ') + '서버와 같은 답 — 브라우저 사슬 지문 ' + (지문 || '?')
      + ' = 비공개 서버 지문 ' + ((서버 && 서버.지문) || '?') + (서버 && 서버.commit ? ' (서버 엔진 커밋 ' + 서버.commit.slice(0, 7) + (서버.dirty ? ' · 커밋 전 판' : '') + ')' : '') + '</h2>'
      + (ok ? '' : '<pre>' + 문제.join('\n') + '</pre>'));
  }
  out.insertAdjacentHTML('afterbegin', '<p><b>' + 통과 + ' 통과 · ' + 실패 + ' 실패</b></p>');
})();
</script>
</body></html>
