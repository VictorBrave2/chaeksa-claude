<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>정통사주 · 가상 명식 견본 | 책사</title>
<link rel="stylesheet" href="../jeongtong-pyo.css?v=f55dde66b6">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4ed;color:#252925;font-family:'Noto Sans KR',sans-serif}button,a,summary{outline-offset:4px}h1,h2,h3,p{margin:0}a{color:inherit}header{border-bottom:1px solid #ded8cb;background:#fffdf8}.example-mast{max-width:770px;margin:auto;padding:18px 24px;display:flex;justify-content:space-between;gap:20px;align-items:center}.example-brand{font-family:'Noto Serif KR',serif;font-size:23px;font-weight:600;text-decoration:none}.example-mast span{font-size:12px;color:#68685e}.example-controls{max-width:770px;margin:auto;padding:23px 24px 0}.example-controls p{font-size:12px;line-height:1.8;color:#68685e}.example-tabs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.example-tabs button{border:1px solid #d4c8b1;background:transparent;color:#715325;padding:10px 15px;font:inherit;font-size:13px;min-height:44px;border-radius:4px;cursor:pointer}.example-tabs button[aria-pressed=true]{background:#86612a;color:#fffdf8}.example-main{max-width:770px;margin:auto;padding:0 20px 50px}.example-error{padding:30px 0;line-height:1.8}.jtp .jtp-story{--body-bg:transparent}.jtp .jtp-story .chapter-nav{padding-top:25px}.jtp .jtp-story .chapter{padding-bottom:32px}.jtp .jtp-story .chapter h2{font-family:var(--serif)}.jtp .jtp-story .filter-section-heading h2{font-family:var(--sans)}@media(max-width:600px){.example-main{padding:0 16px 35px}.example-controls{padding:20px 22px 0}.example-mast{padding:16px 22px}}
</style>
</head>
<body>
<header><div class="example-mast"><a class="example-brand" href="../">策 책사</a><span>정통사주 · 가상 명식 견본</span></div></header>
<div class="example-controls"><p>무작위로 만든 생년월일의 가상 이용자 세 명입니다.<br>실제 사람의 출생 정보가 아닙니다. 라이브와 같은 화면으로 표시합니다.</p><div class="example-tabs" aria-label="가상 명식 선택" id="examples"></div></div>
<main class="example-main jtp"><div id="result" aria-live="polite"><p class="example-error">견본을 불러오고 있습니다.</p></div></main>
<script src="../jeongtong-classic-reading.js?v=ef886463d5"></script><script src="../jeongtong-distinct-reading.js?v=35f67494cd"></script><script src="../jeongtong-model-reading.js?v=76a35bedd9"></script><script src="../jeongtong-story.js?v=9e4c7dc43c"></script>
<script>
(async function(){
 const host=document.getElementById('result'),tabs=document.getElementById('examples');
 try{
  const response=await fetch('jeongtong-reader.json?v=bc1edaf9eb');if(!response.ok)throw Error();
  const data=await response.json();
  data.cases.forEach((item,i)=>{const b=document.createElement('button');b.type='button';b.textContent=item.label;b.setAttribute('aria-pressed','false');b.onclick=()=>show(i);tabs.append(b)});
  function show(i){[...tabs.children].forEach((b,n)=>b.setAttribute('aria-pressed',String(n===i)));ChaeksaNameSeason.mount(host,ChaeksaJeongtongModelReading.applyModel(data.cases[i].story));}
  show(0);
 }catch(_){host.innerHTML='<p class="example-error">견본을 불러오지 못했습니다. 새로고침해 주세요.</p>'}
})();
</script>
</body></html>
