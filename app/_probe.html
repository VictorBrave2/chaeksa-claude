<script>
(function(){
  var now = new Date(2026,7,30);
  var cases = [
    {year:1990,month:5,day:12,hour:7,minute:20},
    {year:1985,month:11,day:3,hour:14,minute:0},
    {year:1998,month:2,day:22,hour:23,minute:10},
    {year:1976,month:7,day:8,hour:4,minute:30},
    {year:2001,month:9,day:17,hour:19,minute:45}
  ];
  var lines = [];
  cases.forEach(function(c){
    lines.push('================ ' + JSON.stringify(c));
    try {
      var R = ChaeksaEngine.calc(c);
      var F = ChaeksaTypecard.간명자료(R, now);
      lines.push('--- 운로: ' + JSON.stringify(F.운로));
      lines.push('--- 궁위한방.해: ' + (F.궁위한방 && F.궁위한방.해));
      lines.push('--- 과거연대기 해: ' + (F.과거연대기||[]).map(function(x){return x.해;}).join(','));
      lines.push('--- 인연결론: ' + JSON.stringify(F.인연결론));
      lines.push('--- 재물결론: ' + JSON.stringify(F.재물결론));
      lines.push('--- 지킬해: ' + JSON.stringify(F.지킬해));
      lines.push('--- 궁통보감: ' + JSON.stringify(F.궁통보감));
      lines.push('--- 자평진전 null? ' + (F.자평진전==null));
      lines.push(ChaeksaDan.의논(R, now, F));
    } catch(e) { lines.push('ERR ' + e.message + '\n' + e.stack); }
  });
  document.getElementById('out').textContent = lines.join('\n');
})();
</script>
