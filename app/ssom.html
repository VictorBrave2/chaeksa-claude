<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>웹툰궁합 — 우리 둘 이야기를 웹툰으로 · 책사</title>
<meta name="description" content="두 분의 일지와 식상으로, 내가 바라는 것을 상대가 어떻게 주는지 · 상대가 바라는 것을 내가 어떻게 주는지 양쪽을 따로 읽어 썸의 여섯 질문에 답합니다.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1129">
<style>
  .doc{max-width:660px;margin:0 auto;padding:22px 16px 80px}
  .back{display:inline-block;margin-bottom:16px;font-size:13px;color:var(--ink3);text-decoration:none}
  .doc h1{font-family:var(--serif);font-size:24px;line-height:1.45;margin:0 0 8px}
  .doc .lead{font-size:14.5px;line-height:1.85;color:var(--ink2);margin:0 0 18px}
  .jt-form .jt-notime{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin-top:-2px}
  .jt-form .jt-notime input{width:18px;height:18px;margin:0;padding:0}
  .jt-form input:disabled{opacity:.45}
  #gcForm.card{padding:0;overflow:hidden}
  #gcForm .gc-head,#gcForm .jt-form{margin-left:18px;margin-right:18px}
  #gcForm>button{margin:6px 18px 18px;width:calc(100% - 36px)!important}
  .gc-cut{position:relative;height:210px;overflow:hidden;background:#0e0c22}
  .gc-cut img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block;transition:opacity .25s}
  .gc-cut::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(14,12,34,0) 45%,var(--card,#16143a) 100%)}
  .gc-bubble{position:absolute;left:18px;right:18px;bottom:14px;z-index:1;background:rgba(255,255,255,.94);color:#1b1836;border-radius:16px;padding:12px 16px;font-size:16px;line-height:1.5;font-family:var(--letter);box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .gc-bubble::before{content:'';position:absolute;left:28px;top:-9px;border:10px solid transparent;border-top:0;border-bottom-color:rgba(255,255,255,.94)}
  .gc-bubble b{display:block;font-size:11.5px;letter-spacing:.08em;color:#8a6d2f;font-family:var(--sans);margin-bottom:2px}
  #gcCutB{margin-top:6px}
  .gc-head{margin-top:14px!important}
  .jt-more{grid-column:1/-1;margin-top:2px}
  .jt-more summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border:1px dashed var(--line2,rgba(230,201,138,.45));border-radius:12px;font-size:14.5px;color:var(--ink,#f7f3ff);background:rgba(230,201,138,.06)}
  .jt-more summary::-webkit-details-marker{display:none}
  .jt-more summary::after{content:'＋ 펼치기';font-size:13px;color:var(--gold,#e6c98a);white-space:nowrap;margin-left:10px}
  .jt-more[open] summary::after{content:'－ 접기'}
  .jt-more[open] summary{border-style:solid;margin-bottom:10px}
  .jt-more[open]{display:grid;grid-template-columns:inherit;gap:inherit}
  .jt-more[open] summary{grid-column:1/-1}
</style>
</head>
<body>
<div class="doc">
  <a class="back" href="./">← 책사 홈</a>
  <h1>웹툰궁합</h1>
  <p class="lead">두 사람 생년월일만 넣으면 우리 둘 이야기를 웹툰으로 그려 드려요. 로그인 없이 무료예요.</p>
  <!-- 09-25 사장님 「생년월일시 입력부터 웹툰식으로」 — 입력도 컷 + 책사 말풍선. 성별을 고르면 컷 그림이 바뀐다(ssom.js 컷바꾸기). -->
  <form id="gcForm" class="card">
    <div class="gc-cut" id="gcCutA"><img src="art/ss-her-s.webp" alt=""><div class="gc-bubble"><b>책사</b>당신부터요. 언제 태어났어요?</div></div>
    <div class="gc-head">나</div>
    <div class="jt-form">
      <label>생년월일<input type="date" id="gcDateA" required></label>
      <label>성별<select id="gcGA"><option value="F">여</option><option value="M">남</option><option value="">모름</option></select></label>
      <details class="jt-more"><summary><span>태어난 시각 · 곳 <small style="opacity:.7;white-space:nowrap">(알면 더 정확해요)</small></span></summary>
      <label>태어난 시각<input type="time" id="gcTimeA" value="12:00"></label>
      <label class="jt-notime"><input type="checkbox" id="gcNoTimeA" checked>시간을 몰라요</label>
      <label>태어난 곳<select id="gcPlaceA"><option value="KR:서울">서울</option></select></label>
      </details>
    </div>
    <div class="gc-cut" id="gcCutB"><img src="art/ss-me-s.webp" alt=""><div class="gc-bubble"><b>책사</b>그 사람은요?</div></div>
    <div class="gc-head">그 사람</div>
    <div class="jt-form">
      <label>생년월일<input type="date" id="gcDateB" required></label>
      <label>성별<select id="gcGB"><option value="M">남</option><option value="F">여</option><option value="">모름</option></select></label>
      <details class="jt-more"><summary><span>태어난 시각 · 곳 <small style="opacity:.7;white-space:nowrap">(알면 더 정확해요)</small></span></summary>
      <label>태어난 시각<input type="time" id="gcTimeB" value="12:00"></label>
      <label class="jt-notime"><input type="checkbox" id="gcNoTimeB" checked>시간을 몰라요</label>
      <label>태어난 곳<select id="gcPlaceB"><option value="KR:서울">서울</option></select></label>
      </details>
    </div>
    <div class="jt-form hide"><label>지금 두 사람은<select id="gcStage"><option value="시작전">시작 전 — 짝사랑 · 소개팅</option><option value="썸" selected>썸 — 막 알아 가는 중</option><option value="초반">연애 초반 — 사귄 지 6개월까지</option><option value="안정기">안정기 — 6개월에서 2년</option><option value="결혼">결혼을 생각할 때</option><option value="흔들림">흔들릴 때 — 권태 · 이별 고민</option><option value="재회">헤어진 뒤 — 재회</option></select></label><label class="hide">처음 만난 달<input type="month" id="gcMet"></label></div>
    <button type="submit" class="btn" style="width:100%">우리 둘 이야기 보기</button>
  </form>
  <div id="gcOut"></div>
</div>
<script>
(function(){var m=localStorage.getItem('chaeksa.theme')||'auto',h=new Date().getHours();document.documentElement.setAttribute('data-theme',(m==='night'||(m==='auto'&&(h<6||h>=18)))?'night':'day');})()
</script>

<script src="typecard.js?v=1129"></script><script src="gyeokguk.js?v=1129"></script><script src="classic.js?v=1129"></script><script src="ssom-score.js?v=1129"></script><script src="ssom-score-mal.js?v=1129"></script><script src="ssom.js?v=1129"></script>
</body>
</html>
