<body>

     출산택일 「내 보고서」(taekil-report.html)와 같은 길 — 로그인 → ilgyeol_view(server/migrate-39) → 상태대로 그린다. 본문은 풀이가 열렸을(ready) 때만 받는다.
     결제됐는데 아직 안 만든 주문(todo)이면 이 자리에서 비공개 서버(/api/ilgyeol-report)를 불러 만든다 — 결제 완료 쪽(pay-done)이 3초 뒤 여기로 데려온다. 창을 닫았다 다시 와도 이어진다.
     본문은 비공개 서버가 만든 혼자 서는 HTML 한 벌 — iframe(srcdoc)에 그대로 띄우고 높이만 맞춘다(스크립트 없음 · 사이트 CSS 와 섞이지 않게). 「인쇄 · PDF 로 저장」은 그 안을 인쇄한다(A5 인쇄 꼴은 본문 CSS 에 있다). -->
<div class="mini-head" role="banner"><a class="logo" href="./" title="처음 화면으로"><i class="seal">策</i><span>책사</span></a><a class="mh-home" href="./">← 홈</a></div>
<div class="doc">

<script src="config.js?v=1dadeed655"></script>

<script src="usage.js?v=0c1ca14b01"></script>

<script>
(function () {
  var m = '';
  try { m = localStorage.getItem('chaeksa.theme') || 'auto'; } catch (e) { m = 'auto'; }
  var h = new Date().getHours();
  var night = m === 'night' || (m === 'auto' && (h < 6 || h >= 18));
  document.documentElement.setAttribute('data-theme', night ? 'night' : 'day');

  var out = document.getElementById('igr'), sub = document.getElementById('sub');
  var P = window.ChaeksaPay, G = P && P.ilgyeol, C = window.ChaeksaCloud;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); };
  var 문의 = 'dl4431@naver.com';
  function 그림(html) { out.innerHTML = html; }
  function 상자(머리, 글들, 아래) {
    return '<div class="tkr-state"><h2>' + esc(머리) + '</h2>' + (글들 || []).map(function (t) { return '<p>' + esc(t) + '</p>'; }).join('') + (아래 || '') + '</div>';
  }
  if (!G || !G.view) { 그림(상자('풀이를 불러오지 못했어요', ['새로고침해 주세요. 계속 안 되면 ' + 문의 + ' 으로 알려 주세요.'])); return; }

  // 로그인에서 돌아왔으면 토큰을 받아 둔다. 로그인 복귀 주소에는 ?o= 가 없어서 떠나기 전에 적어 둔 주문번호를 잇는다(출산택일 쪽과 같은 처리).
  try { if (C && C.captureRedirect) C.captureRedirect(); } catch (e) {}
  try { localStorage.removeItem('chaeksa.return'); } catch (e) {}
  var q = new URLSearchParams(location.search), o = q.get('o') || '', 키 = 'chaeksa.igReport';
  var 꼴 = /^[A-Za-z0-9_-]{6,100}$/;
  if (!o) {
    try {
      var j = JSON.parse(localStorage.getItem(키) || 'null');
      if (j && Date.now() - (j.at || 0) < 30 * 60 * 1000 && 꼴.test(j.o || '')) { o = j.o; history.replaceState(null, '', location.pathname + '?o=' + encodeURIComponent(o)); }
    } catch (e) {}
  }
  try { localStorage.removeItem(키); } catch (e) {}
  var 손님눈 = q.get('as') === 'customer';   // 검수 계정의 「손님 눈으로 보기」

  function 로그인됨() { try { return !!(C && C.signedIn && C.signedIn()); } catch (e) { return false; } }
  function 로그인하러() {
    try { localStorage.setItem(키, JSON.stringify({ o: o, at: Date.now() })); } catch (e) {}
    try { localStorage.setItem('chaeksa.return', JSON.stringify({ path: location.pathname, at: Date.now() })); } catch (e) {}
    try { if (C.로그인고르기) C.로그인고르기(); else C.signInWith('kakao'); } catch (e) { 그림(상자('로그인을 열지 못했어요', [String((e && e.message) || e)])); }
  }
  function 로그인화면(글) {
    그림(상자('로그인하면 풀이가 열려요', [글 || '결제하신 계정(카카오 또는 네이버)으로 로그인해 주세요. 풀이는 그 계정에 보관돼요.'],
      '<button type="button" class="btn kakao" id="go"><span class="seal">話</span>카카오로 로그인</button>'));
    document.getElementById('go').onclick = 로그인하러;
  }
  if (!꼴.test(o)) {
    그림(상자('주문번호가 없어요', ['소개 쪽 「내 결과」나 홈 설정 「내 결제」의 「보러 가기」로 들어와 주세요.'], '<a class="btn" href="ilgyeol.html">소개 쪽으로 가기</a>'));
    return;
  }
  sub.textContent = '주문번호 ' + o;
  if (!로그인됨()) { 로그인화면(); return; }

  // ── 만들기 · 기다리기 ──
  var 만들었음 = false, 기다림 = null, 시작 = Date.now(), 한도 = 8 * 60 * 1000;
  function 만드는중(말) {
    그림(상자('여덟 글자와 명반을 세우고 글을 쓰는 중이에요', [말|| '보통 1~2분 걸려요. 이 창을 그대로 두시면 다 되는 대로 열려요. 닫아도 돼요 — 소개 쪽 「내 결과」와 홈 설정 「내 결제」에서 이어져요.']));
  }
  function 기다리기() {
    clearTimeout(기다림);
    if (Date.now() - 시작 > 한도) { 그림(상자('오래 걸리고 있어요', ['잠시 뒤 소개 쪽 「내 결과」에서 다시 봐 주세요. 계속 안 되면 ' + 문의 + ' 으로 주문번호를 알려 주세요.'], '<a class="btn" href="ilgyeol.html">소개 쪽으로 가기</a>')); return; }
    기다림 = setTimeout(function () { 불러오기(true); }, 6000);
  }
  function 만들기() {
    if (만들었음) { 기다리기(); return; }
    만들었음 = true; 만드는중();
    G.make(o).then(function (r) {
      if (r && r.ok) { clearTimeout(기다림); 불러오기(true); return; }
      if (r && r.reason === 'busy') { 기다리기(); return; }   // 다른 창에서 만드는 중 — 기다린다
      if (r && r.reason === 'login') { 로그인화면('로그인이 끝났어요. 다시 로그인하면 이어서 만들어요.'); return; }
      clearTimeout(기다림);
      그림(상자('풀이를 만들지 못했어요', [(r && r.message) || '잠시 뒤 다시 해 주세요.', '결제는 그대로 있어요. 계속 안 되면 ' + 문의 + ' 으로 주문번호를 알려 주세요.'],
        '<button type="button" class="btn ghost" id="again">다시 해 보기</button>'));
      document.getElementById('again').onclick = function () { 만들었음 = false; 불러오기(); };
    });
    기다리기();
  }

  var 그렸음 = false;
  function 보고서(r, 머리글) {
    clearTimeout(기다림);
    if (그렸음) return;   // 기다리던 물음과 만들기 답이 겹쳐 와도 한 번만 그린다
    그렸음 = true;
    var rep = r.report || {};
    if (rep.만든날) sub.textContent = '주문번호 ' + o + ' · ' + rep.만든날 + ' 만듦';
    그림((머리글 || '') + '<div class="igr-tools"><button type="button" class="btn ghost small" id="print">인쇄 · PDF 로 저장</button>'
      + '<a class="btn ghost small" href="ilgyeol.html">← 소개 쪽</a></div>'
      + '<iframe id="igFrame" class="igr-frame" title="나는 뭐해 먹고 살까? 풀이" scrolling="no"></iframe>');
    var f = document.getElementById('igFrame');
    function 키맞춤() { try { var d = f.contentDocument; if (d && d.documentElement) f.style.height = (d.documentElement.scrollHeight + 24) + 'px'; } catch (e) {} }
    f.addEventListener('load', function () {
      키맞춤(); setTimeout(키맞춤, 500); setTimeout(키맞춤, 2000);
      try { new ResizeObserver(키맞춤).observe(f.contentDocument.body); } catch (e) {}
      window.addEventListener('resize', 키맞춤);
    });
    f.srcdoc = String(rep.html || '');
    document.getElementById('print').onclick = function () { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { window.print(); } };
  }

  // ── 불러오기 — 상태대로 그린다 ──
  function 불러오기(조용히) {
    if (!조용히) 그림('<p class="hint">불러오는 중…</p>');
    G.view(o, 손님눈).then(function (r) {
      clearTimeout(기다림);
      if (그렸음) return;
      if (!r || r.ok === false) {
        var 까닭 = r && r.reason;
        if (까닭 === 'login') { 로그인화면('로그인이 끝났어요. 다시 로그인해 주세요.'); return; }
        if (까닭 === 'missing') { 그림(상자('아직 열 수 없어요', ['서버 준비가 끝나지 않았어요. 잠시 뒤 다시 와 주세요. 계속 안 되면 ' + 문의 + ' 으로 주문번호를 알려 주세요.'])); return; }
        if (까닭 === 'not_found') { 그림(상자('이 주문을 찾지 못했어요', ['결제하신 계정(카카오 또는 네이버)으로 로그인했는지 확인해 주세요.'], '<a class="btn ghost" href="ilgyeol.html">소개 쪽으로 가기</a>')); return; }
        if (까닭 === 'expired') { 그림(상자('볼 수 있는 기간이 끝났어요', ['결제한 날부터 2년이 지났어요.'])); return; }
        if (까닭 === 'not_paid') { 그림(상자('결제가 확인되지 않은 주문이에요', ['결제가 끝난 주문만 볼 수 있어요.'])); return; }
        if (조용히 && (까닭 === 'network' || 까닭 === 'db')) { 기다리기(); return; }
        그림(상자('풀이를 불러오지 못했어요', ['잠시 뒤 새로고침해 주세요. 계속 안 되면 ' + 문의 + ' 으로 주문번호를 알려 주세요.']));
        return;
      }
      // 검수 계정 — 사장님 몫(본문 · 걸린 것)을 받는다. 손님에게 열렸는지와 상관없이 풀이를 보여 주되, 손님 상태를 위에 적는다.
      if (r.admin) {
        var 띠 = '<div class="tkr-banner">검수 계정으로 보는 중 — 표 상태 ' + esc(r.view || '-') + ' · 손님 눈 ' + esc(r.cstate || '-')
          + (r.missing && r.missing.length ? ' · 걸린 것 ' + r.missing.length + '(' + esc(r.missing.join(' / ')) + ')' : '')
          + ' · <a href="ilgyeol-admin.html">사장님 목록</a> · <a href="?o=' + encodeURIComponent(o) + '&amp;as=customer">손님 눈으로 보기</a></div>';
        if (r.report) { 보고서(r, 띠); return; }
        if (r.view === 'making') { 그림(띠); 만드는중(); 기다리기(); return; }
        if (r.view === 'todo') { 만들기(); return; }
        그림(띠 + 상자('아직 만든 풀이가 없어요', ['상태 ' + (r.view || '-') + ' — 사장님 목록에서 만들 수 있어요.']));
        return;
      }
      var st = r.state;
      if (st === 'ready' && r.report) { 보고서(r); return; }
      if (st === 'todo') { 만들기(); return; }
      if (st === 'making') { 만드는중(); 기다리기(); return; }
      if (st === 'no_intake') { 그림(상자('신청서가 이 주문에 붙지 않았어요', ['주문번호와 함께 ' + 문의 + ' 으로 알려 주시면 이어서 만들어 드려요.'], '<a class="btn ghost" href="mailto:' + 문의 + '?subject=' + encodeURIComponent('[책사] 나는 뭐해 먹고 살까? ' + o) + '">메일로 알리기</a>')); return; }
      if (st === 'canceled') { 그림(상자('환불된 주문이에요', [G.상태말.canceled])); return; }
      // checking — 책사 확인 대기 · 막힘 · 만들 횟수를 다 씀
      그림(상자('책사가 한 번 더 확인하고 있어요', [G.상태말.checking, '확인이 끝나면 이 주소와 소개 쪽 「내 결과」에서 열려요.'], '<a class="btn ghost" href="ilgyeol.html">소개 쪽으로 가기</a>'));
    });
  }
  불러오기();
})();
</script>
