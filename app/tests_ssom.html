<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>썸 궁합 시험</title>
<meta name="robots" content="noindex">
</head><body><div id="out"></div>
<script src="config.js"></script><script src="places.js"></script><script src="astro.js"></script><script src="lunar.js"></script><script src="engine.js"></script>
<script src="saenggeuk.js"></script><script src="gise.js"></script><script src="panjeong.js"></script><script src="typecard.js"></script><script src="gyeokguk.js"></script><script src="ssom-gwanjeom.js"></script><script src="ssom-wongo.js"></script><script src="ssom-dangye.js"></script><script src="ssom-daehwa.js"></script><script src="ssom-webtoon.js"></script>
<script>
// 법전 72조 — 사장님 사례: 남 1992-04-21 00:20 서울 · 여 1999-12-20 20:00 서울. 남이 「나」.
const E = ChaeksaEngine, S = ChaeksaSsom, out = document.getElementById('out');
const 남 = E.calc({ year: 1992, month: 4, day: 21, hour: 0, minute: 20, gender: 'M', longitude: 126.98 });
const 여 = E.calc({ year: 1999, month: 12, day: 20, hour: 20, minute: 0, gender: 'F', longitude: 126.98 });
const 시험 = [
  ['남 丁 일간 — 식상은 戊 상관만(申 · 辰 지장간)', S.식상(남).키, '戊상관'],
  ['여 丙 일간 — 戊 식신 · 己 상관 둘 다', S.식상(여).키, '戊식신+己상관'],
  ['남 일지 卯 · 여 일지 午', S.일지(남) + S.일지(여), '卯午'],
  ['짝 열쇠(남이 나)', S.짝(남, 여).키, '丁卯×戊식신+己상관 / 丙午×戊상관'],
  ['남 丁卯 — 일지 卯는 丁에게 편인 · 여 丙午 — 午는 丙에게 겁재', S.일지십신(남) + S.일지십신(여), '편인겁재'],
  ['때 — 남 26년 8월: 원국 상관만 → 운(대운 未 · 세운 午 속 己 식신)으로 둘 다', S.때상태(남, 2026, 8).원구성 + '→' + S.때상태(남, 2026, 8).구성, '상관만→둘 다'],
  ['때 — 남 26년 9월: 일지 卯가 월운 酉에 충(흔들림)', S.때상태(남, 2026, 9).충.map(x => x.층 + x.운지).join(','), '월운酉'],
  ['닿음 열쇠 — 남이 받을 때 편인|둘 다 · 여가 받을 때 겁재|상관만', S.닿음키(남, 여) + ' / ' + S.닿음키(여, 남), '편인|둘 다 / 겁재|상관만'],
  ['72조 ⑥ 언행 — 남 丁: 戊 상관 숨음(申 · 辰 속)', S.언행(남).map(x => x.키 + (x.드러남 ? '드러남' : '숨음')).join(','), '戊상관숨음'],
  ['72조 ⑥ ⑧ 언행 — 여 丙: 己 상관 드러남(연간) 먼저 · 戊 식신 드러남(시간) 후순위', S.언행(여).map(x => x.키 + (x.드러남 ? '드러남' : '숨음')).join(','), '己상관드러남,戊식신드러남'],
  ['단계 일곱 — 사장님 쌍은 썸 밖 여섯 단계의 질문마다 원고가 있다', (ChaeksaSsomDangye.단계.filter(d => d.질문).every(d => Math.max(((ChaeksaSsomDangye.원고[S.짝(남, 여).키] || {})[d.키] || []).length, (((window.ChaeksaSsomDaehwa || {})[S.짝(남, 여).키] || {}).단계 || {})[d.키] ? ChaeksaSsomDaehwa[S.짝(남, 여).키].단계[d.키].length : 0) === d.질문.length)) ? '모두' : '빠짐', '모두'],
  ['때 풀이 — 남 9월: 酉가 일지를 쳐서 현실 일과 돈에 밀려남, 대운 합이 붙듦', /일과 돈 문제에 마음이 밀려요/.test(S.때풀이(남, 2026, 9).바람.join(' ')) && /크게 흔들리진 않아요/.test(S.때풀이(남, 2026, 9).바람.join(' ')) ? '맞음' : S.때풀이(남, 2026, 9).바람.join(' / '), '맞음'],
  ['때 견줌 — 남 8월 → 9월: 월운 戊 상관이 빠져도 원국에 있으니 「평소만큼」', /평소만큼/.test(S.때견줌(남, S.때풀이(남, 2026, 8), S.때풀이(남, 2026, 9)).join(' ')) ? '맞음' : '틀림', '맞음'],
  ['72조 ⑦ 일지 변질 — 남 丁卯: 26년 10월(戌) 卯가 묶여 乙 편인 → 甲 정인', /따뜻하게 받아 주는 사람/.test(S.때풀이(남, 2026, 10).바람.join(' ')) ? '맞음' : '틀림', '맞음'],
  ['72조 ⑦ 식상 변질 — 여 丙午: 식신 戊가 운 癸에 묶이면 상관 쪽으로(26년 5월 癸巳)', S.때풀이(여, 2026, 5).언.some(v => v.변질 && v.십신 === '상관') ? '맞음' : '틀림', '맞음'],
  ['첫 원고가 그 열쇠에 붙어 있고 질문 여섯', (ChaeksaSsomWongo[S.짝(남, 여).키] || []).length, 6],
  // 작업판 21 — 뼈대 + 조각 조립(ssom-webtoon.js) 시범: 썸 1 · 2회
  ['웹툰 조립 — 丁卯 × 丙午 썸 1 · 2회에 빈 조각이 없다', (() => { const w = ChaeksaSsomWebtoon.조립(남, 여, '썸'); return w && w.length === 2 && !w.flat().some(x => /쓰고 있어요/.test(x[1])) ? '없음' : '있음'; })(), '없음'],
  ['웹툰 조립 — 썸 1회 노트북 대사가 원고 그대로(나/너 → 당신/상대)', ChaeksaSsomWebtoon.조립(남, 여, '썸')[0].filter(x => x[0] === '당신').map(x => x[1]).join('|'), '그냥… 설정 하나 바꿨어요. 근데 이거 구조 은근 재밌네요. 이거 보세요.'],
  ['웹툰 조립 — 단서는 엔진 문장: 丁火 · 卯 · 乙 편인', ChaeksaSsomWebtoon.조립(남, 여, '썸')[1].filter(x => x[0] === '단서').map(x => x[1]).join(''), '丁火에게 배우자궁 卯 속 乙은 편인, 말 안 해도 알아채 주는 사람을 바라요.'],
  ['웹툰 조립 — 다른 쌍(여 × 남 뒤집음)은 빈 조각 자리를 보인다', ChaeksaSsomWebtoon.조립(여, 남, '썸')[0].some(x => /쓰고 있어요/.test(x[1])) ? '보임' : '안 보임', '보임'],
];
let 통과 = 0, 실패 = 0;
시험.forEach(([이름, 실제, 기대]) => { const ok = 실제 === 기대; ok ? 통과++ : 실패++; out.insertAdjacentHTML('beforeend', '<h2 class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ ' : '✗ ') + 이름 + (ok ? '' : ' — 기대 ' + 기대 + ' 실제 ' + 실제) + '</h2>'); });
out.insertAdjacentHTML('afterbegin', '<p>' + 통과 + ' 통과 · ' + 실패 + ' 실패</p>');
</script></body></html>
