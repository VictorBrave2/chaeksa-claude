<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>썸 궁합 시험</title>
<meta name="robots" content="noindex">
</head><body><div id="out"></div>
<script src="config.js"></script><script src="places.js"></script><script src="astro.js"></script><script src="lunar.js"></script><script src="engine.js"></script>
<script src="saenggeuk.js"></script><script src="gise.js"></script><script src="panjeong.js"></script><script src="typecard.js"></script><script src="gyeokguk.js"></script><script src="ssom-gwanjeom.js"></script><script src="ssom-wongo.js"></script><script src="ssom-dangye.js"></script>
<script>
// 법전 72조 — 사장님 사례: 남 1992-04-21 00:20 서울 · 여 1999-12-20 20:00 서울. 남이 「나」.
const E = ChaeksaEngine, S = ChaeksaSsom, out = document.getElementById('out');
const 남 = E.calc({ year: 1992, month: 4, day: 21, hour: 0, minute: 20, gender: 'M', longitude: 126.98 });
const 여 = E.calc({ year: 1999, month: 12, day: 20, hour: 20, minute: 0, gender: 'F', longitude: 126.98 });
const 시험 = [
  ['남 丁 일간 — 식상은 戊 상관만(申 · 辰 지장간)', S.식상(남).키, '戊상관'],
  ['여 丙 일간 — 戊 식신 · 己 상관 둘 다', S.식상(여).키, '戊식신+己상관'],
  ['남 일지 卯 · 여 일지 午', S.일지(남) + S.일지(여), '卯午'],
  ['짝 열쇠(남이 나)', S.짝(남, 여).키, '丁卯×戊식신+己상관 / 丙午×戊상관'],
  ['남 丁卯 — 일지 卯는 丁에게 편인 · 여 丙午 — 午는 丙에게 겁재', S.일지십신(남) + S.일지십신(여), '편인겁재'],
  ['때 — 남 26년 8월: 원국 상관만 → 운(대운 未 · 세운 午 속 己 식신)으로 둘 다', S.때상태(남, 2026, 8).원구성 + '→' + S.때상태(남, 2026, 8).구성, '상관만→둘 다'],
  ['때 — 남 26년 9월: 일지 卯가 월운 酉에 충(흔들림)', S.때상태(남, 2026, 9).충.map(x => x.층 + x.운지).join(','), '월운酉'],
  ['닿음 열쇠 — 남이 받을 때 편인|둘 다 · 여가 받을 때 겁재|상관만', S.닿음키(남, 여) + ' / ' + S.닿음키(여, 남), '편인|둘 다 / 겁재|상관만'],
  ['72조 ⑥ 언행 — 남 丁: 戊 상관 숨음(申 · 辰 속)', S.언행(남).map(x => x.키 + (x.드러남 ? '드러남' : '숨음')).join(','), '戊상관숨음'],
  ['72조 ⑥ 언행 — 여 丙: 戊 식신 드러남(시간) · 己 상관 드러남(연간)', S.언행(여).map(x => x.키 + (x.드러남 ? '드러남' : '숨음')).join(','), '戊식신드러남,己상관드러남'],
  ['단계 일곱 — 사장님 쌍은 썸 밖 여섯 단계의 질문마다 원고가 있다', (ChaeksaSsomDangye.단계.filter(d => d.질문).every(d => ((ChaeksaSsomDangye.원고[S.짝(남, 여).키] || {})[d.키] || []).length === d.질문.length)) ? '모두' : '빠짐', '모두'],
  ['첫 원고가 그 열쇠에 붙어 있고 질문 여섯', (ChaeksaSsomWongo[S.짝(남, 여).키] || []).length, 6],
];
let 통과 = 0, 실패 = 0;
시험.forEach(([이름, 실제, 기대]) => { const ok = 실제 === 기대; ok ? 통과++ : 실패++; out.insertAdjacentHTML('beforeend', '<h2 class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ ' : '✗ ') + 이름 + (ok ? '' : ' — 기대 ' + 기대 + ' 실제 ' + 실제) + '</h2>'); });
out.insertAdjacentHTML('afterbegin', '<p>' + 통과 + ' 통과 · ' + 실패 + ' 실패</p>');
</script></body></html>
