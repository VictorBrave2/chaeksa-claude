<script id="tests">
(function () {
  const V = window.ChaeksaTaekilReport, P = window.ChaeksaPay, MC = window.ChaeksaMyeongsikCard;
  const out = document.getElementById('out'); let 통과 = 0, 실패 = 0; const 실패목록 = [];

    const ok = !문제.length; ok ? 통과++ : (실패++, 실패목록.push(이름 + '\n  ' + 문제.join('\n  ')));

    out.insertAdjacentHTML('beforeend', '<h2 class="r ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ ' : '✗ ') + esc(이름) + '</h2>' + (ok ? '' : '<pre>' + esc(문제.join('\n')) + '</pre>'));
  };
  function 검사(이름, fn) { let 문제 = []; try { const r = fn(); if (r) 문제 = [].concat(r).filter(Boolean); } catch (e) { 문제 = [e.message + '\n' + e.stack]; } 쓰기(이름, 문제); }
  const J = (v) => JSON.stringify(v);
  const 셈 = (s, w) => s.split(w).length - 1;
  if (!V || !P) { 쓰기('파일이 실렸다', ['ChaeksaTaekilReport 또는 ChaeksaPay 가 없다']); window.시험결과 = { 통과, 실패, 실패목록 }; return; }

  // 지어낸 보고서 — 비공개 lib/taekil-report.js 의 꼴(칸 id · 노드 k)만 흉내 낸다. 값은 지어냈다.
  const 보고서 = {
    v: 'taekil-report-0.1', order: ['greet', 'readback', 'verdict', 'block', 'alldays', 'receipt', 'zzz'],
    card: { place: 'KR:서울', g: 'M' }, cards: [{ slot: '2027-04-12T08:32', label: '1번 — 으뜸' }],
    greet: { head: '', body: [{ k: 'p', t: '안녕하세요.' }, { k: 'p', t: '<img src=x onerror=alert(1)>' }] },
    readback: { head: '이렇게 읽었어요', body: [{ k: 'read', 칸: 'range', 이름: '출산 예정 기간', 말: '2027년 4월 12일(월) ~ 16일(금), 5일', 못읽음: false },
      { k: 'read', 칸: 'place', 이름: '태어날 지역', 말: '목록에서 찾지 못했어요', 못읽음: true }, { k: 'nope', t: '모르는 노드' }] },

      { k: 'pillars', part: '명식', 한자: '時 壬辰 · 日 辛酉 · 月 甲辰 · 年 丁未', 읽기: '지어낸 읽기', 글자: [{ 자: '壬', 자리: '時干', 말: '時干 임수(壬) — 지어낸 뜻' }] },
      { k: 'han', part: '자평', 고전: '자평진전', 꼴: '원문', 글: '財輕比重', 뜻: '지어낸 뜻풀이' },
      { k: 'p', t: '대운(10년마다 바뀌는 운) — 남아 기준이에요.', part: '대운' }, { k: 'list', items: ['2~11살 지어낸 대운', '12~21살 지어낸 대운'], part: '대운' },
      { k: 'p', t: '병원 시간 — 지어낸 줄', part: '병원' }] }] },
    alldays: { head: '날짜별로 전부', 접힘: true, body: [{ k: 'fold', head: '날짜별로 펼쳐 보기', body: [{ k: 'list', items: ['4월 12일(월)', '자 00:00~01:32 · 지어낸 줄'] }] }] },
    receipt: { head: '결제 · 다시 보는 곳', body: [{ k: 'p', t: '주문번호 — ck_taekil_20261002120000_test0001' }] },
    zzz: { head: '없는 칸', body: [{ k: 'p', t: '그리면 안 된다' }] },
  };

  검사('그리기 — 칸 차례 · 머리 · 모르는 칸 · 모르는 노드는 그리지 않는다', () => {
    const h = V.그리기(보고서), 문제 = [];
    const 칸들 = Array.from(h.matchAll(/data-sec="([a-z_]+)"/g)).map((m) => m[1]);
    // 10-05 근거는 부록으로 — 부록 칸(appendix)은 close · receipt 앞에 붙고, 원문 자리에는 「원문 · 근거 → 부록 N」
    if (J(칸들) !== J(['greet', 'readback', 'verdict', 'block', 'alldays', 'zzz', 'appendix', 'receipt'])) 문제.push('칸 ' + J(칸들));
    ['이렇게 읽었어요', '먼저 결론부터', '권하는 곳', '결제 · 다시 보는 곳', '■ 1번 · 4월 12일(월)'].forEach((t) => { if (h.indexOf(t) < 0) 문제.push('없음: ' + t); });
    if (h.indexOf('모르는 노드') >= 0) 문제.push('모르는 노드를 그렸다');
    return 문제;
  });
  검사('그리기 — 글은 모두 이스케이프(보고서 안 꺾쇠가 태그가 되지 않는다)', () => {
    const h = V.그리기(보고서);
    return [h.indexOf('<img') >= 0 ? '<img> 가 그대로 나갔다' : '', h.indexOf('&lt;img src=x onerror=alert(1)&gt;') < 0 ? '이스케이프된 글이 없다' : ''];
  });
  검사('그리기 — 접어 두는 것: 「날짜별로 전부」 칸 · 덩어리 속 대운 목록(첫 줄은 펴 둔다)', () => {
    const h = V.그리기(보고서), 문제 = [];
    if (!/<details class="tkr-sec tkr-foldsec" data-sec="alldays">/.test(h)) 문제.push('접힘 칸이 details 가 아니다');
    const i = h.indexOf('대운(10년마다'), j = h.indexOf('대운 목록 펼쳐 보기'), k = h.indexOf('2~11살 지어낸 대운');
    if (!(i >= 0 && j > i && k > j)) 문제.push('대운 접기 차례 ' + J([i, j, k]));

    return 문제;
  });
  검사('그리기 — 이렇게 읽었어요(못 읽은 칸 표시) · 원문과 뜻 · 명식 한자 · 카드 자리', () => {
    const h = V.그리기(보고서), 문제 = [];
    const 읽은칸 = (h.match(/class="tkr-read( bad)?"/g) || []).length;
    if (읽은칸 !== 2 || 셈(h, 'class="tkr-read bad"') !== 1) 문제.push('읽은 칸 ' + 읽은칸);
    if (h.indexOf('<p class="tkr-han-t" lang="zh-Hant">財輕比重</p>') < 0) 문제.push('원문 줄');
    if (h.indexOf('時 壬辰 · 日 辛酉') < 0) 문제.push('명식 한자');
    if (셈(h, 'data-card="0"') !== 1) 문제.push('카드 자리');
    return 문제;
  });
  검사('화면 글 — 네 축 이름 · 조 번호 · 「당신」이 없다(그리기 바깥 글 포함)', () => {
    const h = V.그리기(보고서) + Object.values(P.taekil.상태말).join(' ') + V.글로(보고서), 문제 = [];
    [/실단/, /\d{1,3}조/, /당신/, /법전/].forEach((rx) => { const m = h.match(rx); if (m) 문제.push(m[0]); });
    return 문제;
  });
  검사('반응 단추가 없다(결과 화면에 맞아요 · 아니에요 금지)', () => {
    const h = V.그리기(보고서);
    return /<button|맞아요|아니에요/.test(h) ? ['그리기에 단추 · 반응 말이 있다'] : [];
  });
  검사('블로그글 — 블로그 업로드용: 이렇게 읽었어요 · 궁금하다고 하신 것 · 결제 칸 · 명식 한자 줄은 빼고, 카드는 그림 주소 또는 [그림 N] 자리', () => {
    const 블 = Object.assign({}, 보고서, { order: ['greet', 'readback', 'verdict', 'block', 'ask', 'alldays', 'receipt'],
      ask: { head: '궁금하다고 하신 것', body: [{ k: 'p', t: '손님 사연이 담긴 지어낸 줄' }] } });
    const h = V.블로그글(블, null), 문제 = [];
    ['이렇게 읽었어요', '목록에서 찾지 못했어요', '손님 사연이 담긴 지어낸 줄', '주문번호', '날짜별로 펼쳐 보기', '時 壬辰'].forEach((s) => { if (h.indexOf(s) >= 0) 문제.push('실렸다: ' + s); });
    ['먼저 결론부터', '■ 1번 · 4월 12일(월)', '까닭 — 지어낸 줄', '자평진전 원문 — 財輕比重', '[그림 1 — 1번 — 으뜸 · 01.png 를 여기에]'].forEach((s) => { if (h.indexOf(s) < 0) 문제.push('없음: ' + s); });
    if (/<img src=x/.test(h) || h.indexOf('&lt;img src=x') < 0) 문제.push('이스케이프 안 됨');
    const 주 = V.블로그글(블, (i) => 'https://chaeksa.kr/cards/consult-x/' + String(i + 1).padStart(2, '0') + '.png');
    if (주.indexOf('<img src="https://chaeksa.kr/cards/consult-x/01.png"') < 0 || 주.indexOf('[그림 1') >= 0) 문제.push('그림 주소 모드');
    return 문제;
  });
  검사('글로 — 메일에 붙일 글(꺾쇠 태그 없음 · 칸 머리 · 카드는 이름표만)', () => {
    const t = V.글로(보고서), 문제 = [];
    if (/<\/?[a-z]/i.test(t.replace('<img src=x onerror=alert(1)>', ''))) 문제.push('태그가 섞였다');
    ['[이렇게 읽었어요]', '· 출산 예정 기간 — 2027년 4월 12일(월) ~ 16일(금), 5일', '(명식 카드 — 1번 — 으뜸)', '자평진전 원문 — 財輕比重', '[결제 · 다시 보는 곳]'].forEach((s) => { if (t.indexOf(s) < 0) 문제.push('없음: ' + s); });
    if (t.indexOf('그리면 안 된다') < 0) 문제.push('order 에 적힌 칸은 글로에도 실린다(그리기와 같은 차례)');
    return 문제;
  });

  const F = P.주문서;
  const 견본 = { mail: 'parent@example.com', range: '2027년 4월 12일 ~ 16일', hospital: '', place: '서울', sex: '남아', time: '오전 7시 ~ 밤 9시', weekend: false,

  검사('신청서 묶기 — 원문 그대로 + 「이렇게 읽었어요」 줄 · 8000자 한도 안', () => {
    const it = F.신청서(견본), 문제 = [];

    if (!it.읽은 || !Array.isArray(it.읽은.줄) || it.읽은.줄.length < 11) 문제.push('읽은 줄 ' + J(it.읽은 && it.읽은.줄 && it.읽은.줄.length));
    const 긴 = F.신청서(Object.assign({}, 견본, { wish: '가'.repeat(1500), ask: '나'.repeat(1500), hospital: '다'.repeat(200), have: '라'.repeat(200) }));

  검사('신청서 막기 — 기간 · 곳을 못 읽음 · 31일 넘음 · 가족 날짜를 못 읽음 · 빈 메일(오늘 기준 앞날만)', () => {
    const 문제 = [];
    const 앞해 = new Date().getFullYear() + 1;
    const 좋은 = Object.assign({}, 견본, { range: 앞해 + '년 4월 12일 ~ 16일' });
    if (F.빈칸(좋은).length) 문제.push('좋은 신청서를 막았다 ' + J(F.빈칸(좋은)));
    [[{ place: '어딘가 시골' }, '태어날 지역'], [{ range: 앞해 + '년 3월 1일 ~ 4월 10일' }, '출산 예정 기간'], [{ father: '잘 모르겠는데 90년대' }, '아버지'], [{ mail: '' }, '메일 주소']]
      .forEach(([바꿈, 말]) => { const 빈 = F.빈칸(Object.assign({}, 좋은, 바꿈)); if (!빈.some((x) => x.indexOf(말) === 0)) 문제.push(J(바꿈) + ' 를 안 막았다 → ' + J(빈)); });
    const 빈곳 = F.빈칸(Object.assign({}, 좋은, { place: '' }));
    if (빈곳.filter((x) => x.indexOf('태어날 지역') === 0).length !== 1) 문제.push('빈 곳을 두 번 적었다 ' + J(빈곳));
    return 문제;
  });
  검사('신청서 칸 — 「원하시는 방향」(앞세우신 말 없음) · 칸마다 읽은 줄 자리', () => {
    const h = F.틀(), 문제 = [];
    if (h.indexOf('원하시는 방향') < 0 || /앞세우/.test(h)) 문제.push('칸 이름');
    ['range', 'place', 'time', 'father', 'mother', 'siblings', 'count'].forEach((k) => { if (h.indexOf('data-read="' + k + '"') < 0) 문제.push('읽은 줄 자리 없음 ' + k); });
    return 문제;
  });
  검사('결제 — buy(code, note, pv, intake) · 사유 no_intake · ChaeksaPay.taekil 묶음', () => {
    const 문제 = [], T = P.taekil;
    if (P.buy.length !== 4) 문제.push('buy 인자 ' + P.buy.length);
    if (P.say({ reason: 'no_intake' }).indexOf('신청서') < 0) 문제.push('no_intake 말');
    ['mine', 'view', 'make', 'adminList', 'adminRelease', 'adminRedo', 'adminIntake', 'adminManual', 'adminNote', 'adminAuto', '주소', '사슬싣기'].forEach((k) => { if (typeof T[k] !== 'function') 문제.push('없음 ' + k); });
    ['todo', 'no_intake', 'making', 'checking', 'ready', 'canceled'].forEach((k) => { if (!T.상태말[k]) 문제.push('상태말 없음 ' + k); });
    if (T.주소('ck_taekil_1&x') !== 'taekil-report.html?o=ck_taekil_1%26x') 문제.push('주소 ' + T.주소('ck_taekil_1&x'));
    return 문제;
  });
  검사('메일 신청(결제가 열리기 전, 10-02) — 제목 「[책사] 출산택일 신청」 · 본문은 칸 이름만 · 복사 글은 적은 그대로', () => {
    const 문제 = [], F = P.주문서;
    if (typeof F.신청메일 !== 'function' || typeof F.메일글 !== 'function') return ['신청메일 · 메일글 없음'];
    const m = F.신청메일(), 앞 = 'mailto:dl4431@naver.com?subject=' + encodeURIComponent('[책사] 출산택일 신청') + '&body=';
    if (m.indexOf(앞) !== 0) 문제.push('주소 · 제목 ' + m.slice(0, 80));
    const 본문 = decodeURIComponent(m.slice(앞.length)), 줄 = 본문.trim().split('\n');
    if (줄.length !== 14 || 줄.some((z) => !/:\s*$/.test(z))) 문제.push('본문은 칸 이름 14줄(값 없음): ' + 줄.length);
    const 글 = F.메일글({ mail: 'a@b.kr', range: '2027년 4월 12일 ~ 16일', place: '서울', sex: '모름', first: '재물', weekend: true, father: '1990년 1월 1일' });
    ['연락받으실 메일 주소: a@b.kr', '아이 성별(남아 · 여아 · 아직 몰라요): 아직 몰라요', '주말도 가능한지: 가능해요', '재물', '아버지 생년월일시(양력/음력): 1990년 1월 1일']
      .forEach((t) => { if (글.indexOf(t) < 0) 문제.push('복사 글에 없음 ' + t); });
    if (typeof P.곧열림 !== 'function') 문제.push('곧열림 없음(결제 단추 갈림은 pay.js 한 곳)');
