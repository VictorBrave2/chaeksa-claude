<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>정통사주 — 세 고전으로 읽는 나의 여덟 글자 · 책사</title>
<meta name="description" content="생년월일시를 넣으면 궁통보감 · 자평진전 · 적천수가 각자 본 것과 열 해씩 오는 대운을 장마다 풀어 드립니다. 점수로 합치지 않습니다.">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1026">
<style>
  .doc{max-width:660px;margin:0 auto;padding:22px 16px 80px}
  .back{display:inline-block;margin-bottom:16px;font-size:13px;color:var(--ink3);text-decoration:none}
  .doc h1{font-family:var(--serif);font-size:24px;line-height:1.45;margin:0 0 8px}
  .doc .lead{font-size:14.5px;line-height:1.85;color:var(--ink2);margin:0 0 18px}
  .jt-form .jt-notime{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink2);margin-top:-2px}
  .jt-form .jt-notime input{width:18px;height:18px;margin:0;padding:0}
  .jt-form input:disabled{opacity:.45}
</style>
</head>
<body>
<div class="doc">
  <a class="back" href="./">← 책사 홈</a>
  <h1>정통사주<br>세 고전으로 읽는 나의 여덟 글자</h1>
  <p class="lead">궁통보감은 계절을, 자평진전은 짜임을, 적천수는 흐름을 봅니다. 셋이 각자 본 것을 장마다 따로 적어 드려요. 점수로 합치지 않습니다. 회원가입 없이 무료예요.</p>
  <form id="jtForm" class="card">
    <div class="jt-form">
      <label>생년월일<input type="date" id="jtDate" required></label>
      <label>태어난 시각<input type="time" id="jtTime" value="12:00"></label>
      <label class="jt-notime"><input type="checkbox" id="jtNoTime">시간을 몰라요</label>
      <label>성별<select id="jtG"><option value="F">여</option><option value="M">남</option></select></label>
      <label>태어난 곳<select id="jtPlace"><option value="KR:서울">서울</option></select></label>
    </div>
    <button type="submit" class="btn" style="width:100%">풀어 보기</button>
  </form>
  <div id="jtOut"></div>
</div>
<script>
(function(){var m=localStorage.getItem('chaeksa.theme')||'auto',h=new Date().getHours();document.documentElement.setAttribute('data-theme',(m==='night'||(m==='auto'&&(h<6||h>=18)))?'night':'day');})()
</script>

<script src="samyeong.js?v=1026"></script>
<script src="gwanjeom.js?v=1026"></script>

</html>
