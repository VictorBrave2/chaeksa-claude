<h1>설명서 검사 — 58·59조</h1>
<p>구별 가능성(아무에게나 붙는 문장인가)과 장면 보류를 고정한다. 조문은 docs/19, 전문은 docs/53.</p>
<p style="font-size:12px;color:#555">이 검사를 통과해도 명리가 맞는다는 뜻이 아니다. 글이 구체적이라는 뜻이다(docs/53 여섯).</p>
<div id="out"></div>
<script src="config.js"></script><script src="lunar.js"></script><script src="astro.js"></script><script src="engine.js"></script>
<script src="gyeokguk.js?t=0927"></script><script src="saenggeuk.js?t=61"></script><script src="panjeong.js?t=1"></script><script src="seolmyeongseo.js?t=3"></script>
<script>
const E = ChaeksaEngine, SM = ChaeksaSeolmyeong;
const S = E.STEMS, B = E.BRANCHES;
const 사주 = (y, m, d, h) => { const p = {}; [['year', y], ['month', m], ['day', d], ['hour', h]].forEach(([k, gz]) => { if (gz) p[k] = { stem: S.indexOf(gz[0]), branch: B.indexOf(gz[1]) }; }); return p; };
const out = document.getElementById('out');
let 통과 = 0, 실패 = 0;
function 검사(이름, fn) {
  let 문제 = [];
  try { const r = fn(); if (r) 문제 = [].concat(r); } catch (e) { 문제 = [e.message + '\n' + e.stack]; }
  const ok = !문제.length; ok ? 통과++ : 실패++;
  out.insertAdjacentHTML('beforeend', '<h2 class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ ' : '✗ ') + 이름 + '</h2>' + (ok ? '' : '<pre>' + 문제.join('\n') + '</pre>'));
}
const 만 = (pl) => SM.만들기({ pillars: pl, dayStem: pl.day.stem }, new Date(2026, 8, 16));

// ── 사장님 명식이 원형이다 (docs/53 여덟) — 받는 것 甲이 살아 있고 내놓는 것은 속에만(월지 辰 상관) → 수문
const 나 = 사주('壬申', '甲辰', '丁卯', '庚子');
검사('원형 — 사장님 명식(정관격)은 수문 패턴 · 남이 맡긴 일부터 보는 편(09-27 사람 말)', () => {
  const d = 만(나); const 문제 = [];
  if (!d.장면 || d.장면.키 !== '수문') 문제.push('패턴 기대 수문, 실제 ' + (d.장면 && d.장면.키));
  if (d.장면 && d.장면.입구 !== '불러가는') 문제.push('입구 기대 불러가는(정관격), 실제 ' + d.장면.입구);
  if (d.장면 && d.장면.역할 !== '남이 맡긴 일부터 보는 편') 문제.push('역할 기대 「남이 맡긴 일부터 보는 편」, 실제 ' + d.장면.역할);
  if (d.장면 && d.장면.이름.indexOf(d.장면.역할) !== 0) 문제.push('장면 이름이 역할로 안 시작한다: ' + d.장면.이름);
  const 받 = d.사슬.find(x => x.key === '받는'), 내 = d.사슬.find(x => x.key === '내놓는');
  if (받.상태 !== '있음') 문제.push('받는 것이 있음이어야 함, 실제 ' + 받.상태);
  if (내.흐름) 문제.push('내놓는 것이 흐르면 안 됨, 실제 ' + 내.상태);
  return 문제;
});

// ── 59조 보류 — 태어난 시를 모르면 장면을 안 붙인다
검사('보류 — 태어난 시를 모르면 장면 없음', () => {
  const d = 만(사주('壬申', '甲辰', '丁卯', null));
  if (d.장면) return '시가 없는데 장면이 붙었다: ' + d.장면.이름;
  if (!d.보류) return '보류 사유가 없다';
});

// ── 구별 가능성(docs/53 여섯) — 무작위 명식에서 장면이 갈리는가. 한 장면이 전부를 덮으면 실패.
const GZ = []; for (let i = 0; i < 60; i++) GZ.push({ stem: i % 10, branch: i % 12 });
let seed = 17; const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
const 분포 = {}, 본문모음 = [];
for (let t = 0; t < 600; t++) {
  const g = () => GZ[Math.floor(rnd() * 60)];
  const pl = { year: { ...g() }, month: { ...g() }, day: { ...g() }, hour: { ...g() } };
  let d; try { d = 만(pl); } catch (e) { continue; }
  const k = d.장면 ? d.장면.키 : '보류';
  분포[k] = (분포[k] || 0) + 1;
  본문모음.push({ k, 이유: d.이유.concat(d.이유단서 || []).join(' '), 이름: d.장면 ? d.장면.이름 : '(보류)' });
}
검사('구별 가능성 — 장면이 한 가지로 쏠리지 않는다', () => {
  const n = 본문모음.length, 문제 = [];
  const 큰 = Math.max.apply(null, Object.keys(분포).map(k => 분포[k]));
  if (큰 / n > 0.8) 문제.push('한 장면이 ' + Math.round(큰 / n * 100) + '% 를 덮는다 — 구조를 못 가르고 있다');
  if (Object.keys(분포).length < 3) 문제.push('장면 종류가 ' + Object.keys(분포).length + '가지뿐이다');
  return 문제;
});
검사('구별 가능성 — 고른 이유가 명식마다 다르다', () => {
  const 유일 = {}; 본문모음.forEach(x => { 유일[x.이유] = 1; });
  const 비율 = Object.keys(유일).length / 본문모음.length;
  if (비율 < 0.05) return '고른 이유가 ' + Object.keys(유일).length + '가지뿐이다(' + 본문모음.length + '명식). 아무에게나 붙는 문장이다';
});

// ── 59조 금지 — 장면에서 새 주장을 끌어내지 않는다
검사('59조 — 장면 글에 새 주장이 없다', () => {
  const 금지 = /부자|정신력|대박|반드시|틀림없|운명|성공할|적중|확률|%|퍼센트/;
  const 문제 = [];
  Object.keys(SM.패턴표).forEach(k => {
    const v = SM.패턴표[k];
    ['실험', '제외'].forEach(f => { if (금지.test(v[f])) 문제.push(k + '.' + f + ' 에 금지어: ' + v[f]); });
    (v.질문 || []).forEach(q => { if (금지.test(q)) 문제.push(k + '.질문 에 금지어: ' + q); });
  });
  Object.keys(SM.조건표).forEach(k => SM.조건표[k].forEach(t2 => { if (금지.test(t2)) 문제.push('조건표 ' + k + ' 에 금지어: ' + t2); }));
  Object.keys(SM.그림표).forEach(k => SM.그림표[k].forEach(t2 => { if (금지.test(t2)) 문제.push('그림표 ' + k + ' 에 금지어: ' + t2); }));
  Object.keys(SM.역할표).forEach(k => { if (금지.test(SM.역할표[k].설명)) 문제.push('역할표 ' + k + ' 에 금지어: ' + SM.역할표[k].설명); });
  return 문제;
});
검사('58조 — 패턴마다 제안 세 칸(질문·실험·제외)이 다 있다', () => {
  const 문제 = [];
  Object.keys(SM.패턴표).forEach(k => {
    const v = SM.패턴표[k];
    ['실험', '제외'].forEach(f => { if (!v[f]) 문제.push(k + ' 에 ' + f + ' 가 없다'); });
    if (!(v.질문 || []).length) 문제.push(k + ' 에 질문이 없다');
  });
  return 문제;
});
// ── 09-17 다시 씀 — 조건·막힘은 기계 다섯 × 패턴 다섯 스물다섯 벌이고, 글자 자리가 실제 글자로 채워진다.
검사('59조 — 조건·막힘이 막힌 칸 다섯 벌 다 있고 글자 자리({A}~{E})가 있다', () => {
  const 문제 = [];
  Object.keys(SM.패턴표).forEach(k => {
    const 벌 = SM.조건표[k];
    if (!벌 || 벌.length !== 2) { 문제.push(k + ' 조건·막힘이 없거나 두 줄이 아니다'); return; }
    if (!/\{[A-E]\}/.test(벌[0])) 문제.push(k + ' 조건에 글자 자리가 없다 — 패턴 한 벌로 돌아간 것');
    if (!/\{[A-E]\}/.test(벌[1]) && k !== '바깥일') 문제.push(k + ' 막힘에 글자 자리가 없다');
  });
  return 문제;
});
검사('59조 — 격이 입구를 정한다: 여덟 격이 다섯 입구로 다 떨어지고 「양인」이 인성으로 새지 않는다', () => {
  const 문제 = [];
  const 기대 = { 정관: '불러가는', 편관: '불러가는', 정인: '받는', 편인: '받는', 식신: '내놓는', 상관: '내놓는', 재: '모이는', 정재: '모이는', 편재: '모이는', 건록: '나', 양인: '나' };
  Object.keys(기대).forEach(n => { const got = SM.격마디(n); if (got !== 기대[n]) 문제.push(n + '격 → 기대 ' + 기대[n] + ', 실제 ' + got); });
  Object.keys(SM.역할표).forEach(k => { if (!SM.역할표[k].역할 || !SM.역할표[k].설명) 문제.push('역할표 ' + k + ' 에 역할이나 설명이 없다'); });
  if (Object.keys(SM.역할표).length !== 5) 문제.push('역할이 다섯이 아니다');
  return 문제;
});
검사('구별 가능성 — 같은 패턴이라도 글자가 다르면 조건 글이 다르다', () => {
  // 사장님 명식(丁火·수문)과 같은 패턴·같은 기계인 다른 명식을 찾아 조건 글을 견준다.
  const 원 = 만(나); if (!원.장면) return '원형이 장면 없음';
  let 짝 = null;
  for (let t = 0; t < 2000 && !짝; t++) {
    const g = () => GZ[Math.floor(rnd() * 60)];
    const pl = { year: { ...g() }, month: { ...g() }, day: { ...g() }, hour: { ...g() } };
    let d; try { d = 만(pl); } catch (e) { continue; }
    if (d.장면 && d.장면.키 === 원.장면.키 && (d.장면.조건 + d.장면.조건단서) !== (원.장면.조건 + 원.장면.조건단서)) 짝 = d;
  }
  if (!짝) return '같은 패턴에서 조건 글(본문 + 단서)이 다른 명식을 못 찾았다 — 글자가 안 채워지고 있다';
  if (/\{[A-E]\}/.test(원.장면.조건 + 원.장면.막힘 + 짝.장면.조건 + 짝.장면.막힘)) return '채워지지 않은 글자 자리가 남았다';
});
검사('09-17 — 지금 메모에 숫자(남은 힘 같은 값)가 안 나간다', () => {
  const 문제 = [];
  const 시험 = [나, 사주('甲子', '丙寅', '戊辰', '庚申'), 사주('乙亥', '丁丑', '己卯', '辛未'), 사주('壬午', '癸巳', '庚戌', '甲申')];
  시험.forEach((pl, i) => {
    let d; try { d = 만(pl); } catch (e) { return; }
    if (d.지금 && /\d/.test((d.지금.덧 || '') + (d.지금.근거 || ''))) 문제.push('명식 ' + i + ' 지금 메모에 숫자: ' + d.지금.덧 + ' / ' + d.지금.근거);
  });
  return 문제;
});
검사('59조 — 막힌 칸 다섯 그림이 다 있고 이름에 {역할} 자리가 있다 → 역할 다섯 × 막힘 다섯 = 스물다섯 장면', () => {
  const 문제 = [];
  Object.keys(SM.패턴표).forEach(k => {
    const g = SM.그림표[k];
    if (!g || g.length !== 2) { 문제.push(k + ' 그림이 없거나 두 줄이 아니다'); return; }
    if (g[0].indexOf('{역할}') < 0) 문제.push(k + ' 장면 이름에 {역할} 자리가 없다 — 격이 장면에 안 들어간다');
  });
  // 같은 막힘이라도 역할이 다르면 이름이 다르고, 같은 역할이라도 막힘이 다르면 이름이 다르다
  const 이름들 = {};
  Object.keys(SM.패턴표).forEach(k => Object.keys(SM.역할표).forEach(r => { 이름들[SM.그림표[k][0].replace('{역할}', SM.역할표[r].역할)] = 1; }));
  if (Object.keys(이름들).length !== 25) 문제.push('장면 이름이 스물다섯이 아니라 ' + Object.keys(이름들).length + '개다');
  return 문제;
});
검사('28조 — 「~형입니다」 꼴로 사람을 가르지 않는다 · 역할은 등급이 아니다', () => {
  const 문제 = [];
  Object.keys(SM.그림표).forEach(k => { if (/형입니다|형이에요|타입/.test(SM.그림표[k].join(' '))) 문제.push(k + ' 이 유형 이름으로 끝난다'); });
  Object.keys(SM.역할표).forEach(k => { if (/높|낮|위|아래|귀|천|상급|하급|좋은|나쁜/.test(SM.역할표[k].설명)) 문제.push('역할표 ' + k + ' 에 등급 말: ' + SM.역할표[k].설명); });
  return 문제;
});

// ── 내 말투·사주 낱말이 화면에 나가면 막는다 (2026-09-16 사장님 「떠있어요 이런말 쓰지말자니까」)
//    「떠 있다」는 투출을 내가 바꿔 부른 말이고, 「섰다·띠었다」는 격 성패 금지어다(feedback-four-verdict-terms).
검사('말투 — 화면에 나가는 글에 내 말·사주 낱말이 없다', () => {
  // 09-16 사장님 「사주 낱말을 쓰는 것으로 수정해」 — 투간·통근·합거·격신 같은 **원전 용어는 이제 낸다**(원국 화면과 같은 결).
  // 막는 것은 둘뿐이다: ① 내가 지어낸 말(떠 있다·잣대·이레) ② 격 성패 금지어(섰다·띠었다) ③ 조 번호·법전 같은 내부 말.
  const 금지 = /떠 있|떠있|안 떴|섰다|서 있는|띠었|온전하지|흠 하나|이레|잣대|규칙 \d+조|\d+조[는가이에]|법전|판정 모듈|판정키|조립기/;
  const 문제 = [];
  const 훑기 = (글, 어디) => { const m = String(글 || '').match(금지); if (m) 문제.push(어디 + ' — 「' + m[0] + '」: ' + String(글).slice(0, 60)); };
  Object.keys(SM.패턴표).forEach(k => {
    const v = SM.패턴표[k];
    ['실험', '제외'].forEach(f => 훑기(v[f], '패턴표 ' + k + '.' + f));
    (v.질문 || []).forEach((q, i) => 훑기(q, '패턴표 ' + k + '.질문' + i));
  });
  Object.keys(SM.조건표).forEach(k => SM.조건표[k].forEach((t2, i) => 훑기(t2, '조건표 ' + k + '[' + i + ']')));
  Object.keys(SM.그림표).forEach(k => SM.그림표[k].forEach((t2, i) => 훑기(t2, '그림표 ' + k + '[' + i + ']')));
  Object.keys(SM.역할표).forEach(k => 훑기(SM.역할표[k].설명, '역할표 ' + k));
  // 조립기가 실제로 그려 내는 글까지 훑는다 — 표에 없고 코드에 박힌 문장이 여기서 걸린다.
  const 시험명식 = [나, 사주('甲子', '丙寅', '戊辰', '庚申'), 사주('乙亥', '丁丑', '己卯', '辛未'), 사주('壬午', '癸巳', '庚戌', '甲申')];
  const div = document.createElement('div');
  시험명식.forEach((pl, i) => {
    try {
      SM.render({ pillars: pl, dayStem: pl.day.stem }, new Date(2026, 8, 16), div, { pid: 'test' + i });
      div.querySelectorAll('details').forEach(x => { x.open = true; });
      훑기(div.textContent, '그려 낸 글 ' + i);
    } catch (e) { 문제.push('명식 ' + i + ' 그리기 실패: ' + e.message); }
  });
  return 문제;
});

out.insertAdjacentHTML('afterbegin', '<p><b>' + 통과 + ' 통과 · ' + 실패 + ' 실패</b></p>');
{
  const n = 본문모음.length;
  let html = '<h2>장면 분포 — 무작위 ' + n + ' 명식</h2><table><tr><th>장면</th><th>수</th><th>%</th></tr>';
  Object.keys(분포).sort((a, b) => 분포[b] - 분포[a]).forEach(k => {
    html += '<tr><td>' + k + '</td><td>' + 분포[k] + '</td><td>' + Math.round(분포[k] / n * 100) + '</td></tr>';
  });
  html += '</table>';
  out.insertAdjacentHTML('beforeend', html);
}
{
  // 사장님 명식 설명서 전문 — 눈으로 보는 자리
  const d = 만(나);
  let html = '';
  html += '장면: ' + (d.장면 ? d.장면.이름 : '(보류) ' + d.보류) + '\n';
  html += '사슬: ' + d.사슬.map(m => m.이름 + '=' + m.상태).join(' · ') + '\n\n';
  html += '고른 이유\n  ' + d.이유.map((x, i) => x + '\n    단서 — ' + (d.이유단서 || [])[i]).join('\n  ') + '\n\n';
  html += '명리 해석\n  ' + d.명리.map((x, i) => x + '\n    단서 — ' + (d.명리단서 || [])[i]).join('\n  ') + '\n\n';
  if (d.장면) {
    html += '잘 풀리는 때\n  ' + d.장면.조건 + '\n    단서 — ' + d.장면.조건단서 + '\n\n막히는 때\n  ' + d.장면.막힘 + '\n    단서 — ' + d.장면.막힘단서 + '\n\n';
    html += '확인할 질문\n  ' + d.장면.질문.join('\n  ') + '\n\n작게 해볼 것\n  ' + d.장면.실험 + '\n\n안 맞는 경우\n  ' + d.장면.제외 + '\n';
  }
  if (d.지금) html += '\n지금(' + d.기간 + ' ' + (d.지금.간지 || '') + '): ' + d.지금.범주 + ' — ' + d.지금.근거 + (d.지금.덧 ? ' / ' + d.지금.덧 : '') + '\n';
  out.insertAdjacentHTML('beforeend', '<h2>원형 — 壬申 甲辰 丁卯 庚子</h2><pre>' + html.replace(/</g, '&lt;') + '</pre>');
}
</script></body></html>
