<script src="bunya.js?v=1263"></script>
<script src="home-ask.js?v=1263"></script>
<script>
// 홈 분야 표 시험(docs/100 전략 카) — 이번 범위는 모듈 없이 표만으로 되는 것.
//   가 표 꼴(한 곳 · JSON 한 덩어리 · 한 줄 = 한 칸 · 함수 없음) · 나 열쇠 꼴과 겹침(카 2) · 다 없는 키 0(카 1의 표 쪽)
//   라 빈칸 한 줄 꼴과 표 한 줄로 늘어남(합성 표) · 마 근거 짝(카 3) · 바 격결론 칸 목록(카 9의 표 쪽)
//   사 콘텐츠 키 = 상품 코드 = 탭 · 이름 · 첫 화면 한 줄(카 2 · 13의 표 쪽) · 아 값 · 무료 범위를 표에 적지 않음(카 12 · 14의 표 쪽)
//   자 수가 설계와 같음(docs/100 1절 · 빈칸 목록 — 설계 문서의 수는 tools_bunya.py 가 문서에서 직접 읽어 한 번 더 대조한다).
// 모듈 목차 · 잠금 · 주소 · 화면(카 4 ~ 11 · 15 ~ 19)은 모듈 약속과 화면을 만든 뒤에 더한다.
// 빈칸을 채우거나 줄을 더하면 「자」의 수가 달라진다 — 그때 설계 문서와 이 쪽의 수를 같이 고친다.
(async () => {
  const out = document.getElementById('out');
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const 줄들 = []; let 통과 = 0, 실패 = 0;
  const 글로 = (v) => (typeof v === 'string' ? v : JSON.stringify(v));
  const 봄 = (이름, 실제, 기대) => { const a = 글로(실제), b = 글로(기대), ok = a === b; ok ? 통과++ : 실패++; 줄들.push('<h2 class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ ' : '✗ ') + esc(이름) + (ok ? '' : ' — 기대 ' + esc(b) + ' · 실제 ' + esc(String(a).slice(0, 400))) + '</h2>'); };
  const 머리 = (s) => 줄들.push('<h3>' + esc(s) + '</h3>');
  const 없음목록 = (xs) => (xs.length ? xs.join(', ') : '0');
  const 받기 = async (f) => { const r = await fetch(f + (f.includes('?') ? '&' : '?') + 'nocache=' + Date.now(), { cache: 'no-store' }); return r.ok ? r.text() : null; };
  const 겹침 = (xs) => { const s = new Set(), d = new Set(); xs.forEach((x) => (s.has(x) ? d.add(x) : s.add(x))); return Array.from(d); };
  const 복사 = (o) => JSON.parse(JSON.stringify(o));

  // ── 설계에서 옮겨 적은 고정값(docs/100) ──
  const 설계수 = { 큰: 17, 작은: 74, 물음: 313, 물음답: 66, 곁만: 36, 방향: 44, 빈칸: 167, 하위: 297, 하위답: 71, '●': 26, '◐': 18, '○': 30, 답0: 48, 콘텐츠: 10, 목차: 129, 격결론: 13 };
  const 큰차례 = ['child', 'love', 'match', 'marry', 'me', 'work', 'money', 'health', 'time', 'family', 'people', 'study', 'day', 'move', 'law', 'name', 'learn'];   // 정해야 할 것 1 기본 안(09-18 차례)
  const 격결론칸 = ['jt.h2', 'jt.h3', 'jt.h4', 'jt.h5', 'jt.h7', 'jt.h11', 'jt.h15', 'jt.h20', 'jt.c3', 'jt.c9', 'jt.card', 'gc.c7', 'seol'];   // 내가 정해 둔 것 13
  const 원문분야 = ['health.body', 'learn.why', 'me.sinsal', 'people.helper'];   // 전략 나 — 신살 · 건강 · 왜 글 · 귀인
  const 상품코드 = ['jeongtong', 'chongnon', 'ssom', 'taekil', 'duo', 'trio'];     // products(docs/97 0절 · pay.js 그림 표 · 출산택일 신청)
  const 이름넷 = { jeongtong: '정통사주', chongnon: '정통궁합', ssom: '웹툰궁합', taekil: '출산택일' };   // docs/79 1절
  const 결제덩어리 = ['chongnon/geungeo', 'jeongtong/geungeo', 'jeongtong/webtoon', 'ssom/dangye', 'ssom/dul'];
  const 늘무료 = ['jeongtong/card', 'ssom/card', 'wongook/card', 'seol/card', 'week/base', 'week/days', 'week/you', 'taekil/sim', 'taekil/month'];   // 공유 카드 둘 · 홈의 내 원국 · 설명서 · 이번 주 · 시뮬레이터 · 택일 자료(카 12)
  const 열쇠 = {
    맨위: ['설정', '큰분야', '분야', '콘텐츠', '목차'],
    설정: { 꼭: ['홈타일', '칸줄', '접음'], 또: [] },
    큰분야: { 꼭: ['키', '이름', '머리', '그림', '대표'], 또: [] },
    분야: { 꼭: ['키', '큰', '이름', '조문', '물음', '하위', '모은곳'], 또: ['곁', '열린날'] },
    물음: { 꼭: ['글'], 또: ['칸', '곁', '방향'] },
    하위: { 꼭: ['이름'], 또: ['칸', '곁', '조'] },
    콘텐츠: { 꼭: ['키', '이름', '한줄', '사람', '프로필', '탭', '본적', '맛보기', '덩어리', '파일', '아이콘', '상태', '홈위', '아래줄'], 또: ['열린날'] },
    덩어리: { 꼭: ['키', '단위', '상품', '판매', '모듈'], 또: [] },
    목차: { 꼭: ['콘텐츠', '덩어리', '칸', '상태'], 또: ['제목', '보여줌', '주소', '다리말', '격결론', '열린날'] },
  };

  // ── 계산(tools_bunya.py 와 같은 규칙 — 표에 적지 않고 계산하는 것) ──
  const 열린칸 = (T) => { const oc = new Set(T.콘텐츠.filter((c) => c.상태 === '열림').map((c) => c.키)); return new Set(T.목차.filter((r) => r.상태 === '열림' && oc.has(r.콘텐츠)).map((r) => r.칸)); };
  const 갈래 = (q) => (q.방향 ? '방향' : (q.칸 && q.칸.length ? '답' : (q.곁 && q.곁.length ? '곁' : '빈칸')));
  const 근거 = (T) => {
    const 열 = 열린칸(T), 격 = new Set(T.목차.filter((r) => r.격결론).map((r) => r.칸)), o = {};
    T.분야.forEach((f) => {
      const 답칸 = new Set(); let qa = 0, ha = 0;
      f.물음.forEach((q) => { const a = (q.칸 || []).filter((k) => 열.has(k)); if (a.length) qa++; a.forEach((k) => 답칸.add(k)); });
      f.하위.forEach((h) => { const a = (h.칸 || []).filter((k) => 열.has(k)); if (a.length) ha++; a.forEach((k) => 답칸.add(k)); });
      o[f.키] = { 상태: f.조문 === '없음' ? '○' : (답칸.size ? '●' : '◐'), qa, ha, 격만: 답칸.size > 0 && Array.from(답칸).every((k) => 격.has(k)) };
    });
    return o;
  };
  const 수 = (T) => {
    const qs = [].concat(...T.분야.map((f) => f.물음)), g = {}; qs.forEach((q) => { g[갈래(q)] = (g[갈래(q)] || 0) + 1; });
    const r = 근거(T), s = { '●': 0, '◐': 0, '○': 0 }; let 하위답 = 0;
    Object.values(r).forEach((v) => { s[v.상태]++; 하위답 += v.ha; });
    return { 큰: T.큰분야.length, 작은: T.분야.length, 물음: qs.length, 물음답: g.답 || 0, 곁만: g.곁 || 0, 방향: g.방향 || 0, 빈칸: g.빈칸 || 0,
      하위: T.분야.reduce((n, f) => n + f.하위.length, 0), 하위답, '●': s['●'], '◐': s['◐'], '○': s['○'], 답0: s['◐'] + s['○'],
      콘텐츠: T.콘텐츠.length, 목차: T.목차.length, 격결론: T.목차.filter((x) => x.격결론).length };
  };
  const 닿음 = (T) => {   // 칸 → 닿는 분야(분야 표를 거꾸로)
    const m = new Map(), 넣기 = (k, f) => { if (!m.has(k)) m.set(k, new Set()); m.get(k).add(f); };
    T.분야.forEach((f) => { f.물음.concat(f.하위).forEach((x) => (x.칸 || []).concat(x.곁 || []).forEach((k) => 넣기(k, f.키))); (f.곁 || []).forEach((k) => 넣기(k, f.키)); });
    return m;
  };

  try {
    const T = window.ChaeksaBunya;
    머리('가. 표 꼴');
    봄('가1 전역 ChaeksaBunya 가 있다', !!T && typeof T === 'object', true);
    if (!T) throw new Error('bunya.js 가 실리지 않았다');
    봄('가2 맨 위 열쇠 = 설정 · 큰분야 · 분야 · 콘텐츠 · 목차(표 넷과 설정 한 줄)', Object.keys(T), 열쇠.맨위);
    봄('가3 설정 — 홈타일 · 칸줄 · 접음이 모두 자연수', Object.keys(T.설정).length === 3 && ['홈타일', '칸줄', '접음'].every((k) => Number.isInteger(T.설정[k]) && T.설정[k] > 0), true);
    const 소스 = await 받기('bunya.js?v=1263');
    봄('가4 bunya.js 를 읽었다', 소스 != null, true);
    const 시작 = '/*표 시작*/', 끝 = '/*표 끝*/';
    const a = 소스.indexOf(시작), b = 소스.indexOf(끝);
    봄('가4 표 시작 · 표 끝 표시가 한 번씩', [소스.split(시작).length - 1, 소스.split(끝).length - 1], [1, 1]);
    const 덩이 = 소스.slice(a + 시작.length, b);
    let 파싱 = null; try { 파싱 = JSON.parse(덩이); } catch (e) { 파싱 = null; }
    봄('가4 두 표시 사이가 JSON 한 덩어리로 읽힌다', 파싱 != null, true);
    봄('가4 그 JSON = 실린 전역(옛 캐시가 아니다)', 파싱 && JSON.stringify(파싱) === JSON.stringify(T), true);
    const 나머지 = (소스.slice(0, a + 시작.length) + 소스.slice(b)).split('\n').filter((l) => !/^\s*\/\//.test(l)).join(' ').replace(/\s+/g, ' ').trim();
    봄('가5 함수 없음 — 주석과 표를 빼면 대입 한 줄뿐', 나머지, 'window.ChaeksaBunya = /*표 시작*//*표 끝*/;');
    {
      const 줄 = 덩이.split('\n'); let 지금 = null; const 센 = {}, 틀린 = [];
      줄.forEach((l, i) => {
        const m = l.match(/^"(큰분야|분야|콘텐츠|목차)": \[$/);
        if (m) { 지금 = m[1]; 센[지금] = 0; return; }
        if (/^\],?$/.test(l)) { 지금 = null; return; }
        if (!지금 || !l.trim()) return;
        try { const o = JSON.parse(l.replace(/,$/, '')); if (!o || typeof o !== 'object' || Array.isArray(o)) throw 0; 센[지금]++; } catch (e) { 틀린.push(지금 + ' ' + (i + 1) + '줄'); }
      });
      봄('가6 한 줄 = 한 칸 — 표 넷의 줄마다 JSON 한 덩어리', 없음목록(틀린), '0');
      봄('가6 줄 수 = 칸 수(큰분야 · 분야 · 콘텐츠 · 목차)', ['큰분야', '분야', '콘텐츠', '목차'].map((k) => 센[k]), ['큰분야', '분야', '콘텐츠', '목차'].map((k) => T[k].length));
    }
    {
      const 틀린 = [];
      const 본다 = (이름, o, 규칙) => {
        const ks = Object.keys(o);
        규칙.꼭.forEach((k) => { if (!(k in o)) 틀린.push(이름 + ' 에 ' + k + ' 없음'); });
        ks.forEach((k) => { if (!규칙.꼭.includes(k) && !규칙.또.includes(k)) 틀린.push(이름 + ' 에 모르는 칸 ' + k); });
      };
      본다('설정', T.설정, 열쇠.설정);
      T.큰분야.forEach((x) => 본다('큰분야 ' + x.키, x, 열쇠.큰분야));
      T.분야.forEach((f) => { 본다('분야 ' + f.키, f, 열쇠.분야); f.물음.forEach((q, i) => 본다(f.키 + ' 물음' + (i + 1), q, 열쇠.물음)); f.하위.forEach((h, i) => 본다(f.키 + ' 하위' + (i + 1), h, 열쇠.하위)); });
      T.콘텐츠.forEach((c) => { 본다('콘텐츠 ' + c.키, c, 열쇠.콘텐츠); c.덩어리.forEach((d) => 본다(c.키 + '/' + d.키, d, 열쇠.덩어리)); });
      T.목차.forEach((r) => 본다('목차 ' + r.칸, r, 열쇠.목차));
      봄('가7 칸 이름 — 표마다 적는 칸만(분야 표에 콘텐츠 없음 · 목차 표에 분야 · 무료/잠금 없음)', 없음목록(틀린.slice(0, 12)), '0');
    }

    머리('나. 열쇠 꼴 · 겹침(카 2)');
    봄('나1 큰 분야 키 [a-z]+', 없음목록(T.큰분야.map((x) => x.키).filter((k) => !/^[a-z]+$/.test(k))), '0');
    봄('나2 분야 키 큰.작은([a-z]+.[a-z]+) · 「큰」 칸 = 키 앞 · 그 큰 분야가 있다', 없음목록(T.분야.filter((f) => !/^[a-z]+\.[a-z]+$/.test(f.키) || f.큰 !== f.키.split('.')[0] || !T.큰분야.some((x) => x.키 === f.큰)).map((f) => f.키)), '0');
    봄('나3 콘텐츠 키 · 덩어리 키 [a-z]+(주문번호 ^ck_([a-z]+)_ · #코드 로 돌아오는 길)', 없음목록([].concat(...T.콘텐츠.map((c) => [c.키].concat(c.덩어리.map((d) => c.키 + '/' + d.키))))
      .filter((k) => !/^[a-z]+(\/[a-z]+)?$/.test(k))), '0');
    봄('나4 칸 id [a-z0-9.-]+', 없음목록(T.목차.map((r) => r.칸).filter((k) => !/^[a-z0-9.-]+$/.test(k))), '0');
    봄('나5 사건 이름 40자 안 — ev:want:<분야키> · ev:field:<큰키>(track.js 가 40자로 자른다)', 없음목록(T.분야.map((f) => 'ev:want:' + f.키).concat(T.큰분야.map((x) => 'ev:field:' + x.키)).filter((s) => s.length > 40)), '0');
    봄('나6 겹침 0 — 큰 분야 키 · 이름', 없음목록(겹침(T.큰분야.map((x) => x.키)).concat(겹침(T.큰분야.map((x) => x.이름)))), '0');
    봄('나6 겹침 0 — 분야 키 · 분야 이름', 없음목록(겹침(T.분야.map((f) => f.키)).concat(겹침(T.분야.map((f) => f.이름)))), '0');
    봄('나6 겹침 0 — 콘텐츠 키 · 콘텐츠 이름 · 콘텐츠 안 덩어리 키', 없음목록(겹침(T.콘텐츠.map((c) => c.키)).concat(겹침(T.콘텐츠.map((c) => c.이름))).concat(...T.콘텐츠.map((c) => 겹침(c.덩어리.map((d) => c.키 + '/' + d.키))))), '0');
    봄('나6 겹침 0 — 목차 칸 id(모든 콘텐츠를 통틀어)', 없음목록(겹침(T.목차.map((r) => r.칸))), '0');
    봄('나6 겹침 0 — 한 분야 안의 물음 글 · 하위 이름 · 한 목록 안의 칸', 없음목록([].concat(...T.분야.map((f) => 겹침(f.물음.map((q) => q.글)).concat(겹침(f.하위.map((h) => h.이름)))
      .concat(...f.물음.concat(f.하위).map((x) => 겹침(x.칸 || []).concat(겹침(x.곁 || [])))).concat(겹침(f.곁 || [])).map((d) => f.키 + ':' + d)))), '0');

    머리('다. 없는 키 0(카 1 — 표 안에서)');
    const 칸들 = new Set(T.목차.map((r) => r.칸)), 분야들 = new Set(T.분야.map((f) => f.키));
