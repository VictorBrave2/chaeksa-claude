<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>연애 속의 나 · 책사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 연애 속의 나 — 무료 체험(09-30 사장님 「무료 콘텐츠로 올려서 지인들에게 체험」). 계산 · 질문 · 답은 비공개 서버가 하고, 이 화면은 보여 주고 「맞아요 / 아니에요」만 받는다. 생일은 주소에 싣지 않는다. */
  :root{--ground:#efebe4;--paper:#fbf9f5;--ink:#1b1916;--ink2:#5d584f;--ink3:#8c8578;--edge:#ddd6c9;--seal:#8c2f23;--yes:#2f6b4f;--no:#8c2f23;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#141726;--paper:#1c2033;--ink:#ece8e0;--ink2:#b7b2a8;--ink3:#8a8578;--edge:#2e3450;--seal:#e08a7c;--yes:#7fc8a3;--no:#e08a7c;color-scheme:dark}}
  :root[data-theme="dark"]{--ground:#141726;--paper:#1c2033;--ink:#ece8e0;--ink2:#b7b2a8;--ink3:#8a8578;--edge:#2e3450;--seal:#e08a7c;--yes:#7fc8a3;--no:#e08a7c;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.7 "Noto Sans KR","Malgun Gothic",sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 80px}
  a{color:var(--ink2)}
  h1{font-family:"Noto Serif KR",serif;font-size:28px;margin:18px 0 6px;letter-spacing:-.02em}
  .lead{color:var(--ink2);margin:0 0 14px}
  .card{background:var(--paper);border:1px solid var(--edge);border-radius:12px;padding:16px;margin:14px 0}
  label{display:block;font-size:14px;color:var(--ink2);margin:10px 0 4px}
  input[type=date],input[type=time]{width:100%;font:inherit;padding:10px;border:1px solid var(--edge);border-radius:8px;background:var(--ground);color:var(--ink)}
  .row{display:flex;gap:10px}.row>div{flex:1}
  .g{display:flex;gap:16px;margin-top:4px}
  .agree{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink2);margin-top:14px}
  .agree input{margin-top:5px}
  button.go{width:100%;margin-top:14px;padding:13px;font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--seal);color:#fff;cursor:pointer}
  button.go:disabled{opacity:.5;cursor:default}
  .status{color:var(--ink2);font-size:14px;margin:10px 0}
  .err{color:var(--seal)}
  h2{font-size:17px;margin:26px 0 6px;color:var(--seal)}
  .q{font-weight:700;margin:0 0 6px}
  .a{margin:0;color:var(--ink)}
  .a.wait{color:var(--ink3)}
  .fb{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .fb span{font-size:13px;color:var(--ink3)}
  .fb button{font:inherit;font-size:14px;padding:6px 14px;border-radius:8px;border:1px solid var(--edge);background:transparent;color:var(--ink);cursor:pointer}
  .fb button.on.y{border-color:var(--yes);color:var(--yes);font-weight:700}
  .fb button.on.n{border-color:var(--no);color:var(--no);font-weight:700}
  .note{font-size:13px;color:var(--ink3)}
</style>
</head>
<body>
<div class="wrap">
  <a href="./">← 홈</a>
  <h1>연애 속의 나</h1>
  <p class="lead">태어난 날과 시각으로, 당신에게 해당할 연애 행동 질문을 골라 답해 드려요. 지금은 무료 체험이에요.</p>

  <div class="card" id="form">
    <div class="row">
      <div><label for="d">생년월일</label><input type="date" id="d" min="1900-01-01" max="2100-12-31"></div>
      <div><label for="t">태어난 시각</label><input type="time" id="t"></div>
    </div>
    <label>성별</label>
    <div class="g"><label><input type="radio" name="g" value="F"> 여성</label><label><input type="radio" name="g" value="M"> 남성</label></div>
    <div class="agree"><input type="checkbox" id="ok"><label for="ok" style="margin:0">넣은 생년월일시와 「맞아요 / 아니에요」 응답을 이 콘텐츠를 고치는 데 쓰는 것에 동의해요. 이름·연락처는 받지 않아요. <a href="privacy.html">개인정보 처리방침</a></label></div>
    <button class="go" id="go">내 질문 받기</button>
    <p class="status" id="st"></p>
  </div>

  <p class="note" id="about" hidden>답은 태어난 날에서 계산한 행동 경향이라 틀릴 수 있어요. 질문마다 「맞아요 / 아니에요」를 눌러 주시면 더 정확하게 고쳐 나갑니다.</p>
  <div id="list"></div>
</div>
<script>
(function () {
  'use strict';
  var API = 'https://chaeksa-behavior-core.vercel.app';
  var $ = function (id) { return document.getElementById(id); };
  var runId = null, birth = null, timer = null;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function status(msg, isErr) { $('st').className = 'status' + (isErr ? ' err' : ''); $('st').textContent = msg; }
  function tick(msg) {
    var s = 0; clearInterval(timer);
    status(msg);
    timer = setInterval(function () { s += 1; status(msg + ' (' + s + '초)'); }, 1000);
  }
  function post(path, body) {
    return fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || '잠시 뒤 다시 해 주세요.'); return j; }); });
  }

  function render(items) {
    var html = '', sec = null;
    items.forEach(function (it) {
      if (it.section !== sec) { sec = it.section; html += '<h2>' + esc(sec) + '</h2>'; }
      html += '<div class="card" id="c_' + esc(it.id) + '"><p class="q">' + esc(it.q) + '</p><p class="a wait">답을 쓰는 중이에요…</p></div>';
    });
    $('list').innerHTML = html;
    $('about').hidden = false;
  }

  function fill(answers) {
    answers.forEach(function (it) {
      var c = $('c_' + it.id); if (!c) return;
      var a = c.querySelector('.a'); a.className = 'a'; a.textContent = it.a || '답을 쓰지 못했어요.';
      var fb = document.createElement('div'); fb.className = 'fb';
      fb.innerHTML = '<span>실제 나와</span><button class="y" data-v="yes">맞아요</button><button class="n" data-v="no">아니에요</button>';
      fb.addEventListener('click', function (e) {
        var b = e.target.closest('button'); if (!b) return;
        fb.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
        post('/api/love-feedback', { runId: runId, id: it.id, value: b.getAttribute('data-v') }).catch(function () {});
      });
      c.appendChild(fb);
    });
  }

  $('go').addEventListener('click', function () {
    var d = $('d').value, t = $('t').value, g = (document.querySelector('input[name=g]:checked') || {}).value;
    if (!d || !t || !g) return status('생년월일, 태어난 시각, 성별을 모두 넣어 주세요.', true);
    if (!$('ok').checked) return status('안내에 동의해 주세요.', true);
    var p = d.split('-'), q = t.split(':');
    birth = { year: +p[0], month: +p[1], day: +p[2], hour: +q[0], minute: +q[1], gender: g };
    $('go').disabled = true; $('list').innerHTML = '';
    tick('당신에게 맞는 질문을 고르는 중이에요. 1분 남짓 걸려요.');
    post('/api/love-questions', { consent: true, birth: birth }).then(function (r) {
      runId = r.runId; render(r.items);
      tick('질문 ' + r.items.length + '개를 골랐어요. 답을 쓰는 중이에요. 1분 남짓 더 걸려요.');
      return post('/api/love-answers', { runId: runId, birth: birth, items: r.items });
    }).then(function (r) {
      clearInterval(timer); fill(r.items);
      status('다 됐어요. 질문마다 실제 나와 맞는지 눌러 주세요.');
      $('go').disabled = false;
    }).catch(function (e) {
      clearInterval(timer); status(e.message, true); $('go').disabled = false;
    });
  });
})();
</script>
</body>
</html>
