    }

    봄('나1 장부 글에 「숫자 + 원」 0(값은 상품표 products 한 곳)', 없음목록(키들.filter((k) => 글모음(T.콘텐츠[k]).some((s) => /\d[\d,]*\s?원(?![가-힣])/.test(s)))), '0');
