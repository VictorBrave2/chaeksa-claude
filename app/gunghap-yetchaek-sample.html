<style>

<body>
<div class="mini-head" role="banner"><a class="logo" href="./" title="처음 화면으로"><i class="seal">策</i><span>책사</span></a></div>
<main class="wrap">
  <a class="btn ghost small backhome" href="./" style="display:inline-block;margin-top:0;text-decoration:none">← 홈</a>
  <p class="eyebrow">정통궁합 · 옛 책 남녀 조항 견본</p>
  <h1>옛 책은 두 사람을 어떻게 봤을까</h1>
  <p class="sub">옛 책 일곱 권이 남녀에 대해 한 말 가운데, 두 사람에게 걸리는 것만 모았어요. 아래 세 쌍은 지어낸 생년월일이에요. 맨 아래에서 두 사람 생년월일을 넣어 볼 수도 있어요.</p>

  <div class="pick" id="pick"></div>
  <div id="out"><p class="wait">옛 책에 대 보는 중이에요…</p></div>

  <form class="card" id="f">
    <div class="two">
      <fieldset><legend>당신</legend>
        <label>태어난 날 · 양력</label>
        <div class="r"><input id="a_y" type="number" inputmode="numeric" placeholder="연" min="1920" max="2025" required><input id="a_m" type="number" inputmode="numeric" placeholder="월" min="1" max="12" required><input id="a_d" type="number" inputmode="numeric" placeholder="일" min="1" max="31" required></div>
        <label>태어난 시각 · 모르면 비워 두세요</label>
        <div class="r"><input id="a_h" type="number" inputmode="numeric" placeholder="시" min="0" max="23"><input id="a_i" type="number" inputmode="numeric" placeholder="분" min="0" max="59"></div>
        <label>성별</label>
        <select id="a_g"><option value="F">여</option><option value="M">남</option></select>
      </fieldset>
      <fieldset><legend>그 사람</legend>
        <label>태어난 날 · 양력</label>
        <div class="r"><input id="b_y" type="number" inputmode="numeric" placeholder="연" min="1920" max="2025" required><input id="b_m" type="number" inputmode="numeric" placeholder="월" min="1" max="12" required><input id="b_d" type="number" inputmode="numeric" placeholder="일" min="1" max="31" required></div>
        <label>태어난 시각 · 모르면 비워 두세요</label>
        <div class="r"><input id="b_h" type="number" inputmode="numeric" placeholder="시" min="0" max="23"><input id="b_i" type="number" inputmode="numeric" placeholder="분" min="0" max="59"></div>
        <label>성별</label>
        <select id="b_g"><option value="M">남</option><option value="F">여</option></select>
      </fieldset>
    </div>
    <button class="go" type="submit">두 사람 대 보기</button>
    <div class="err" id="err"></div>
  </form>

  <p class="foot">생년월일은 계산에만 쓰고 남기지 않아요. 태어난 곳은 서울로 봤어요.<br><a href="./">책사 처음으로</a> · <a href="about.html">책사 소개</a> · <a href="privacy.html">개인정보처리방침</a></p>
</main>
<script>
/* 그리기만 한다 — 계산 · 고르기 · 글은 비공개 서버 /api/namnyeo. */
(function () {
  'use strict';
  var API = 'https://chaeksa-behavior-core.vercel.app';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var 견본 = [
    { 이름: '여느 쌍', a: { year: 1992, month: 8, day: 14, hour: 10, minute: 0, gender: 'M' }, b: { year: 1994, month: 3, day: 3, hour: 15, minute: 0, gender: 'F' } },
    { 이름: '여자 두 사람', a: { year: 1995, month: 11, day: 20, hour: 8, minute: 0, gender: 'F' }, b: { year: 1993, month: 6, day: 5, hour: 21, minute: 0, gender: 'F' } },
    { 이름: '시를 모르는 사람', a: { year: 1990, month: 1, day: 25, hour: 7, minute: 30, gender: 'M' }, b: { year: 1991, month: 7, day: 9, gender: 'F' } }
  ];
  var 기억 = {};
  function 날말(p) {
    return p.year + '년 ' + p.month + '월 ' + p.day + '일 ' + (p.hour == null ? '시 모름' : p.hour + '시' + (p.minute ? ' ' + p.minute + '분' : '')) + ' · ' + (p.gender === 'F' ? '여' : '남');
  }
  function 사람칸(p, 날) {
    var h = '<div class="card"><p class="who-h">' + esc(p.누구) + '</p>' + (날 ? '<p class="who-s">' + esc(날) + '</p>' : '');
    if (p.시모름글) h += '<p class="note">' + esc(p.시모름글) + '</p>';
    p.상자.forEach(function (s) {
      h += '<div class="box' + (s.종류 === '갈림' ? ' split' : '') + '"><p class="k">' + esc(s.제목) + '</p><p>' + esc(s.글) + '</p></div>';
    });
    if (p.드문.length) {
      h += '<div class="rare"><p class="k">' + esc(p.드문머리) + '</p><ul>';
      p.드문.forEach(function (d) { h += '<li>' + esc(d.글) + '<small>' + esc(d.책) + '</small></li>'; });
      h += '</ul></div>';
    }
    if (p.시따라 && p.시따라.length) {
      h += '<div class="rare"><p class="k">' + esc(p.시따라머리) + '</p><ul>';
      p.시따라.forEach(function (d) { h += '<li>' + esc(d.글) + '<small>' + esc(d.책) + '</small></li>'; });
      h += '</ul></div>';
    }
    if (p.빈) h += '<p class="note">' + esc(p.빈) + '</p>';
    return h + '</div>';
  }
  function 줄칸(g, z) {
    var w = g.원문[z[0]] || null, 까 = z[2] >= 0 ? g.까닭[z[2]] : '';
    var h = '<div class="row"><b>' + esc(z[0]) + '</b> ';
    if (w) {
      h += esc(w[0]) + (w[5] ? ' <span class="m">· ' + (w[5] === '해' ? '해마다' : '대운') + ' 줄</span>' : '') + '<br>' + esc(w[3]);
      h += '<br><span class="w">' + esc(w[1]) + '</span><br><span class="m">' + esc(w[2]) + (w[4] != null ? ' · 무작위 600명 가운데 걸림 ' + w[4] + '%' : '') + '</span>';
    }
    if (까) h += '<br><span class="m">' + esc(까) + '</span>';
    return h + '</div>';
  }
  var 상태말 = { 걸림: '걸림', 시모름갈림: '시에 따라 갈림', 못잼: '못 잼 — 원문이 재는 법을 주지 않았거나 읽기가 갈림', 안걸림: '안 걸림', 해당없음: '해당 없음 — 다른 성별 조항 · 대상 아님' };
  function 묶음(g, 줄, 제목) {
    var h = '<h3>' + esc(제목) + '</h3>';
    g.상태.forEach(function (st, i) {
      var 이 = 줄.filter(function (z) { return z[1] === i; });
      if (!이.length) return;
      h += '<details class="st" data-st="' + i + '"><summary>' + esc(상태말[st] || st) + ' · ' + 이.length + '줄</summary><div class="rows"></div></details>';
    });
    return h;
  }
  function 근거칸(r) {
    var g = r.근거;
    var h = '<details class="fold"><summary>근거 보기 — 옛 책 조항 전체</summary><p class="memo">' + esc(g.메모) + '</p>';
    g.사람.forEach(function (p, k) { h += '<div data-who="' + k + '">' + 묶음(g, p.줄, p.누구 + ' — 조항 ' + p.줄.length + '줄') + '</div>'; });
    if (g.맞댐) h += '<div data-who="pair">' + 묶음(g, g.맞댐, '두 사람 맞댐 — ' + g.맞댐.length + '줄') + '</div>';
    else h += '<h3>두 사람 맞댐</h3><p class="memo">' + esc(g.맞댐메모) + '</p>';
    return h + '</details>';
  }
  function 그리기(r, 날들) {
    var h = '<div class="lead"><p>' + esc(r.머리[0]) + '</p><p class="s">' + esc(r.머리[1]) + '</p></div>';
    r.사람.forEach(function (p, i) { h += 사람칸(p, 날들 && 날들[i]); });
    h += '<div class="card pair"><p class="who-h">' + esc(r.맞댐.머리) + '</p>';
    r.맞댐.줄.forEach(function (x) { h += '<p>' + esc(x.글) + '</p>' + (x.갈림 ? '<p class="note">' + esc(x.갈림) + '</p>' : ''); });
    if (r.맞댐.글) h += '<p class="note">' + esc(r.맞댐.글) + '</p>';
    h += '</div>' + 근거칸(r);
    $('out').innerHTML = h;
    // 접힘은 펼칠 때 줄을 그린다(한 사람 802줄)
    Array.prototype.forEach.call($('out').querySelectorAll('details.st'), function (d) {
      d.addEventListener('toggle', function () {
        var box = d.querySelector('.rows');
        if (!d.open || box.childNodes.length) return;
        var who = d.parentNode.getAttribute('data-who'), i = +d.getAttribute('data-st');
        var 줄 = who === 'pair' ? r.근거.맞댐 : r.근거.사람[+who].줄;
        box.innerHTML = 줄.filter(function (z) { return z[1] === i; }).map(function (z) { return 줄칸(r.근거, z); }).join('');
      });
    });
  }
  async function 부름(a, b) {
    var 열쇠 = JSON.stringify([a, b]);
    if (기억[열쇠]) return 기억[열쇠];
    var res = await fetch(API + '/api/namnyeo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ a: a, b: b }) });
    var j = await res.json();
    if (!res.ok) throw new Error(j && j.error || '계산하지 못했어요.');
    기억[열쇠] = j;
    return j;
  }
  async function 보기(a, b) {
    $('out').innerHTML = '<p class="wait">옛 책에 대 보는 중이에요…</p>';
    try { 그리기(await 부름(a, b), [날말(a), 날말(b)]); }
    catch (e) { $('out').innerHTML = '<p class="err">' + esc(e.message || '계산하지 못했어요.') + '</p>'; }
  }
  $('pick').innerHTML = 견본.map(function (s, i) { return '<button type="button" data-i="' + i + '">' + esc(s.이름) + '<br><small>' + esc(날말(s.a)) + ' × ' + esc(날말(s.b)) + '</small></button>'; }).join('');
  Array.prototype.forEach.call($('pick').querySelectorAll('button'), function (bt) {
    bt.addEventListener('click', function () {
      Array.prototype.forEach.call($('pick').querySelectorAll('button'), function (x) { x.classList.toggle('on', x === bt); });
      var s = 견본[+bt.getAttribute('data-i')];
      보기(s.a, s.b);
    });
  });
  $('pick').querySelector('button').click();
  function 사람읽기(k) {
    var n = function (id) { var v = $(k + '_' + id).value.trim(); return v === '' ? null : Number(v); };
    var o = { year: n('y'), month: n('m'), day: n('d'), gender: $(k + '_g').value };
    if (!o.year || !o.month || !o.day) return null;
    if (n('h') != null) { o.hour = n('h'); o.minute = n('i') || 0; }
    return o;
  }
  $('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var a = 사람읽기('a'), b = 사람읽기('b');
    $('err').textContent = '';
    if (!a || !b) { $('err').textContent = '두 사람의 태어난 날을 다 넣어 주세요.'; return; }
    Array.prototype.forEach.call($('pick').querySelectorAll('button'), function (x) { x.classList.remove('on'); });
    보기(a, b);
    $('out').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
})();
</script>
</body>
</html>
