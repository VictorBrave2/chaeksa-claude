<style>
/* 10-05 사장님 「다른 메뉴들은 왼쪽에 홈이 있잖아 통일」 — 앱 탭과 같은 「← 홈」 단추(btn ghost small backhome)를 본문 왼쪽 위에.
   10-05 사장님 「홈으로 가는 길이 없고 색상이랑 디자인이 거부감」 — 이 쪽만의 색을 걷고 사이트 공통(style.css 변수 · 머리 줄)을 쓴다 */
.wrap{max-width:560px;margin:0 auto;padding:var(--s3) 18px 80px}
.eyebrow{font-size:var(--t1);color:var(--accent);letter-spacing:.06em;margin:0}
h1{font-family:var(--serif);font-size:var(--t5);line-height:1.45;margin:6px 0 8px;color:var(--ink)}
.sub{color:var(--ink2);font-size:var(--t2);margin:0 0 var(--s3);line-height:1.75}
.sec{font-family:var(--serif);font-size:var(--t4);color:var(--ink);margin:var(--s4) 0 var(--s2);font-weight:700}
.card,.bd{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;margin:var(--s2) 0;box-shadow:var(--shadow)}
.card .k{font-size:var(--t1);color:var(--ink3)}.card .y{font-family:var(--serif);font-size:var(--t5);margin:2px 0 6px;color:var(--ink)}.card .y small{font-size:var(--t2);color:var(--ink3)}
.card p{margin:0;font-size:var(--t3);line-height:1.75;color:var(--ink)}
label{display:block;font-size:var(--t2);color:var(--ink2);margin:var(--s2) 0 4px}
input,select{width:100%;font-size:var(--t3);padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r1);background:var(--bg2);color:var(--ink);font-family:var(--sans)}
.row{display:flex;gap:8px}.row>*{flex:1}
.seg{display:flex;gap:8px}.seg label{flex:1;margin:0;text-align:center;border:1px solid var(--line2);border-radius:var(--r1);padding:10px;cursor:pointer;color:var(--ink2)}
.seg input{display:none}.seg input:checked+span{font-weight:700;color:var(--accent)}
.go{display:block;width:100%;margin-top:18px;padding:14px;border:0;border-radius:var(--r3);background:var(--accent);color:#fff;font-size:var(--t3);font-weight:700;cursor:pointer}

.err{color:var(--accent);font-size:var(--t2);margin-top:10px;min-height:1em}
.btns{display:flex;gap:8px;margin-top:10px}.btns button,.who button{flex:1;padding:10px;border:1px solid var(--line2);border-radius:var(--r3);background:var(--card);font-size:var(--t2);color:var(--ink2);cursor:pointer;font-family:var(--sans)}
.btns button.on,.who button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line);font-weight:700}
.big{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r2);padding:18px;margin:var(--s2) 0}.big p{margin:8px 0;font-size:var(--t3);line-height:1.75;color:var(--ink)}.big b{color:var(--accent)}
.big small{display:block;margin-top:4px;font-size:var(--t2);color:var(--ink2);line-height:1.65}
.who{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}.who button{flex:0 0 auto;padding:8px 14px}.who-h{font-size:var(--t2);color:var(--ink2);margin:0}.hide{display:none}
/* 10-06 「옛 책이 본 내 머리」 — 원문 칸 · 물음 · 펼침 */
.card .q{font-family:var(--letter);font-size:var(--t3);line-height:1.8;color:var(--ink);margin:0 0 8px}.why,.card .why{font-size:var(--t2);color:var(--ink2);line-height:1.7;margin:8px 2px 0}.why small{color:var(--ink3);font-size:var(--t1)}
.q2,.card .q2{font-size:var(--t2);color:var(--ink);font-weight:700;margin:var(--s2) 2px 0;line-height:1.7}details.fold{margin:var(--s2) 0}details.fold>summary{font-size:var(--t2);color:var(--accent);padding:10px 2px;font-weight:700}
/* 10-06 한 메뉴 두 관점 — 탭 둘 */
.tabs{display:flex;gap:6px;margin:var(--s2) 0 var(--s3);border-bottom:1px solid var(--line)}.tabs button{flex:1;padding:10px 6px;border:0;border-bottom:2px solid transparent;background:none;font-size:var(--t2);color:var(--ink2);cursor:pointer;font-family:var(--sans)}.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.share-row{margin:var(--s3) 0 0;text-align:center}.share-row .btn{width:auto;padding:10px 18px}.share-row .why{margin-top:8px}
.note{font-size:var(--t1);color:var(--ink3);line-height:1.7;margin-top:var(--s3)}
.foot{font-size:var(--t1);color:var(--ink3);line-height:1.8;margin-top:var(--s4)}.foot a{color:var(--ink3)}
</style>
<style>
/* 11-03 정통 타로 궁합 결과표 — 정통 사주 궁합과 같은 꼴 · 사이트 공통 변수만 */
.tg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:var(--s2) 0}.tg-c{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:10px;min-width:0}.tg-c.him{border-color:var(--accent-line);background:var(--accent-soft)}
.tg-c img{display:block;width:100%;max-width:140px;margin:0 auto 6px;border-radius:6px}.tg-c img.rev{transform:rotate(180deg)}.tg-c .n{font-size:var(--t1);color:var(--ink3);margin:0}.tg-c .y{font-family:var(--serif);font-size:var(--t3);color:var(--ink);margin:2px 0}.tg-c .g{font-size:var(--t1);color:var(--accent);margin:0}.tg-c p.m{font-size:var(--t2);color:var(--ink2);line-height:1.6;margin:4px 0 0}
.gh-ms table{width:100%;border-collapse:collapse;font-family:var(--letter);text-align:center}.gh-ms th{font-size:var(--t1);color:var(--ink2);text-align:left;font-weight:400;padding:4px 0}.gh-ms td{font-size:var(--t4);color:var(--ink);padding:4px 0}
.gh-name{font-family:var(--serif);font-size:var(--t5);color:var(--ink);margin:4px 0 8px}
.gh-f.on{border-color:var(--accent-line)}.gh-f .k{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.gh-tag{font-size:var(--t1);color:var(--accent)}
/* 11-06 열 장 엮기(결정함 141) — 결론 굵게 · 단락 · 할 일 */
/* 11-06 열 장 고르기 · 뒤집기 연출(three.css 판 · 부채꼴 그대로) — 막 뒤집은 장 한 줄 */
.three-card p.three-fan-say{text-wrap:pretty}.gh-story p,.gh-t4 p{text-wrap:pretty;word-break:keep-all}
.gh-flip-now{margin:6px 0 0;font-size:var(--t2);line-height:1.6;color:var(--ink);text-align:center;word-break:keep-all}.gh-flip-now span{color:var(--ink3)}.gh-flip-now b{font-family:var(--serif)}
/* 11-07 처지 고르기(결정함 142) — 단추는 .who 공용 · 결과 머리의 처지 줄 */
.gh-state .who{justify-content:center;margin:12px 0 6px}.gh-state .who button{padding:11px 18px;font-size:var(--t3)}.gh-state .why{text-align:center}.gh-state-line{font-size:var(--t2);color:var(--ink2);margin:0 0 6px}
.gh-story .gh-a{margin-top:10px}.gh-story p.qh{margin:0 0 2px;font-size:var(--t1);color:var(--accent);font-weight:700;letter-spacing:.02em}.gh-story .gh-a p+p{margin-top:0}
.gh-story:empty{display:none}.gh-story p.c{font-family:var(--serif);font-size:var(--t4);font-weight:700;line-height:1.6;margin:2px 0 8px}.gh-story p+p{margin-top:8px}.gh-story p.todo{font-weight:700;margin-top:10px}
</style>
