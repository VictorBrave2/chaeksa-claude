<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>결제 확인 · 책사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .doc{max-width:520px;margin:0 auto;padding:48px 18px 80px;text-align:center}
  .doc h1{font-family:var(--serif);font-size:24px;margin:18px 0 8px}
  .doc p{font-size:14.5px;line-height:1.85;color:var(--ink2)}
  .mark{font-size:40px;line-height:1}
  .box{margin:26px 0;padding:18px 20px;border-radius:14px;background:var(--accent-soft);
       border:1px solid var(--accent-line);text-align:left}
  .row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0}
  .row span:first-child{color:var(--ink3)}
  .row span:last-child{color:var(--ink);font-weight:700}
  .btn{display:inline-block;margin-top:8px;padding:12px 22px;border-radius:11px;
       text-decoration:none;font-size:14px;font-weight:700}
  .btn.go{background:var(--accent);color:#fff}
  .btn.sub{color:var(--ink3)}
  .warn{font-size:12.5px;color:var(--ink3);margin-top:18px}
</style>
</head>
<body>
<div class="doc" id="out">
  <div class="mark">⏳</div>
  <h1>결제를 확인하고 있습니다</h1>
  <p>창을 닫지 말고 잠시만 기다려 주세요.</p>
</div>

<script src="config.js"></script>
<script src="cloud.js"></script>
<script src="pay.js"></script>
<script>
(function () {
  var m = localStorage.getItem('chaeksa.theme') || 'auto';
  var h = new Date().getHours();
  var night = m === 'night' || (m === 'auto' && (h < 6 || h >= 18));
  document.documentElement.setAttribute('data-theme', night ? 'night' : 'day');

  var q = new URLSearchParams(location.search);
  var out = document.getElementById('out');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g,
    function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); };

  function draw(html) { out.innerHTML = html; }

  function fail(msg, code) {
    draw('<div class="mark">🌙</div>'
      + '<h1>결제를 마치지 못했습니다</h1>'
      + '<p>' + esc(msg) + '</p>'
      + (code ? '<p class="warn">코드 ' + esc(code) + '</p>' : '')
      + '<p class="warn">돈이 빠져나갔는데 이 화면이 보인다면 아래로 알려주세요. 바로 확인해 돌려드립니다.</p>'
      + '<p><a class="btn go" href="./">책사로 돌아가기</a></p>'
      + '<p><a class="btn sub" href="mailto:b01099991263@gmail.com">b01099991263@gmail.com</a></p>');
  }

  var paymentKey = q.get('paymentKey'), orderId = q.get('orderId'), amount = q.get('amount');
  if (!paymentKey || !orderId || !amount) {
    // 결제창을 거치지 않고 이 주소를 직접 연 경우다.
    fail('결제 정보가 없습니다. 결제 화면을 거치지 않고 열린 주소 같습니다.');
    return;
  }

  // 승인은 서버가 한다. 여기서는 부탁만 하고 결과를 그린다 —
  // 이 요청이 끝나야 결제가 끝난 것이고, 그전까지는 돈이 잡혀만 있다.
  ChaeksaPay.confirm({ paymentKey: paymentKey, orderId: orderId, amount: amount })
    .then(function (r) {
      if (!r || !r.ok) { fail(r && r.message || '승인에 실패했습니다.', r && r.code); return; }
      draw('<div class="mark">🌸</div>'
        + '<h1>결제가 끝났습니다</h1>'
        + '<p>' + (r.already ? '이미 처리된 주문입니다.' : '고맙습니다. 곧 시작하겠습니다.') + '</p>'
        + '<div class="box">'
        +   '<div class="row"><span>상품</span><span>' + esc(r.name) + '</span></div>'
        +   '<div class="row"><span>금액</span><span>' + esc(ChaeksaPay.won(r.amount)) + '</span></div>'
        +   '<div class="row"><span>주문번호</span><span style="font-size:11.5px">' + esc(orderId) + '</span></div>'
        + '</div>'
        + (function () {
            // 무엇을 샀는지는 주문번호가 안다: ck_<상품>_...
            var code = (String(orderId).match(/^ck_([a-z]+)_/) || [])[1];
            if (code === 'taekil') return ''
              + '<p>출산택일은 <b>사람이 직접 계산</b>합니다. 결과는 메일로 보내드립니다 (보통 2~3일).</p>'
              + '<p><a class="btn go" href="mailto:b01099991263@gmail.com?subject=%5B%EC%B1%85%EC%82%AC%5D%20%EC%B6%9C%EC%82%B0%ED%83%9D%EC%9D%BC&body=' + encodeURIComponent('주문번호: ' + orderId) + '">메일로 이어가기</a></p>';
            var back = { inyeon: '인연이 오는 해 화면에 그 해 열두 달이',
                         relation: '우리 둘 사이 화면에 날짜와 시진이',
                         month: '오늘 탭에 이번 달 일운 달력이',
                         wealth: '재물 스토리 화면에 앞으로 여섯 해가' }[code];
            return '<p>' + (back ? back + ' <b>바로 열렸습니다.</b>' : '결제하신 내용이 앱에서 열렸습니다.')
              + '</p><p><a class="btn go" href="./">책사로 돌아가서 보기</a></p>';
          })()
        + (r.receipt ? '<p><a class="btn sub" href="' + esc(r.receipt) + '" target="_blank" rel="noopener">영수증 보기</a></p>' : '')
        + '<p><a class="btn sub" href="./">책사로 돌아가기</a></p>'
        + (r.saveWarning ? '<p class="warn">결제는 되었으나 주문 기록에 문제가 있었습니다. 주문번호를 남겨 두세요.</p>' : ''));
    })
    .catch(function (e) { fail(String(e && e.message || e)); });
})();
</script>
</body>
</html>
