<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>결제 확인 · 책사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=751">
<style>
  .doc{max-width:520px;margin:0 auto;padding:48px 18px 80px;text-align:center}
  .doc h1{font-family:var(--serif);font-size:24px;margin:18px 0 8px}
  .doc p{font-size:14.5px;line-height:1.85;color:var(--ink2)}
  .mark{font-size:40px;line-height:1}
  .box{margin:26px 0;padding:18px 20px;border-radius:14px;background:var(--accent-soft);
       border:1px solid var(--accent-line);text-align:left}
  .row{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:5px 0}
  .row span:first-child{color:var(--ink3)}
  .row span:last-child{color:var(--ink);font-weight:700;text-align:right}
  .btn{display:inline-block;margin-top:8px;padding:12px 22px;border-radius:11px;
       text-decoration:none;font-size:14px;font-weight:700}
  .btn.go{background:var(--accent);color:#fff}
  /* 버튼 셋이 모두 금색 통으로 보이고 보조 버튼 글씨가 묻혔다(2026-09-11 캡처) — 보조는 바탕을 걷는다 */
  .btn.sub{background:transparent;box-shadow:none;color:var(--ink2)}
  .warn{font-size:12.5px;color:var(--ink3);margin-top:18px}
  /* 신청서(.intake) 모양은 style.css — 신청 페이지(taekil-apply)와 같이 쓴다 */
</style>
</head>
<body>
<div class="doc" id="out">
  <div class="mark">驗</div>
  <h1>결제를 확인하고 있습니다</h1>
  <p>창을 닫지 말고 잠시만 기다려 주세요.</p>
</div>

<script src="config.js?v=751"></script>
<script src="cloud.js?v=751"></script>
<script src="pay.js?v=751"></script>
<script>
(function () {
  var m = localStorage.getItem('chaeksa.theme') || 'auto';
  var h = new Date().getHours();
  var night = m === 'night' || (m === 'auto' && (h < 6 || h >= 18));
  document.documentElement.setAttribute('data-theme', night ? 'night' : 'day');

  var q = new URLSearchParams(location.search);
  var out = document.getElementById('out');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g,
    function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); };

  function draw(html) { out.innerHTML = html; }

  function fail(msg, code) {
    draw('<div class="mark">止</div>'
      + '<h1>결제를 마치지 못했습니다</h1>'
      + '<p>' + esc(msg) + '</p>'
      + (code ? '<p class="warn">코드 ' + esc(code) + '</p>' : '')
      + '<p class="warn">돈이 빠져나갔는데 이 화면이 보인다면 아래로 알려주세요. 바로 확인해 돌려드립니다.</p>'
      + '<p><a class="btn go" href="./">책사로 돌아가기</a></p>'
      + '<p><a class="btn sub" href="mailto:b01099991263@gmail.com">b01099991263@gmail.com</a></p>');
  }

  // ── 출산택일 신청서 ──────────────────────────────────────────
  // 신청 페이지(taekil-apply.html)에서 적고 온 신청서가 이 기기에 초안으로 있으면 **그대로 이 주문에 붙인다** —
  // 손님은 다시 쓰지 않는다(2026-09-11 사장님 「결제하러 가기가 너무 빡세고 어지러워」).
  // 초안이 없거나(다른 길로 결제) 붙이지 못하면 이 자리에서 받는다. 붙는 곳: ChaeksaPay.intake →
  // order_intake(server/migrate-23). 막히면 적은 그대로 메일 초안으로 물러난다.
  // 한 번 접수되면 주문번호로 기억해 둔다 — 새로고침에 빈 양식이 떠서 다시 보내면 앞서 적은 것을
  // 덮어 지우게 되기 때문이다(2026-09-11 검토). 고칠 것은 메일로 받는다.
  var F = window.ChaeksaPay && ChaeksaPay.주문서;

  function 받음(d) {
    var 줄 = function (k, v) { return v ? '<div class="row"><span>' + k + '</span><span>' + esc(v) + '</span></div>' : ''; };
    return '<div class="intake"><h2>신청이 접수됐습니다</h2>'
      + '<p class="lead">보고서는 이 주소로 보내 드립니다 — <b>' + esc(d.mail) + '</b></p>'
      + '<p class="lead">보통 2~3일 걸리고, 길어지면 미리 알려 드립니다.</p>'
      + '<div class="box" style="margin:14px 0 10px">'
      +   줄('출산 예정 기간', d.range) + 줄('태어날 지역', d.place)
      +   줄('아이 성별', d.sex === '모름' ? '아직 몰라요' : d.sex)
      +   줄('앞세우는 것', F.앞세움이름(d.first)) + '</div>'
      + '<p class="lead">고칠 것이 생기면 주문번호와 함께 메일로 알려 주세요 — ' + esc(F.문의메일) + '</p></div>';
  }

  function 양식(자리, orderId, 앞) {
    // 신청 페이지에서 받은 동의가 초안에 있으면 그대로 잇는다(켜기가 초안을 다시 쓰기 전에 챙긴다).
    // 없으면(다른 길로 결제) 여기서 같은 말로 동의를 받는다 — 건강과 이어진 내용이라 따로 받아야 한다(검토).
    var 앞선동의 = (F.초안() || {}).consent || null;
    자리.innerHTML = '<form class="intake" id="intake" novalidate><h2>신청서</h2>'
      + '<p class="lead">아래를 적어 보내 주시면 이 주문과 함께 제게 옵니다. 결과는 적어 주신 메일로 보내 드립니다 — '
      +   '보통 2~3일, 길어지면 미리 알려 드립니다.</p>'
      + F.틀()
      + '<p class="hint">적어 주신 내용은 보고서를 만들고 보내 드리는 데만 쓰고, 이 주문 기록과 함께 보관합니다. '
      +   '부모님·형제자매의 정보는 그분들께 알린 뒤 적어 주세요.</p>'
      + (앞선동의 ? '' : '<label class="agree"><input type="checkbox" id="agreeData"><span>' + F.동의문 + '</span></label>')
      + '<button type="submit" class="send" id="i_send">신청서 보내기</button>'
      + '<p class="msg" id="i_msg"></p></form>';
    var f = document.getElementById('intake'), msg = document.getElementById('i_msg'), send = document.getElementById('i_send');
    F.켜기(f);
    // 막혔을 때는 손님 탓처럼 들리지 않게, 영어 코드 없이 — 적은 것은 그대로 있고 메일로도 보낼 수 있다고.
    var 못보냄 = function (r, d) {
      msg.className = 'msg bad';
      msg.innerHTML = esc(F.이유(r)) + '. 적으신 내용은 그대로 있습니다 — 한 번 더 보내 보시고, 또 안 되면 '
        + '<a href="' + esc(F.메일초안(orderId, d)) + '"><b>메일로 보내기 →</b></a>';
    };
    if (앞) 못보냄(앞, F.값(f));
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      if (send.disabled) return;
      var d = F.값(f), 빈 = F.빈칸(d), 동의칸 = document.getElementById('agreeData');
      if (빈.length) { msg.className = 'msg bad'; msg.textContent = '비어 있거나 틀린 칸이 있습니다 — ' + 빈.join(' · '); return; }
      if (!앞선동의 && !(동의칸 && 동의칸.checked)) {
        msg.className = 'msg bad'; msg.textContent = '신청서 내용 이용에 동의해 주셔야 보낼 수 있습니다.'; return;
      }
      d.consent = 앞선동의 || { data: true, at: new Date().toISOString() };
      send.disabled = true; send.textContent = '보내는 중…';
      msg.className = 'msg'; msg.textContent = '';
      ChaeksaPay.intake(orderId, d).then(function (r) {
        // already = 이 주문에 이미 신청서가 붙어 있다(migrate-25 가 덮어쓰기를 막는다) — 접수된 것으로 본다.
        if (r && (r.ok || r.reason === 'already')) { F.초안지움(); F.보냄기록(orderId, d); 자리.innerHTML = 받음(d); return; }
        send.disabled = false; send.textContent = '신청서 보내기';
        못보냄(r, d);
      });
    });
  }

  function 접수(orderId) {
    var 자리 = document.getElementById('taekil-slot');
    if (!자리 || !F) return;
    var 이미 = F.보냄(orderId);
    if (이미) { 자리.innerHTML = 받음(이미); return; }
    var d = F.초안();
    if (d && !F.빈칸(d).length) {
      자리.innerHTML = '<div class="intake"><p class="lead">신청서를 이 주문에 붙이고 있습니다…</p></div>';
      ChaeksaPay.intake(orderId, d).then(function (r) {
        if (r && (r.ok || r.reason === 'already')) { F.초안지움(); F.보냄기록(orderId, d); 자리.innerHTML = 받음(d); }
        else 양식(자리, orderId, r || { reason: 'db' });   // 초안은 남아 있어 양식에 그대로 채워진다
      });
      return;
    }
    양식(자리, orderId, null);
  }

  var paymentKey = q.get('paymentKey'), orderId = q.get('orderId'), amount = q.get('amount');
  if (!paymentKey || !orderId || !amount) {
    // 결제창을 거치지 않고 이 주소를 직접 연 경우다.
    fail('결제 정보가 없습니다. 결제 화면을 거치지 않고 열린 주소 같습니다.');
    return;
  }

  // 승인은 서버가 한다. 여기서는 부탁만 하고 결과를 그린다 —
  // 이 요청이 끝나야 결제가 끝난 것이고, 그전까지는 돈이 잡혀만 있다.
  ChaeksaPay.confirm({ paymentKey: paymentKey, orderId: orderId, amount: amount })
    .then(function (r) {
      if (!r || !r.ok) { fail(r && r.message || '승인에 실패했습니다.', r && r.code); return; }
      // 무엇을 샀는지는 주문번호가 안다: ck_<상품>_...
      var code = (String(orderId).match(/^ck_([a-z]+)_/) || [])[1];
      var back = { inyeon: '인연이 오는 해 화면에 그 해 열두 달이',
                   relation: '우리 둘 사이 화면에 날짜와 시진이',
                   month: '오늘 탭에 이번 달 일운 달력이',
                   wealth: '재물 스토리 화면에 앞으로 여섯 해가' }[code];
      // 「돌아가서 보기」가 홈으로만 가서, 산 화면을 못 찾았다 — 특히 인연 시기는 홈에 들어가는 길이 없다
      // (2026-09-11 검토). 앱은 주소 뒤 #탭이름 으로 그 탭을 바로 연다(app.js goHash).
      var 갈곳 = { inyeon: './#inyeon', relation: './#compat', month: './#today', wealth: './#moneystory',
                  maeum: './#maeum', gunghap: './#gunghap', geunamja: './#geunamja' }[code] || './';
      draw('<div class="mark">成</div>'
        + '<h1>결제가 끝났습니다</h1>'
        + '<p>' + (r.already ? '이미 처리된 주문입니다.' : '고맙습니다. 곧 시작하겠습니다.') + '</p>'
        + '<div class="box">'
        +   '<div class="row"><span>상품</span><span>' + esc(r.name) + '</span></div>'
        +   '<div class="row"><span>금액</span><span>' + esc(ChaeksaPay.won(r.amount)) + '</span></div>'
        +   '<div class="row"><span>주문번호</span><span style="font-size:11.5px">' + esc(orderId) + '</span></div>'
        + '</div>'
        + (code === 'taekil'
            ? '<p>출산택일은 <b>사람이 직접 계산</b>합니다.</p><div id="taekil-slot"></div>'
            : '<p>' + (back ? back + ' <b>바로 열렸습니다.</b>' : '결제하신 내용이 앱에서 열렸습니다.')
              + '</p><p><a class="btn go" href="' + 갈곳 + '">바로 보러 가기</a></p>')
        + (r.receipt ? '<p><a class="btn sub" href="' + esc(r.receipt) + '" target="_blank" rel="noopener">영수증 보기</a></p>' : '')
        + '<p><a class="btn sub" href="./">책사로 돌아가기</a></p>'
        + (r.saveWarning ? '<p class="warn">결제는 되었으나 주문 기록에 문제가 있었습니다. 주문번호를 남겨 두세요. ('
            + esc(r.saveWarning) + ')</p>' : ''));
      if (code === 'taekil') 접수(orderId);
    })
    .catch(function (e) { fail(String(e && e.message || e)); });
})();
</script>
</body>
</html>
