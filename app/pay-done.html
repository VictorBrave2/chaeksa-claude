<script>

  var F = window.ChaeksaPay && ChaeksaPay.주문서;

    return '<div class="intake"><h2>신청이 접수됐습니다</h2>'

      + '<div class="box" style="margin:14px 0 10px">'

      +   줄('원하시는 방향', F.앞세움이름(d.first)) + '</div>'

  }

  function 양식(자리, orderId, 앞) {
    // 신청 페이지에서 받은 동의가 초안에 있으면 그대로 잇는다(켜기가 초안을 다시 쓰기 전에 챙긴다).
    // 없으면(다른 길로 결제) 여기서 같은 말로 동의를 받는다 — 건강과 이어진 내용이라 따로 받아야 한다(검토).
    var 앞선동의 = (F.초안() || {}).consent || null;
    자리.innerHTML = '<form class="intake" id="intake" novalidate><h2>신청서</h2>'

      + F.틀()
      + '<p class="hint">적어 주신 내용은 보고서를 만들어 드리는 데만 쓰고, 이 주문 기록과 함께 보관합니다. '

      + '<button type="submit" class="send" id="i_send">신청서 보내기</button>'

    var f = document.getElementById('intake'), msg = document.getElementById('i_msg'), send = document.getElementById('i_send');
    F.켜기(f);
    if (F.읽기켜기) F.읽기켜기(f);   // 칸마다 「이렇게 읽었어요」(10-02)
    // 막혔을 때는 손님 탓처럼 들리지 않게, 영어 코드 없이 — 적은 것은 그대로 있고 메일로도 보낼 수 있다고.
    var 못보냄 = function (r, d) {

      ChaeksaPay.intake(orderId, F.신청서(d)).then(function (r) {

  // ── 출산택일 자동 보고서(10-02 설계서 2-4) ─────────────────────

  // 로그인돼 있으면 비공개 서버에 만들기를 부르고(ChaeksaPay.taekil.make) 6초마다 「내 출산택일」(my_taekil)로 상태를 본다.
  // 로그인이 안 된 브라우저로 돌아왔으면(카카오톡 안 브라우저 등) 「내 보고서」로 안내한다 — 신청서는 이미 주문에 붙어 있다.
  // 창을 닫아도 된다 — 「내 보고서」(taekil-report.html)가 결제됐는데 안 만든 주문을 보면 다시 부른다. 그 밖의 손님은 아래 접수(지금 길) 그대로.
  function 검수() { try { return !!(window.ChaeksaUsage && ChaeksaUsage.plan() === 'super'); } catch (e) { return false; } }
  function 자동길(orderId) {
    return window.CHAEKSA_TAEKIL_AUTO === 1 || 검수() || !!(F && F.자동붙음 && F.자동붙음(orderId));
  }
  function 자동만들기(orderId) {
    var 자리 = document.getElementById('taekil-slot'), T = ChaeksaPay.taekil;
    if (!자리 || !T) return;
    var 주소 = T.주소(orderId);
    var 칸 = function (머리, 글, 아래) {
      자리.innerHTML = '<div class="intake"><h2>' + esc(머리) + '</h2>' + (글 || []).map(function (s) { return '<p class="lead">' + esc(s) + '</p>'; }).join('') + (아래 || '') + '</div>';
    };
    var 가기 = function (말) { return '<p><a class="btn go" href="' + esc(주소) + '">' + esc(말) + '</a></p>'; };
    var 로그인 = false;
    try { 로그인 = !!(window.ChaeksaCloud && ChaeksaCloud.signedIn && ChaeksaCloud.signedIn()); } catch (e) { 로그인 = false; }
    if (!로그인) {
      칸('보고서는 「내 보고서」에서 이어서 만들어요', ['로그인하면 「내 보고서」에서 이어서 만들어요. 신청서는 이미 이 주문에 붙어 있어요.'], 가기('로그인하고 보고서 보기'));
      return;
    }
    if (F && F.자동붙음 && F.자동붙음(orderId)) F.초안지움();   // 신청서가 주문에 붙었고 결제도 끝났다 — 이 기기의 초안은 이제 지운다
    var 시작 = Date.now(), 째깍 = null, 만듦 = false, 끝 = false;
    var 만드는중 = function () { 칸('여덟 글자를 연산하는 중이에요', ['보통 1~2분 걸려요. 이 창을 닫아도 돼요 — 다 만들면 책사가 한 번 더 확인한 뒤 「내 보고서」에서 열어 드려요.'], 가기('내 보고서로 가기')); };
    var 마침 = function (st, 말) {
      if (끝) return; 끝 = true; clearTimeout(째깍);
      if (st === 'ready') { 칸('보고서가 열렸어요', [], 가기('보고서 열기')); return; }
      if (st === 'checking') { 칸('책사가 한 번 더 확인하고 있어요', [T.상태말.checking], 가기('내 보고서로 가기')); return; }
      if (st === 'canceled') { 칸('환불된 주문이에요', [T.상태말.canceled]); return; }
      if (st === 'no_intake') { 칸('신청서가 아직 이 주문에 붙지 않았어요', ['「내 보고서」에서 이 기기에 적어 두신 신청서를 붙이거나, 주문번호와 함께 ' + F.문의메일 + ' 으로 알려 주세요.'], 가기('내 보고서로 가기')); return; }
      칸('보고서를 아직 만들지 못했어요', [말 || '잠시 뒤 「내 보고서」에서 다시 봐 주세요.', '결제는 그대로 있어요. 계속 안 되면 ' + F.문의메일 + ' 으로 주문번호를 알려 주세요.'], 가기('내 보고서로 가기'));
    };
    var 보기 = function () {
      clearTimeout(째깍);
      if (끝) return;
      if (Date.now() - 시작 > 8 * 60 * 1000) { 마침('', '오래 걸리고 있어요.'); return; }
      T.mine().then(function (rows) {

        var x = Array.isArray(rows) ? rows.filter(function (r) { return r && r.id === orderId; })[0] : null;
        var st = x && x.state;
        if (st === 'todo' && !만듦) { 만들기(); return; }
        if (st === 'no_intake' && !만듦) {
          // 다른 길로 결제했으면 이 기기의 초안을 붙여 본다(붙으면 만든다)
          var d = F.초안();
          if (d && !F.빈칸(d).length) {

      });
    };
    var 만들기 = function () {
      만듦 = true; 만드는중();
      T.make(orderId).then(function (r) {
        if (끝) return;
        if (r && r.ok) { 마침(r.state === 'ready' ? 'ready' : 'checking'); return; }
        if (r && r.reason === 'busy') { 보기(); return; }
        마침('', r && r.message);
      });
      째깍 = setTimeout(보기, 6000);
    };
    만드는중();
    보기();
  }

  function 접수(orderId) {
    var 자리 = document.getElementById('taekil-slot');
    if (!자리 || !F) return;
    var 이미 = F.보냄(orderId);
    if (이미) { 자리.innerHTML = 받음(이미); return; }
    var d = F.초안();
    if (d && !F.빈칸(d).length) {
      자리.innerHTML = '<div class="intake"><p class="lead">신청서를 이 주문에 붙이고 있습니다…</p></div>';
      ChaeksaPay.intake(orderId, F.신청서(d)).then(function (r) {

        else 양식(자리, orderId, r || { reason: 'db' });   // 초안은 남아 있어 양식에 그대로 채워진다
      });

  // 어느 결제사에서 돌아왔나. 카카오페이 · 네이버페이는 우리가 돌아올 주소에 pv 를 붙여 두었다(api/pay.js kopen · nopen).
  // 카카오: ?pv=kakao&orderId=…&pg_token=…   네이버: ?pv=naver&orderId=…&resultCode=…&paymentId=…   토스: ?paymentKey=…&orderId=…&amount=…
  var 카카오 = q.get('pv') === 'kakao', 네이버 = q.get('pv') === 'naver';
  var paymentKey = q.get('paymentKey'), orderId = q.get('orderId'), amount = q.get('amount');
  var pgToken = q.get('pg_token'), 네이버결과 = q.get('resultCode'), 네이버번호 = q.get('paymentId');
  // 네이버페이에서 그만뒀거나 막혔다(resultCode 가 Success 가 아님) — 승인을 부르지 않았으니 돈은 안 빠졌다. 주문을 닫고 실패 쪽으로.
  if (네이버 && orderId && 네이버결과 && 네이버결과 !== 'Success') {
    var 그만 = 네이버결과 === 'UserCancel';
    Promise.resolve(ChaeksaPay.nfail ? ChaeksaPay.nfail({ orderId: orderId, code: 네이버결과, message: q.get('resultMessage') || '' }) : null)
      .catch(function () {}).then(function () {
        location.replace('pay-fail.html?pv=naver&why=' + (그만 ? 'cancel' : 'fail') + '&orderId=' + encodeURIComponent(orderId)
          + (그만 ? '' : '&code=' + encodeURIComponent(네이버결과)));
      });
    return;
  }
  if (카카오 ? (!orderId || !pgToken) : 네이버 ? (!orderId || !네이버번호) : (!paymentKey || !orderId || !amount)) {
    // 결제창을 거치지 않고 이 주소를 직접 연 경우다.
    fail('결제 정보가 없습니다. 결제 화면을 거치지 않고 열린 주소 같습니다.');
    return;
  }

  // 승인은 서버가 한다. 여기서는 부탁만 하고 결과를 그린다 —
  // 이 요청이 끝나야 결제가 끝난 것이고, 그전까지는 돈이 잡혀만 있다.
  // 카카오는 로그인 없이도 승인된다(카카오톡에서 결제하고 다른 브라우저로 돌아온 경우) — 주문은 원래 계정에 붙는다.
  // 네이버도 로그인 없이 승인된다 — 결제번호(paymentId)는 결제한 사람만 받고, 서버가 네이버 응답의 주문번호 · 금액을 DB 와 맞춘다.
  var 승인 = 카카오
    ? ChaeksaPay.kconfirm({ orderId: orderId, pgToken: pgToken })
    : 네이버
      ? ChaeksaPay.nconfirm({ orderId: orderId, paymentId: 네이버번호 })
      : ChaeksaPay.confirm({ paymentKey: paymentKey, orderId: orderId, amount: amount });
  승인
    .then(function (r) {
      if (!r || !r.ok) { fail(r && r.message || '승인에 실패했습니다.', r && r.code); return; }
      // 주소에서 pg_token 을 치운다 — 이미 쓴 값이지만 화면 캡처 · 공유에 남길 이유가 없다. 새로고침은 already 로 답한다.
      if (카카오) { try { history.replaceState(null, '', location.pathname + '?pv=kakao&orderId=' + encodeURIComponent(orderId) + '&pg_token=used'); } catch (e) {} }
      // 무엇을 샀는지는 주문번호가 안다: ck_<상품>_... (상품 코드에 _ 가 있다 — love_full)
      var code = (String(orderId).match(/^ck_([a-z_]+?)_\d{14}_/) || [])[1];
      // 「돌아가서 보기」가 홈으로만 가서, 산 화면을 못 찾았다(2026-09-11 검토). 앱은 주소 뒤 #탭이름 으로
      // 그 탭을 바로 연다(app.js goHash). 2026-10-01 — 앱에서 열리는 유료는 연애 탭 둘뿐이다.
      var 갈곳 = { love_full: './#love', love_pair: './#pair' }[code] || './';   // 행동양식 궁합은 제 탭(pair.js)으로 — 돌아가면 산 쌍을 바로 쓴다
      // 결제는 됐는데 우리 기록이 안 된 경우(api/pay.js saved:false · SAVE_FAILED). 그냥 「끝났습니다」로 보이지 않게 따로 그린다.
      var 기록안됨 = r.saved === false || !!r.saveWarning;
      // 시험 결제(카카오 TC CID · 토스 test_ 키) — 돈이 안 빠졌고, 이 주문으로는 보고서를 만들지 않는다.
      var 시험 = r.payMode === 'test';
      if (기록안됨) {
        draw('<div class="mark">驗</div>'
          + '<h1>결제는 되었고, 기록을 맞추는 중입니다</h1>'
          + (시험 ? '<p><b>시험 결제 — 돈이 빠지지 않았습니다</b></p>' : '')
          + '<p>결제는 끝났지만 저희 쪽 주문 기록이 아직 되지 않았습니다. 이 화면을 <b>새로고침</b>하면 다시 기록합니다.</p>'
          + '<p>그래도 이 화면이 다시 보이면 아래 주문번호를 메일로 보내 주세요. 확인해서 열어 드리거나 돌려 드립니다.</p>'
          + '<div class="box">'
          +   '<div class="row"><span>상품</span><span>' + esc(r.name) + '</span></div>'
          +   '<div class="row"><span>금액</span><span>' + esc(ChaeksaPay.won(r.amount)) + '</span></div>'
          +   '<div class="row"><span>주문번호</span><span style="font-size:var(--t1)">' + esc(orderId) + '</span></div>'
          + '</div>'
          + (code === 'taekil' ? '<div id="taekil-slot"></div>' : '')
          + '<p><a class="btn go" href="mailto:dl4431@naver.com?subject=' + encodeURIComponent('[책사] 결제 기록 확인 ' + orderId) + '">메일로 알리기</a></p>'
          + '<p class="warn">코드 ' + esc(r.saveWarning || 'SAVE_FAILED') + '</p>');
        if (code === 'taekil') 접수(orderId);
        return;
      }
      // 10-02 연애 두 상품은 산 화면으로 저절로 데려간다(3초) — 전에는 「곧 시작하겠습니다」와 단추 하나만 남아, 단추를 못 본 손님은 여기서 멈췄다.
      // 돌아가면 그 화면이 서버에 산 것을 확인하고 바로 만들기 시작한다(love.js 열고시작 · pair.js 만들기). 만드는 시간은 상품 약속 장부(yaksok.js) 그대로.
      // 시험 결제(검수 계정)는 「시험 결제 취소하기」를 누를 수 있게 저절로 넘어가지 않는다. 「여기 머물기」를 누르면 멈춘다. 승인 · 금액 확인은 위 그대로다.
      var 연애 = code === 'love_full' || code === 'love_pair';
      var 자동택일 = code === 'taekil' && 자동길(orderId);   // 10-02 자동 보고서 길(위 자동만들기 머리 주석)
      var Y = window.ChaeksaYaksok, 약 = (Y && Y.줄(code)) || {}, 저절로 = 연애 && !시험;
      var 이어서 = '돌아가면 ' + (code === 'love_pair' ? '고른 그 사람의 생년월일시로' : '내 생년월일시로') + ' 바로 만들기 시작해요. '
        + (약.시간 || '조금') + ' 걸리니 다 될 때까지 그 화면을 그대로 두세요.' + (r.already ? ' 이미 만든 것이 있으면 그대로 열려요.' : '');
      draw('<div class="mark">成</div>'
        + '<h1>' + (연애 ? (r.already ? '이미 결제된 주문이에요. 봉인을 풀러 갑니다' : '결제됐어요. 봉인을 풀러 갑니다') : '결제가 끝났습니다') + '</h1>'
        + (시험 ? '<p><b>시험 결제 — 돈이 빠지지 않았습니다</b></p>' : '')
        + '<p>' + (연애 ? esc(이어서) : (r.already ? '이미 처리된 주문입니다.' : '고맙습니다. 곧 시작하겠습니다.')) + '</p>'
        + '<div class="box">'
        +   '<div class="row"><span>상품</span><span>' + esc(r.name) + '</span></div>'
        +   '<div class="row"><span>금액</span><span>' + esc(ChaeksaPay.won(r.amount)) + '</span></div>'
        +   '<div class="row"><span>주문번호</span><span style="font-size:var(--t1)">' + esc(orderId) + '</span></div>'
        + '</div>'
        // 10-02 개편 3묶음 — 이 주문번호는 이 화면에만 한 번 보였다. 설정 창 「내 결제」(app.js · pay.js 내결제)에서 언제든 다시 본다.
        + '<p class="warn" style="margin-top:-12px">이 주문번호는 홈 화면 맨 위 오른쪽 「설정」 → 「내 결제」에서 언제든 다시 볼 수 있어요.</p>'
        + (code === 'taekil'
            ? '<div id="taekil-slot"></div>'   // 10-02 「켜는 날」 — 자동 보고서 길(자동만들기)이 이 자리를 채운다. 옛 접수 길도 같은 자리
            : 연애
              ? '<p class="warn" id="goSay">' + (저절로 ? '3초 뒤에 저절로 넘어가요.' : '') + '</p><p><a class="btn go" href="' + 갈곳 + '">바로 보러 가기</a></p>'
                + (저절로 ? '<p id="stayRow"><button class="btn sub" id="stay" type="button">여기 머물기</button></p>' : '')
              : '<p>결제하신 내용이 앱에서 열렸습니다.'
                + '</p><p><a class="btn go" href="' + 갈곳 + '">바로 보러 가기</a></p>')
        + (r.receipt ? '<p><a class="btn sub" href="' + esc(r.receipt) + '" target="_blank" rel="noopener">영수증 보기</a></p>' : '')
        + (시험 && (카카오 || 네이버) ? '<p><button class="btn sub" id="testRefund" type="button">이 시험 결제 취소하기(검수 계정)</button></p><p class="warn" id="testRefundMsg"></p>' : '')
        + '<p><a class="btn sub" href="./">← 홈</a></p>');
      // 10-01 시험 결제의 취소(환불) 길도 끝까지 시험한다 — 서버(krefund)가 검수 계정만 받는다.
      var 취소 = document.getElementById('testRefund');
      if (취소) 취소.onclick = function () {
        취소.disabled = true;
        (네이버 ? ChaeksaPay.nrefund(orderId) : ChaeksaPay.krefund(orderId)).then(function (x) {
          document.getElementById('testRefundMsg').textContent = x && x.ok ? '취소됐습니다(시험). 주문이 「취소」로 바뀌었습니다.' : '취소하지 못했습니다: ' + ((x && (x.message || x.code)) || '알 수 없음');
          if (!(x && x.ok)) 취소.disabled = false;
        }).catch(function (e) { document.getElementById('testRefundMsg').textContent = String(e && e.message || e); 취소.disabled = false; });
      };
      if (code === 'taekil') { if (자동택일) 자동만들기(orderId); else 접수(orderId); }
      if (저절로) {
        var 남은 = 3, 말 = document.getElementById('goSay'), 머물 = document.getElementById('stay');
        var 째깍 = setInterval(function () {
          if (--남은 > 0) { 말.textContent = 남은 + '초 뒤에 저절로 넘어가요.'; return; }
          clearInterval(째깍); 말.textContent = '넘어가는 중이에요…';
          location.replace(갈곳);   // 이 결제 확인 쪽은 「뒤로」 목록에 남기지 않는다(뒤로 가면 다시 끌려오지 않게)
        }, 1000);
        머물.onclick = function () {
          clearInterval(째깍);
          말.textContent = '여기 머물러요. 준비되면 「바로 보러 가기」를 눌러 주세요.';
          var 줄 = document.getElementById('stayRow'); if (줄 && 줄.parentNode) 줄.parentNode.removeChild(줄);
        };
      }
    })
    .catch(function (e) { fail(String(e && e.message || e)); });
})();
