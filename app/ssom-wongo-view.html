<p class="sub">두 사람 명식으로 뼈대 + 조각을 조립한 결과입니다. 글 보기 기준이라 추론의 단서가 들어 있습니다(장면으로 보기에서는 빠집니다). 「처음 만났을 때와 지금」(두 사람 이야기 4)은 만난 달에 따라 엔진이 그리는 칸이라 여기선 뺐습니다.</p>

<script>
(function () {
  const E = ChaeksaEngine, W = ChaeksaSsomWebtoon, S = ChaeksaSsom, D = ChaeksaSsomDangye || {};
  const 남 = E.calc({ year: 1992, month: 4, day: 21, hour: 0, minute: 20, gender: 'M', longitude: 126.98 });
  const 여 = E.calc({ year: 1999, month: 12, day: 20, hour: 20, minute: 0, gender: 'F', longitude: 126.98 });
  const 쌍 = [['丁卯 남이 「당신」', 남, 여], ['丙午 여가 「당신」', 여, 남]];
  const esc = (s) => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const 제목 = { 둘: ['나는 어떤 사람에게 끌리고, 어떻게 좋아할까요?', '그 사람은 어떤 사람에게 끌리고, 어떻게 좋아할까요?', '우리는 서로 원하는 걸 주고 있을까요?', '그냥 안고 갈 것, 맞춰 볼 것은 뭘까요?'], 썸: S.질문 };
  (D.단계 || []).forEach(d => { if (d.질문) 제목[d.키] = d.질문; });
  const 이름 = { 둘: '두 사람 이야기', 시작전: '시작 전 — 첫인상', 썸: '썸', 초반: '연애 초반', 안정기: '안정기', 결혼: '결혼을 생각할 때', 흔들림: '흔들릴 때', 재회: '헤어진 뒤 — 재회' };
  function 그림(a, b) {
    return Object.keys(이름).map(k => { const w = W.조립(a, b, k, false, { 검수: true }); if (!w) return '';
      return '<h2>' + 이름[k] + '</h2>' + w.map((회, i) => { let 단 = false;
        return '<h3>' + (i + 1) + '. ' + esc((제목[k] || [])[i] || '') + '</h3>' + 회.map(([누, 말], j) => {
          if (누 === '장면') return '<p class="s' + (/쓰고 있어요/.test(말) ? ' e' : '') + '">' + esc(말) + '</p>';
          if (누 === '근거') return '<p class="g">왜 이렇게 흘러갔을까</p>';
          if (누 === '단서') { const 앞 = 단; 단 = 회[j + 1] && 회[j + 1][0] === '단서'; return (앞 ? '' : '<p class="d"><b>추론의 단서</b>') + esc(말) + (단 ? '<br>' : '</p>'); }
          const c = 누 === '당신' ? 'y' : 누 === '상대' ? 't' : 'c', t = 누 === '당신' ? '당신' : 누 === '상대' ? '그 사람' : '책사';
          return '<p><span class="b ' + c + '">' + t + '</span>' + esc(말) + '</p>'; }).join(''); }).join(''); }).join('');

  const whoBox = document.getElementById('who'), out = document.getElementById('out');

})();
