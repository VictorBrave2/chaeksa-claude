<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>책사 · 손끝으로 펼치는 카드</title>
<style>*{box-sizing:border-box}body{margin:0;background:#ede9e1;color:#292820;font-family:system-ui,sans-serif}header{max-width:1000px;margin:auto;padding:30px 24px 18px;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:22px;font-weight:550;margin:6px 0}small{color:#8c7445;letter-spacing:.15em}p{color:#776e5f;font-size:13px;line-height:1.6;margin:5px 0}nav{display:flex;gap:7px;flex-wrap:wrap}button,a{font:inherit;font-size:13px;border:1px solid #cec3ae;border-radius:24px;background:#fbf8f1;padding:10px 15px;color:#554a38;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#453b2b;color:#fff}main{width:min(720px,100%);margin:0 auto 30px;transition:width .3s}main.phone{width:min(390px,100%)}iframe{border:1px solid #d9d0bf;border-radius:20px;width:100%;height:1180px;background:#f9f6ee;display:block;box-shadow:0 18px 60px #51493412}@media(max-width:600px){header{padding:18px 16px;display:block}nav{margin-top:12px}h1{font-size:20px}iframe{border-radius:0;border-left:0;border-right:0}main{margin-bottom:0}}</style></head>
<body><header><div><small>CHAEKSA · TAROT</small><h1>손끝으로 펼치는 카드</h1><p>카드 더미를 눌러 섞고, 부채 속 카드를 세 번 눌러 보세요.<br>동작 견본입니다. 가상 카드가 나오며 실제 운세·저장 정보에 영향을 주지 않습니다.</p></div><nav><button id="wide" aria-pressed="true">넓게</button><button id="phone" aria-pressed="false">휴대폰</button><button id="again">다시 해보기</button><a href="scene.html">화면만 보기 ↗</a></nav></header><main id="stage"><iframe id="scene" src="scene.html" sandbox="allow-scripts" title="직접 눌러 보는 카드 동작 견본"></iframe></main>
<script>const stage=document.getElementById('stage'),scene=document.getElementById('scene');document.getElementById('wide').onclick=()=>{stage.classList.remove('phone');document.getElementById('wide').setAttribute('aria-pressed','true');document.getElementById('phone').setAttribute('aria-pressed','false')};document.getElementById('phone').onclick=()=>{stage.classList.add('phone');document.getElementById('wide').setAttribute('aria-pressed','false');document.getElementById('phone').setAttribute('aria-pressed','true')};document.getElementById('again').onclick=()=>{scene.src='scene.html?again='+Date.now()};</script></body></html>
