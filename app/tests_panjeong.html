<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>판정 시험</title>
<style>body{font:14px/1.6 system-ui;margin:20px;max-width:900px}h2{margin:24px 0 6px}.ok{color:#1a7f37}.no{color:#b42318}pre{background:#f4f4f4;padding:8px;overflow:auto}details{margin:4px 0}</style>
</head><body>
<h1>판정 모듈 시험 — 9/14 사장님이 확인한 읽기를 고정한다</h1>
<p>바뀌면 여기부터 빨개진다. 조문은 docs/19, 순서는 app/panjeong.js.</p>
<div id="out"></div>
<script src="config.js"></script><script src="lunar.js"></script><script src="astro.js"></script><script src="engine.js"></script>
<script src="gyeokguk.js?t=1"></script><script src="saenggeuk.js?t=1"></script><script src="panjeong.js?t=1"></script>
<script>
const E = ChaeksaEngine, G = ChaeksaSaenggeuk, P = ChaeksaPanjeong;
const S = E.STEMS, B = E.BRANCHES;
const idx = (h) => S.indexOf(h), bi = (h) => B.indexOf(h);
function 사주(y, m, d, h) { const p = {}; [['year', y], ['month', m], ['day', d], ['hour', h]].forEach(([k, gz]) => { if (gz) p[k] = { stem: idx(gz[0]), branch: bi(gz[1]) }; }); return p; }
function 운(gz, name) { return { stem: idx(gz[0]), branch: gz[1] ? bi(gz[1]) : null, name }; }
const 사례 = [];
function 시험(이름, pillars, 운들, 기대) { 사례.push({ 이름, pillars, 운들, 기대 }); }

// ── 사장님 사주 壬申 甲辰 丁卯 庚子, 정미 대운 · 병오 올해 · 정유 이달 · 신묘 오늘 (9/14 열두 질문)
const 나 = 사주('壬申', '甲辰', '丁卯', '庚子');
시험('원국 — 정관격(申子辰 국 + 壬 투출) 성격, 甲 통관', 나, [], {
  층: 0, 격: '정관', 범주: '구조 유지', 산: ['壬', '甲', '庚'],
});
시험('정미 대운 — 壬 합거 → 인수격 재취격, 庚이 甲을 바로 극(재극인)', 나, [운('丁未', '대운')], {
  층: 1, 격: '정인', 범주: '구조 전환', 죽은: ['壬'], 이력: { 글자: '연간 壬', 조: '28조' },
});
시험('병오 올해 — 丙이 庚을 제복 → 구제됨', 나, [운('丁未', '대운'), 운('丙午', '올해')], {
  층: 2, 격: '정인', 범주: '구제됨',
});
시험('정유 이달 — 유지', 나, [운('丁未', '대운'), 운('丙午', '올해'), 운('丁酉', '이달')], {
  층: 3, 격: '정인', 범주: '구제됨',
});
// 열두 질문의 9·10번 — 이달 丁(비견, 묶이지 않음)이 庚을 대신 막는다 → 「구제 약화」. 사장님 확인(09-14 「구응 약화 인정」).
시험('신묘 오늘 — 辛이 丙을 합거(운끼리 먼저) → 원래 구응 상실, 이달 丁이 대신 막음 → 구제 약화', 나, [운('丁未', '대운'), 운('丙午', '올해'), 운('丁酉', '이달'), 운('辛卯', '오늘')], {
  층: 4, 격: '정인', 범주: '구제 약화', 죽은: ['丙'], 이력: { 글자: '올해 丙', 조: '28조' },
});
// 이달에 대신 막을 火가 없으면 辛이 丙을 묶는 순간 庚이 甲을 바로 친다 → 손상 재발
// (乙酉는 乙이 庚을 묶고, 戊申은 戊가 월령 본기 투출이라 상관격으로 바뀐다 — 둘 다 엔진이 맞고 예가 틀렸던 것. 庚申으로 둔다)
시험('경신 이달 + 신묘 오늘 — 대신 막을 火가 없으면 손상 재발', 나, [운('丁未', '대운'), 운('丙午', '올해'), 운('庚申', '이달'), 운('辛卯', '오늘')], {
  층: 4, 격: '정인', 범주: '손상 재발', 죽은: ['丙'],
});
// 잡기월(辰)의 본기 戊가 운으로 투출하면 상관격으로 변격 — 「상관격 입장에서 다시 들여다본다」(사장님 09-14). 乙酉 이달은 乙庚합으로 극 자체가 없어진다(「을경 극자체가 없어지지」).
시험('무신 이달 — 戊 본기 투출 → 상관격 변격(잡기격) · 41조 壬 합거된 수국은 관 노릇 없음(관살이 낀다 안 뜸)', 나, [운('丁未', '대운'), 운('丙午', '올해'), 운('戊申', '이달')], {
  층: 3, 격: '상관', 범주: '구조 전환', 근거없음: '재를 생하는데 관살이 낀다',
});
시험('을유 이달 — 乙이 庚을 묶어 甲을 치는 극 자체가 없다', 나, [운('丁未', '대운'), 운('丙午', '올해'), 운('乙酉', '이달')], {
  층: 3, 격: '정인', 범주: '구조 유지', 죽은: ['庚'],
});
// ── 甲 대운 + 己 세운 → 운끼리 묶인다, 원국 甲은 남는다
시험('갑X 대운 + 기X 세운 — 운끼리 묶이고 원국 甲은 산다', 나, [운('甲子', '대운'), 운('己亥', '올해')], {
  층: 2, 산: ['甲'], 죽은표: { 이름: '대운', 글자: '甲' },
});
// ── 3배 규칙: 庚 0.55 vs 甲 2 → 못 침 (시험 사주)
시험('시험 사주 — 3배 규칙, 庚이 甲을 못 침', 사주('甲寅', '甲寅', '丁卯', '庚子'), [], {
  층: 0, 막힘극: ['庚→甲'],
});

const out = document.getElementById('out');
let 통과 = 0, 실패 = 0;
사례.forEach(c => {
  const R = { pillars: c.pillars, dayStem: c.pillars.day.stem };
  let p; try { p = P.판정(R, new Date(), { 운들: c.운들 }); } catch (e) { out.insertAdjacentHTML('beforeend', '<h2 class="no">✗ ' + c.이름 + '</h2><pre>' + e.stack + '</pre>'); 실패++; return; }
  const 층 = p.층들[c.기대.층]; const 문제 = [];
  if (c.기대.격 && (!층.격 || 층.격.지금격 !== c.기대.격)) 문제.push('격 기대 ' + c.기대.격 + ' 실제 ' + (층.격 && 층.격.지금격));
  if (c.기대.범주 && 층.범주 !== c.기대.범주) 문제.push('범주 기대 ' + c.기대.범주 + ' 실제 ' + 층.범주);
  (c.기대.산 || []).forEach(h => { if (!층.표.글자.find(g => !g.운 && g.글자 === h && g.산다)) 문제.push(h + ' 이 살아 있어야 함'); });
  (c.기대.죽은 || []).forEach(h => { if (!층.표.글자.find(g => g.글자 === h && !g.산다)) 문제.push(h + ' 이 죽어 있어야 함'); });
  if (c.기대.죽은표) { const g = 층.표.글자.find(x => x.이름 === c.기대.죽은표.이름 && x.글자 === c.기대.죽은표.글자); if (!g || g.산다) 문제.push(c.기대.죽은표.이름 + ' ' + c.기대.죽은표.글자 + ' 이 죽어 있어야 함'); }
  if (c.기대.이력) { const h = 층.이력.find(x => x.글자 === c.기대.이력.글자); if (!h || !h.이력.find(i => i.조.indexOf(c.기대.이력.조) >= 0)) 문제.push(c.기대.이력.글자 + ' 이력에 ' + c.기대.이력.조 + ' 가 있어야 함'); }
  if (c.기대.근거없음) { const j = 층.격 && 층.격.성패, all = j ? [].concat(j.근거.섰다 || [], j.근거.띠었다 || [], j.근거.깨졌다 || [], j.근거.구제 || []) : []; if (all.indexOf(c.기대.근거없음) >= 0) 문제.push('격표 근거에 「' + c.기대.근거없음 + '」가 없어야 함'); }
  (c.기대.막힘극 || []).forEach(s => { const [a, b] = s.split('→'); const r = 층.표.쌍.find(x => x.관계 === '극' && x.from.글자 === a && x.to.글자 === b); if (!r || !r.막힘) 문제.push(s + ' 극이 막혀야 함'); });
  const ok = !문제.length; ok ? 통과++ : 실패++;
  let html = '<h2 class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ ' : '✗ ') + c.이름 + '</h2>';
  if (!ok) html += '<pre>' + 문제.join('\n') + '</pre>';
  html += '<details><summary>층별 요약</summary><pre>' + P.요약(p).join('\n') + '</pre></details>';
  html += '<details><summary>글자 이력 (' + 층.이름 + ')</summary><pre>' + 층.이력.filter(x => x.이력.length).map(x => x.글자 + '\n' + x.이력.map(i => '  ' + i.조 + ' · ' + i.말).join('\n')).join('\n').replace(/</g, '&lt;') + '</pre></details>';
  out.insertAdjacentHTML('beforeend', html);
});
out.insertAdjacentHTML('afterbegin', '<p><b>' + 통과 + ' 통과 · ' + 실패 + ' 실패</b></p>');
</script></body></html>
