<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>정통사주 웹툰 시험</title>
<style>body{font-family:sans-serif;max-width:900px;margin:20px auto;padding:0 16px}h2{font-size:15px;margin:10px 0 4px}.ok{color:#2a7}.no{color:#c33}pre{background:#f4f4f4;padding:8px;font-size:12px;white-space:pre-wrap}</style></head>
<body><div id="out"></div>
<script src="config.js?v=1199"></script><script src="places.js?v=1199"></script><script src="astro.js?v=1199"></script><script src="lunar.js?v=1199"></script><script src="engine.js?v=1199"></script>
<script src="saenggeuk.js?v=1199"></script><script src="gise.js?v=1199"></script><script src="panjeong.js?v=1199"></script><script src="typecard.js?v=1199"></script><script src="gyeokguk.js?v=1199"></script><script src="classic.js?v=1199"></script><script src="samyeong.js?v=1199"></script><script src="ssom-gwanjeom.js?v=1199"></script><script src="jt-webtoon.js?v=1199"></script><script src="jt-webtoon-2.js?v=1199"></script><script src="jt-webtoon-check.js?v=1199"></script>
<script>
// 정통사주 웹툰 시험(09-26, 5단계) — 뼈대 동결 지문 · 빈칸 0 · 원고 검사기 · 명리 사실(사장님 명식).
const E = ChaeksaEngine, J = ChaeksaJtWebtoon, out = document.getElementById('out');
const 남 = E.calc({ year: 1992, month: 4, day: 21, hour: 0, minute: 20, gender: 'M', longitude: 126.98 });
const 지문 = (() => { let h = 0; const s = J.뼈대.map(x => x.번호 + ':' + x.묶음 + ':' + x.줄.map(l => l[0]).join(',')).join('|'); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h + ' ' + s.length; })();
let seed = 11; const rnd = (a, b) => { seed = (seed * 1103515245 + 12345) % 2147483648; return a + Math.floor(seed / 2147483648 * (b - a + 1)); };
const 금지 = /자리|잣대|표지|이레|공략|사주는|원국|지시 |자료 |성과 |실행 |동료 |섰다|띠었다|온전|흠 /;
const 사주말 = /(식신|상관|편인|정인|겁재|비견|편재|정재|편관|정관)(격|이|은|을)|십신|대운|세운|장생|목욕|관대|건록|제왕|천을|화개|역마/;
const 검사 = (R) => { const 걸 = []; J.조립(R, {}).forEach(h => h.줄.forEach(([k, 말]) => { if (/\{|\}|쓰고 있어요|undefined|  /.test(말)) 걸.push(h.번호 + ' 빈칸 ' + 말); if (k === '답' || k === '장면' || k === '나') { if (금지.test(말) && !(/회사 자리/.test(말) && (h.번호 === 3 || h.번호 === 4 || h.번호 === 6))) 걸.push(h.번호 + ' 금지 ' + 말); if (사주말.test(말)) 걸.push(h.번호 + ' 사주말 ' + 말); } })); return 걸; };
const 시험 = [
  ['뼈대 동결 v2.1 — 구조 지문(20회 · 줄 딱지 여섯 · 열 해 → 10년)', 지문, '3733569419 555'],
  ['갈림 — 격 회 2 · 3 · 4 · 5 · 7 · 11 · 15 · 20, 성패 회 6 · 20(docs/82, 09-26 2 · 5 · 7 추가)', J.격회.join(',') + '/' + J.성패회.join(','), '2,3,4,5,7,11,15,20/6,20'],
  ['조각 칸 — 격 80(회 2 · 3 · 4 · 5 · 7 · 11 · 15 · 20) · 성패 8 · 공통 14 · 단서틀 20', (() => { const G = ChaeksaJtJogak; return [Object.values(G.격).reduce((a, r) => a + Object.keys(r).length, 0), Object.values(G.성패).reduce((a, r) => a + Object.keys(r).length, 0), Object.keys(G.공통).length, Object.keys(G.단서틀).length].join(' '); })(), '80 8 14 20'],
  ['사장님 명식 丁卯 — 정관격 성격 · 상신 돈과 배움 · 2017 정인 파격 · 2027 회복', (() => { const s = J.사람(남); return [s.격, s.성패, s.상신말, s.바뀜[0] && s.바뀜[0].시작, s.바뀜[0] && s.바뀜[0].격, s.돌아옴 && s.돌아옴.시작].join(' '); })(), '정관 성격 돈과 배움 2017 정인 2027'],
  ['丁卯 20회 — 빈칸 · 금지 · 사주 말 0', 검사(남).length, 0],
  ['무작위 명식 200 × 20회 — 빈칸 · 깨진 변수 · 금지 · 답의 사주 말 0, 격 10 · 성패 4 모두 나옴', (() => { let 걸 = 0, err = 0; const seen = {}; for (let i = 0; i < 200; i++) { try { const R = E.calc({ year: rnd(1960, 2005), month: rnd(1, 12), day: rnd(1, 28), hour: rnd(0, 23), minute: 0, gender: i % 2 ? 'M' : 'F', longitude: 126.98 }); const s = J.사람(R); seen['격' + s.격] = 1; seen['성' + s.성패] = 1; 걸 += 검사(R).length; } catch (e) { err++; } } return 걸 + ' ' + err + ' ' + Object.keys(seen).length; })(), '0 0 14'],
  ['원고 검사기 — 무작위 명식 60: 비유 열쇠말 · 사주 말 · 판정키 · 금지 낱말 · 빈칸 0(09-26 사장님 「되묻지 않는 문장」)', (() => { let n = 0; for (let i = 0; i < 60; i++) { try { n += J.검사(E.calc({ year: rnd(1960, 2005), month: rnd(1, 12), day: rnd(1, 28), hour: rnd(0, 23), minute: 0, gender: i % 2 ? 'M' : 'F', longitude: 126.98 })).length; } catch (e) { n += 1000; } } return n; })(), 0],
  ['70세 넘는 해 없음 — 펴지는 해 · 바뀐 해 · 돌아오는 해', (() => { let n = 0; for (let i = 0; i < 100; i++) { const R = E.calc({ year: rnd(1960, 2005), month: rnd(1, 12), day: rnd(1, 28), hour: rnd(0, 23), minute: 0, gender: 'M', longitude: 126.98 }), s = J.사람(R), y = R.input.year; [s.펴짐, s.바뀜[0], s.돌아옴].forEach(d => { if (d && d.시작 - y > 70) n++; }); } return n; })(), 0],
  ['삽화 60장 이름 — 회 20 × 남녀 + 격 10 × 남녀(docs/84)', (() => { const 컷 = ['01-born', '02-push', '03-seat', '04-good-bad', '05-who', '06-steady', '07-shake', '08-power', '09-shadow', '10-money-in', '11-money-stay', '12-money-year', '13-heart', '14-in-love', '15-work', '16-alone-together', '17-work-year', '18-ten-years', '19-return', '20-where'], 격 = ['jeonggwan', 'pyeongwan', 'jeongjae', 'pyeonjae', 'jeongin', 'pyeonin', 'siksin', 'sanggwan', 'bigyeon', 'geopjae']; return 컷.length * 2 + 격.length * 2; })(), 60],
];
let 통과 = 0, 실패 = 0;
시험.forEach(([이름, 실제, 기대]) => { const ok = 실제 === 기대; ok ? 통과++ : 실패++; out.insertAdjacentHTML('beforeend', '<h2 class="' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ ' : '✗ ') + 이름 + '</h2>' + (ok ? '' : '<pre>실제: ' + String(실제).slice(0, 800) + '\n기대: ' + 기대 + '</pre>')); });
out.insertAdjacentHTML('afterbegin', '<p>' + 통과 + ' 통과 · ' + 실패 + ' 실패</p>');
</script></body></html>
