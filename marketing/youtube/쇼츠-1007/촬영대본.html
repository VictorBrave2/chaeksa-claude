const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=0,li=0;
function draw(){document.getElementById('tabs').innerHTML=S.map((s,i)=>'<button class="'+(i===cur?'on':'')+'" data-i="'+i+'">'+(i+1)+'편</button>').join('');
const s=S[cur];document.getElementById('box').innerHTML='<div class="c"><h2>'+esc(s.제목)+'</h2>'
+'<button class="btn" id="go">대본 크게 보기</button><button class="btn" data-copy="t">제목 복사</button>'
+'<div class="lab">첫 2초</div><div class="cap">'+esc(s.첫2초)+'</div>'
+'<div class="lab">대본 — 읽는 줄 / 화면 글자</div><ol>'+s.대본.map((l,i)=>'<li>'+esc(l)+(s.화면글자&&s.화면글자[i]?' <span class="cap">['+esc(s.화면글자[i])+']</span>':'')+'</li>').join('')+'</ol>'
+'<div class="lab">끝말</div><div>'+esc(s.끝말)+'</div>'
+'<div class="lab">설명란 <button class="btn" data-copy="d">설명란 복사</button></div><pre>'+esc(s.설명란)+'</pre>'
+'<div class="lab">숫자 출처</div><div style="font-size:13px;color:var(--ink2)">'+esc((s.출처||[]).join(' · '))+'</div></div>';}
function lines(){const s=S[cur];return s.대본.concat(s.끝말?[s.끝말]:[]);}
function show(){const L=lines();document.getElementById('ln').textContent=L[li]||'끝 — 닫기를 누르세요';document.getElementById('nx').textContent=L[li+1]||'';document.getElementById('cnt').textContent=(cur+1)+'편 · '+Math.min(li+1,L.length)+' / '+L.length;}
document.addEventListener('click',e=>{const t=e.target.closest('[data-i]');if(t){cur=+t.dataset.i;draw();return;}
if(e.target.id==='go'){li=0;document.getElementById('pr').style.display='flex';show();return;}
const c=e.target.closest('[data-copy]');if(c){const s=S[cur];const v=c.dataset.copy==='t'?s.제목:s.설명란;try{navigator.clipboard.writeText(v);c.textContent='복사됨';setTimeout(()=>draw(),1200);}catch(_){};return;}});
document.getElementById('x').addEventListener('click',e=>{e.stopPropagation();document.getElementById('pr').style.display='none';});
document.getElementById('pr').addEventListener('click',e=>{if(e.target.id==='x')return;const L=lines();if(e.clientX<window.innerWidth*0.2)li=Math.max(0,li-1);else li=Math.min(L.length,li+1);show();});
draw();
</script></body></html>
