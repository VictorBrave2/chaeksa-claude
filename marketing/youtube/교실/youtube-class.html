<title>책사 유튜브 교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&display=swap">
<style>
/* 한 줄 기둥: 휴대폰 한 손에 들고 따라 하는 교재 — 위에 고정된 갈래 줄, 레슨마다 누르면 체크되는 걸음. 사이트와 같은 낮(아침 한지) · 밤(새벽 인디고) */
:root{
  --bg:#f6f1e7; --paper:#fffdf8; --ink:#2a2320; --ink2:#5c5249; --ink3:#8c8177; --line:#e4dccd;
  --accent:#a32338; --accent-soft:#f5e3e3; --ok:#2f6b45; --ok-soft:#e2f0e6; --warn:#8a5a12; --warn-soft:#f6ecd9;
  --serif:"Noto Serif KR","Nanum Myeongjo",serif; --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141633; --paper:#1d2046; --ink:#ece8f5; --ink2:#bdb8d6; --ink3:#8d88ad; --line:#2e3263;
  --accent:#e6c98a; --accent-soft:#2c2b4a; --ok:#9fd8b0; --ok-soft:#1f3b33; --warn:#f0cf8f; --warn-soft:#3a3020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141633; --paper:#1d2046; --ink:#ece8f5; --ink2:#bdb8d6; --ink3:#8d88ad; --line:#2e3263;
  --accent:#e6c98a; --accent-soft:#2c2b4a; --ok:#9fd8b0; --ok-soft:#1f3b33; --warn:#f0cf8f; --warn-soft:#3a3020; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;padding-inline:16px;padding-block:12px 64px;margin:0}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0}
header.top{display:flex;gap:12px;align-items:center}
.seal{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:linear-gradient(145deg,#d8b35e,#a9802e);color:#2a1d08;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:24px}
header.top h1{font-size:24px;font-weight:900}
header.top p{margin:0;color:var(--ink2);font-size:14px}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:6px;flex-wrap:wrap}
nav.tabs button{flex:1 1 auto;min-width:0;font:inherit;font-size:14px;padding:9px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink2);cursor:pointer}
nav.tabs button[aria-selected="true"]{border-color:var(--accent);color:var(--ink);font-weight:700;background:var(--accent-soft)}
button:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:14px;color:var(--ink2);margin:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.route ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.route li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.route .n{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px}
.route a{color:var(--accent);font-weight:700;text-decoration:none}
.lesson{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lesson h2{font-size:19px;line-height:1.45}
.prog{font-size:13px;color:var(--ink3);font-variant-numeric:tabular-nums}
.prog.done{color:var(--ok);font-weight:700}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ol.steps li{min-width:0}
ol.steps label{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;padding:10px;border-radius:10px;cursor:pointer;border:1px solid transparent}
ol.steps label:hover{border-color:var(--line)}
ol.steps input{width:24px;height:24px;margin:2px 0 0;accent-color:var(--ok)}
ol.steps .k{font-size:12px;color:var(--ink3);display:block;font-variant-numeric:tabular-nums}
ol.steps input:checked + span{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--ink3)}
.box{border-radius:10px;padding:10px 12px;font-size:15px}
.box b{display:block;font-size:13px;margin-bottom:2px}
.check{background:var(--ok-soft)}.check b{color:var(--ok)}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700;font-size:15px;color:var(--ink2)}
details ul{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
details p{margin:8px 0 0;font-size:15px}
.src{font-size:12px;color:var(--ink3);word-break:break-all}
.src a{color:var(--ink3)}
.warn{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.warn b{color:var(--warn)}
.btn{font:inherit;font-weight:700;font-size:15px;padding:11px 18px;border-radius:999px;border:0;background:var(--accent);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink2);border:1.5px solid var(--line)}
textarea{width:100%;min-height:220px;font:inherit;font-size:16px;line-height:1.7;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row label{font-size:14px;color:var(--ink2)}
#pr{position:fixed;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));user-select:none;z-index:20}
#pr[hidden]{display:none}
#pr .line{font-weight:700;line-height:1.45;max-width:22ch}
#pr .next{color:#8c8c8c;margin-top:28px;max-width:30ch}
#pr .bar{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;color:#8c8c8c;font-size:14px}
#pr .bar button{font:inherit;color:#ddd;background:none;border:1px solid #555;border-radius:8px;padding:6px 12px;cursor:pointer}
footer{font-size:13px;color:var(--ink3);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="seal" aria-hidden="true">策</div>
    <div>
      <h1>책사 유튜브 교실</h1>
      <p>갤럭시로 찍고, 컴퓨터(브루)로 다듬고, 유튜브에 올리는 법 — 한 걸음씩</p>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="갈래">
    <button role="tab" id="t-first" data-tab="first" aria-selected="true">첫 한 바퀴</button>
    <button role="tab" id="t-shoot" data-tab="shoot" aria-selected="false">찍기</button>
    <button role="tab" id="t-edit" data-tab="edit" aria-selected="false">편집</button>
    <button role="tab" id="t-upload" data-tab="upload" aria-selected="false">올리기</button>
    <button role="tab" id="t-kit" data-tab="kit" aria-selected="false">장비</button>
    <button role="tab" id="t-prompt" data-tab="prompt" aria-selected="false">대본 크게 보기</button>
  </nav>

  <main id="main"></main>

  <footer>걸음을 누르면 체크가 남아요(이 휴대폰에만). 화면이 교재와 다르면 그 화면을 찍어 보내 주세요 — 그 걸음만 다시 풀어 드려요.</footer>
</div>

<div id="pr" hidden>
  <div class="bar"><span id="prCnt"></span><button type="button" id="prClose">닫기</button></div>
  <div class="line" id="prLine"></div>
  <div class="next" id="prNext"></div>
</div>

<script>
const D = {"shoot": [{"id": "s1", "title": "찍기 1 — 갤럭시 카메라를 쇼츠 찍기 좋게 맞춰 두기 (처음 한 번)", "why": "한 번 맞춰 두면 찍을 때마다 같은 화질, 같은 밝기로 나옵니다. 쇼츠는 세로 영상이고 길이는 3분까지입니다(유튜브 고객센터). 「FHD 30」을 고르는 까닭은 넷입니다. ① 쇼츠 완성본이 세로 1080×1920이고, 사람은 배경판 위에서 줄여서 얹습니다. 그래서 FHD(세로로 1080×1920)면 모자라지 않습니다. ② UHD는 파일이 훨씬 커서 옮기고 편집하기 무겁습니다. ③ 우리나라 전기는 60Hz입니다. 방 전등 아래에서 1초에 30장이나 60장으로 찍으면 화면이 깜빡이지 않습니다. 말하는 영상에는 30장이면 충분하고, 60장은 빠른 움직임을 찍을 때 씁니다. ④ 유튜브는 찍은 장 수 그대로 올리라고 합니다. 앞 카메라 대신 뒤 카메라를 쓰는 까닭은 둘입니다. 뒤 카메라가 더 선명하고(삼성전자서비스: 「고해상도의 후면 카메라」), 블루투스 핀마이크는 뒤 카메라의 「프로 동영상」에서만 받기 때문입니다(삼성 카메라 담당 답변). 뒤 카메라로 찍으면 휴대폰 화면이 반대쪽을 보고 있어 대본을 볼 수 없습니다. 이 문제는 찍기 4에서 노트북을 카메라 바로 아래 두는 방법으로 풉니다.", "steps": ["휴대폰의 「설정」(톱니바퀴 그림 앱)을 열고 「휴대전화 정보」를 누릅니다. 맨 위에 나오는 휴대폰 이름(예: 갤럭시 S24)을 종이에 적어 두세요. 기종마다 메뉴가 조금씩 다릅니다. 아래 순서와 화면이 다르면 이 이름을 메인에게 알려 주세요.", "휴대폰 뒷면의 동그란 카메라 유리를 닦습니다. 안경닦이 같은 보풀 없는 부드러운 천으로 동그라미를 그리며 닦으세요. 물이나 알코올을 휴대폰에 직접 뿌리지 마세요. 새 휴대폰이면 렌즈 위에 보호 비닐이 붙어 있지 않은지도 봅니다.", "「카메라」 앱을 엽니다. 화면 아래 글자 줄에서 「동영상」을 누릅니다.", "화면 위쪽 줄에서 비율 글자를 누르고 「9:16」을 고릅니다.", "위쪽 줄에서 「FHD」나 「UHD」 같은 화질 글자를 누릅니다. 「FHD」를 고르고, 숫자는 「30」을 고릅니다. 다 되면 화면에 「FHD 30」처럼 보입니다.", "화면에 손 모양 그림(「슈퍼 스테디」)이 색이 들어와 켜져 있으면 한 번 눌러 끕니다.", "화면 왼쪽 위의 톱니바퀴(카메라 설정)를 누릅니다.", "「동영상 손떨림 보정」을 끕니다. 삼각대에 고정해서 찍기 때문입니다. 손에 들고 찍을 때만 켭니다.", "「자동 FPS」를 끕니다. 목록에 바로 보이지 않으면 「고급 동영상 옵션」을 누르고 그 안에서 끕니다.", "「고급 동영상 옵션」(기종에 따라 「동영상 형식」) 안에 「HDR」이 들어간 줄이 켜져 있으면 끕니다.", "「수직/수평 안내선」(기종에 따라 「촬영 가이드」)을 켭니다. 화면에 격자 줄이 생겨 휴대폰이 기울었는지 보기 쉬워집니다.", "「촬영 방법」을 누르고 「음성 명령」을 켭니다. 이제 의자에 앉아 「동영상 촬영」이라고 말하면 녹화가 시작됩니다.", "뒤로 가기를 눌러 카메라 화면으로 돌아옵니다. 아래쪽 배율 숫자 가운데 「1×」(기본 렌즈)를 누릅니다. 0.6×는 쓰지 않습니다.", "얼굴을 예쁘게 보정하는 효과나 필터가 켜져 있으면 「없음」으로 돌립니다. 얼굴 보정은 머리 가장자리를 뭉개서 초록 빼기를 망칩니다(98 문서). 아래 줄에서 「인물 동영상」이 아니라 「동영상」인지도 다시 봅니다.", "휴대폰을 삼각대에 세로로 끼웁니다. 앞뒤 카메라 바꾸는 단추(빙글 도는 화살표)를 눌러 뒤 카메라로 둡니다.", "삼각대 높이를 맞춥니다. 의자에 앉았을 때 렌즈가 눈높이보다 살짝 위에 오게 합니다.", "의자에 앉아 휴대폰 화면을 봅니다. 가슴부터 머리 위 약간의 여유까지 화면에 들어오도록 삼각대를 앞뒤로 옮깁니다. 격자 줄을 보고 화면이 기울지 않았는지 확인합니다.", "화면 속 얼굴을 손가락으로 길게 누릅니다. 자물쇠가 달린 동그라미(「AF/AE 잠금」)가 나오면 초점과 밝기가 고정됩니다. 너무 밝거나 어두우면 동그라미 아래 막대를 왼쪽(어둡게)이나 오른쪽(밝게)으로 밉니다.", "바닥에 테이프를 붙여 삼각대 다리 자리와 의자 자리를 표시합니다. 다음에 찍을 때 같은 자리에 놓기 위해서입니다."], "check": "10초만 시험으로 찍고 「갤러리」에서 틀어 봅니다. 아래가 다 맞으면 끝입니다. ① 화면이 세로로 꽉 차 있다. ② 얼굴이 또렷하다. ③ 찍는 동안 밝기가 오르내리지 않는다. ④ 화면이 미세하게 출렁이지 않는다. ⑤ 격자 줄 기준으로 기울지 않았다. 다음에 찍을 때 카메라를 열면 위쪽 줄에 「9:16」과 「FHD 30」이 그대로 있어야 합니다.", "mistakes": ["렌즈에 지문이나 먼지가 묻은 채로 찍어 화면이 뿌옇게 나온다(삼성전자서비스: 렌즈에 이물질이 묻으면 사진이 뿌옇게 나올 수 있음).", "「슈퍼 스테디」(손 모양)를 켜 둔다. 렌즈가 0.6배로 바뀌고, 실내처럼 어두운 곳에서는 화질이 떨어지고, 형광등 아래에서는 줄무늬가 깜빡일 수 있다(삼성전자서비스).", "「자동 FPS」를 켜 둔다. 어두운 실내에서 휴대폰이 1초에 찍는 장 수를 스스로 줄여 영상이 뚝뚝 끊겨 보일 수 있다.", "얼굴을 길게 눌러 잠그지 않고 찍는다. 찍는 도중 몸이 움직이면 밝기와 초점이 따라 오르내린다.", "「인물 동영상」 모드로 찍는다. 배경을 흐리게 하는 기능이라 사람 가장자리가 부자연스러워지고, 손떨림 보정도 되지 않는다.", "「UHD 60」처럼 높게 맞춘다. 말하는 영상에서는 나아지는 것이 거의 없고 파일만 커져 옮기고 편집하기 무겁다."], "sources": ["https://support.google.com/youtube/answer/12779649?hl=ko", "https://support.google.com/youtube/answer/1722171?hl=ko", "https://r1.community.samsung.com/t5/samsung-members/%EA%B0%A4%EB%9F%AD%EC%8B%9C-%EC%88%8F%ED%8F%BC-%EC%B4%AC%EC%98%81-%EA%BF%80%ED%8C%81/m-p/39405188", "https://r1.community.samsung.com/t5/%EA%B0%A4%EB%9F%AD%EC%8B%9C-s/%ED%8C%81-%EA%B0%A4%EB%9F%AD%EC%8B%9C-s26-%EC%9A%B8%ED%8A%B8%EB%9D%BC-%EA%B3%A0%ED%99%94%EC%A7%88-%EC%82%AC%EC%A7%84-%EC%98%81%EC%83%81-%EC%84%A4%EC%A0%95-%EC%A0%95%EB%A6%AC/td-p/37062776", "https://r1.community.samsung.com/t5/%EA%B0%A4%EB%9F%AD%EC%8B%9C-s/%EA%B0%A4%EB%9F%AD%EC%8B%9C-%EC%82%AC%EC%A7%84-%EA%B0%80%EC%9D%B4%EB%93%9C-7-%EB%8F%99%EC%98%81%EC%83%81-%EC%B4%AC%EC%98%81-%EA%B8%B0%EB%B3%B8-%EC%84%B8%ED%8C%85%EB%B0%A9%EB%B2%95/td-p/36704954", "https://www.samsungsvc.co.kr/solution/1330910", "https://www.samsungsvc.co.kr/solution/617764", "https://www.samsungsvc.co.kr/online/diagnosisgoVw.do?domainId=NODE0000033866&node_Id=NODE0000152151&kb_Id=KNOW0000042384&pageNo=84", "https://www.samsungsvc.co.kr/solution/26264", "https://r1.community.samsung.com/t5/camcyclopedia/galaxy-camera-faq-%EC%82%AC%EC%A7%84-%EB%8F%99%EC%98%81%EC%83%81-%EC%9B%90%EA%B2%A9-%EC%B4%AC%EC%98%81-%EB%B0%A9%EB%B2%95/ba-p/23020830", "https://r1.community.samsung.com/t5/%EA%B0%A4%EB%9F%AD%EC%8B%9C-s/%EA%B0%A4%EB%9F%AD%EC%8B%9C-s10-5g-%EB%8F%99%EC%98%81%EC%83%81-%EB%85%B9%ED%99%94-%EC%9D%8C%EC%84%B1-%EC%98%A4%EB%A5%98/m-p/20480074", "https://www.etnews.com/20240516000342", "https://impact.smhs.gwu.edu/sites/g/files/zaskib836/files/2022-03/Video%20Selfies.pdf", "https://photojoseph.com/moment/advanced-light-flicker-video-education/20090", "https://news.samsungsemiconductor.com/kr/?p=7677"]}, {"id": "s2", "title": "찍기 2 — 얼굴 빛과 목소리 맞추기 (창문 빛 · 그림자 · 마이크 · 방 울림)", "why": "창문을 등지고 앉으면 휴대폰이 밝은 창문에 밝기를 맞추느라 얼굴이 어둡게 나옵니다(조지워싱턴대 안내). 초록 천과 사람을 함께 담으려면 휴대폰이 사람에게서 꽤 떨어져 있어야 합니다(찍기 3). 그러면 휴대폰 마이크는 입에서 멀어져 벽에 부딪혀 돌아오는 울림까지 함께 담습니다. 핀마이크는 가슴, 입에서 한 뼘(20~30cm) 거리에 있어 목소리가 가깝게 들어갑니다(RØDE). 다만 갤럭시 기본 카메라는 원래 휴대폰 안의 마이크로 녹음합니다. 블루투스 마이크는 뒤 카메라의 「프로 동영상」에서만 받습니다(삼성 카메라 담당 답변). 그래서 산 뒤에 핀마이크 소리가 정말 들어가는지 꼭 시험합니다.", "steps": ["찍을 방을 고릅니다. 조용하고, 이불 · 커튼 · 소파 · 깔개처럼 부드러운 것이 많은 방이 좋습니다. 빈 방이나 화장실처럼 딱딱한 방은 소리가 울립니다.", "의자를 놓을 때 창문을 등지지 않습니다. 창문이 얼굴 앞(휴대폰 뒤쪽)이나 얼굴 옆 비스듬히 오게 놓습니다.", "해가 창으로 바로 들이쳐 얼굴이 너무 밝거나 그림자가 진하면, 얇은 흰 커튼을 쳐서 빛을 부드럽게 합니다.", "휴대폰 화면에서 얼굴 한쪽이 많이 어두우면, 어두운 쪽 옆에 흰 종이판(하드보드지)을 세워 빛을 되비춥니다. 흰 종이판 대신 주광색(하얀빛) 전구를 끼운 스탠드를 놓아도 됩니다.", "조명을 이미 샀다면 커튼을 닫아 창문 빛을 막고 조명만 씁니다. 창문 빛은 시간과 날씨에 따라 바뀌어서 편마다 얼굴색이 달라지기 때문입니다(98 문서). 얼굴 조명은 얼굴 앞에서 비스듬히, 눈높이보다 조금 위에 둡니다.", "안경을 쓴다면 휴대폰 화면에서 안경알에 조명이 하얗게 비치는지 봅니다. 비치면 조명을 옆으로 조금 옮깁니다.", "선풍기 · 공기청정기처럼 소리 나는 물건을 끄고, 방문과 창문을 닫습니다.", "먼저 휴대폰 마이크로 시험합니다. 찍기 1에서 정한 자리에 앉아 「동영상 촬영」이라고 말하고, 대본 한 단락을 소리 내어 읽은 뒤 녹화를 멈춥니다.", "이어폰을 끼고 그 영상을 들어 봅니다. 목소리가 멀게 들리거나, 말끝에 「웅」 하는 울림이 길게 남거나, 통 속에서 말하는 것처럼 들리면 핀마이크가 필요합니다.", "울림이 남으면 바닥에 깔개나 두꺼운 이불을 깔고, 앞쪽과 옆쪽의 맨벽에 두꺼운 이불을 걸어 두고 다시 찍어 들어 봅니다.", "핀마이크는 무선입니다. 옷깃에 다는 작은 마이크(송신기)가, 갤럭시 충전 구멍(USB-C)에 꽂아 둔 손가락 마디만 한 수신기로 소리를 날려 보냅니다. 몸과 휴대폰 사이에 선이 없어 1~2m 떨어져 앉아도 됩니다. 매장에서 내 휴대폰에 수신기를 꽂고 아래 「문지르기 시험」을 해 본 뒤 삽니다.", "핀마이크를 가슴 옷깃에 집습니다. 입에서 한 뼘(20~30cm) 아래 자리입니다. 머리카락이나 다른 옷자락이 마이크에 스치지 않는지 봅니다.", "문지르기 시험: 카메라 「동영상」으로 10초 찍으면서 핀마이크를 손가락으로 살짝 문지릅니다. 들어 보아 문지르는 소리가 크게 들리면 핀마이크로 녹음된 것입니다.", "문지르는 소리가 작게 들리면 휴대폰 마이크로 녹음된 것입니다. 카메라 아래 줄에서 「더보기」를 누르고, 「프로 동영상」을 누르고, 마이크 그림을 누릅니다. 꽂는 수신기면 「USB」를, 블루투스 제품이면 블루투스 항목을 고른 뒤 13번을 다시 합니다."], "check": "같은 자리에서 30초를 찍어 이어폰으로 들었을 때 아래가 다 맞으면 끝입니다. ① 목소리가 가깝게 들린다. ② 말끝 울림이 짧다. ③ 선풍기 같은 「쉬─」 소리가 없다. ④ 화면에서 얼굴이 배경보다 어둡지 않다. ⑤ 얼굴 양쪽의 밝기 차이가 크지 않다. ⑥ 안경에 조명이 비치지 않는다. 핀마이크를 쓴다면 문지르기 시험에서 문지르는 소리가 또렷하게 크게 들려야 합니다.", "mistakes": ["창문을 등지고 앉는다. 휴대폰이 창문 밝기에 맞추느라 얼굴이 그늘진다(조지워싱턴대 · 버펄로대 안내).", "창문 빛과 노란 전구(전구색) 불빛을 섞어 쓴다. 얼굴색이 얼룩진다. 창문 빛과 섞을 때는 주광색(하얀빛) 전구를 쓴다.", "블루투스 이어폰이나 블루투스 핀마이크를 낀 채 일반 「동영상」으로 찍는다. 소리는 휴대폰 마이크로 녹음된다(삼성 카메라 담당 답변).", "핀마이크가 옷이나 머리카락에 스친다. 바스락 소리가 녹음에 그대로 남는다(RØDE).", "핀마이크를 너무 위(목 바로 밑)에 단다. 턱에 가려 소리가 먹먹해질 수 있다. 한 뼘 아래가 기준이다.", "시험 녹음을 휴대폰 스피커로만 듣는다. 울림과 잡음은 이어폰으로 들어야 잘 들린다."], "sources": ["https://impact.smhs.gwu.edu/sites/g/files/zaskib836/files/2022-03/Video%20Selfies.pdf", "https://careerdesignstudio.buffalo.edu/blog/2021/08/16/video-lighting-tips-and-tricks-for-your-next-at-home-shoot/", "https://smith.queensu.ca/request/social-post/resource-files/Recording-Yourself-with-a-Smartphone.pdf", "https://www.newcastle.edu.au/current-staff/teaching-and-research/teaching-resources/ldti/ldti-teaching-resources/resources/podcasting-tips-and-tech", "https://rode.com/en/about/news-info/how-to-use-a-lavalier-mic", "https://r1.community.samsung.com/t5/%EA%B0%A4%EB%9F%AD%EC%8B%9C-s/%EA%B0%A4%EB%9F%AD%EC%8B%9C-s10-5g-%EB%8F%99%EC%98%81%EC%83%81-%EB%85%B9%ED%99%94-%EC%9D%8C%EC%84%B1-%EC%98%A4%EB%A5%98/m-p/20480074", "https://www.samsung.com/us/support/answer/ANS00087562", "https://www.sammobile.com/news/how-to-capture-better-audio-with-samsung-mobile-camera-app/", "https://r1.community.samsung.com/t5/%EA%B0%A4%EB%9F%AD%EC%8B%9C-s/%EA%B0%A4%EB%9F%AD%EC%8B%9C-%EC%82%AC%EC%A7%84-%EA%B0%80%EC%9D%B4%EB%93%9C-7-%EB%8F%99%EC%98%81%EC%83%81-%EC%B4%AC%EC%98%81-%EA%B8%B0%EB%B3%B8-%EC%84%B8%ED%8C%85%EB%B0%A9%EB%B2%95/td-p/36704954", "https://www.ulanzi.com/blogs/knowledges/reduce-room-reverb-youtube-videos-without-panels"]}, {"id": "s3", "title": "찍기 3 — 초록 천(크로마키) 걸기 (주름 · 그림자 · 거리 · 옷 · 머리카락)", "why": "편집할 때는 초록 한 색을 골라 지웁니다. 그래서 천의 초록이 화면 어디서나 같은 밝기여야 깨끗하게 빠집니다(어도비: 천은 최대한 평평하고 매끈하게, 최대한 고르게 밝게). 주름과 그림자는 지운 뒤에 얼룩으로 남습니다. 초록이 든 옷은 그 부분이 같이 지워져 몸에 구멍이 납니다(조지아대: 초록이 조금이라도 든 것은 입지 말 것). 사람이 천에 바짝 붙으면 두 가지가 생깁니다. 천에 그림자가 지고, 천에서 튄 초록빛이 머리와 어깨 가장자리에 묻습니다. 그래서 천에서 떨어져 앉습니다(펜실베이니아주립대: 적어도 4~5피트, 약 1.2~1.5m, 멀수록 좋음).", "steps": ["천을 거치대에 겁니다. 위아래와 좌우를 당겨 팽팽하게 한 뒤 집게로 고정합니다. 접힌 자국이 남으면 하루 걸어 두거나 다시 당깁니다.", "천은 햇빛이 바로 닿지 않는 벽 쪽에 세웁니다. 창문 빛이 천의 한쪽만 밝게 비추면 얼룩이 됩니다.", "의자를 천에서 적어도 1.2~1.5m 앞에 놓습니다. 방이 허락하면 더 떨어져도 좋습니다.", "천을 비추는 조명 두 개를 천의 왼쪽 앞과 오른쪽 앞에 하나씩 두고, 천을 향해 비스듬히 비춥니다. 갓이나 확산판을 씌워 빛을 부드럽게 하고, 두 조명의 밝기와 빛 색을 똑같이 맞춥니다.", "얼굴 조명은 천 조명과 따로 둡니다(찍기 2).", "휴대폰 화면을 봅니다. 천의 위 · 아래 · 왼쪽 · 오른쪽이 비슷한 밝기인지, 하얗게 번쩍이는 곳이 없는지 봅니다. 고르지 않으면 조명의 각도와 거리를 조금씩 바꿉니다.", "의자에 앉아 화면을 봅니다. 머리나 어깨 뒤 천에 내 그림자가 보이면 의자를 천에서 더 멀리 옮깁니다.", "화면 속 내 뒤쪽이 위에서 아래 끝까지 전부 초록인지 봅니다. 천 가장자리나 거치대, 벽이 보이면 휴대폰 높이나 천 위치를 맞춥니다.", "옷을 고릅니다. 무늬 없는 무광 단색 한 벌을 「촬영 옷」으로 정합니다. 초록 · 연두 · 카키처럼 초록기가 있는 색, 반짝이는 천, 잔줄무늬와 체크무늬는 피합니다.", "반짝이는 귀걸이 · 목걸이 · 시계는 뺍니다. 천의 초록빛이 비쳐 같이 지워집니다.", "머리를 정리합니다. 잔머리와 뜬 머리카락을 빗어 붙입니다.", "화면 속 얼굴을 길게 눌러 「AF/AE 잠금」을 겁니다(찍기 1). 찍는 동안 천의 밝기가 바뀌지 않게 하기 위해서입니다.", "10초를 시험으로 찍습니다."], "check": "「갤러리」에서 시험 영상을 멈추고 두 손가락으로 벌려 크게 봅니다. 아래가 다 맞으면 끝입니다. ① 천에 진한 줄(주름), 얼룩, 내 그림자가 없다. ② 천 전체가 비슷한 초록이다. ③ 머리와 어깨 가장자리에 초록 테가 거의 없다. ④ 옷과 장신구에 초록이 비치지 않는다. 마지막으로 편집 앱의 「크로마 키」로 시험 영상의 초록을 빼 봅니다. 천이 한 번에 깨끗하게 빠지면 이 자리 그대로 바닥에 테이프로 표시합니다.", "mistakes": ["천 바로 앞에 앉는다. 천에 그림자가 지고 머리와 어깨 가장자리에 초록빛이 묻는다(펜실베이니아주립대 · 어도비).", "천 조명을 하나만 쓰거나 한쪽만 비춘다. 천 한쪽이 어두워져 그 부분이 깨끗하게 빠지지 않는다(펜실베이니아주립대: 조명 적어도 둘).", "천을 구겨진 채 건다. 주름이 그림자 줄로 남는다(어도비).", "카키처럼 초록기가 살짝 있는 옷을 입는다. 그 부분이 반쯤 비치게 지워진다(어도비).", "반짝이는 장신구나 반짝이는 옷을 입는다. 천의 초록빛이 비친다(조지아대).", "얼굴 보정 효과를 켠다. 머리 가장자리가 뭉개져 초록 빼기를 망친다(98 문서)."], "sources": ["https://www.adobe.com/creativecloud/video/discover/how-to-use-green-screen", "https://mediacommons.psu.edu/2017/04/27/11807", "https://ctl.uga.edu/wp-content/uploads/OBS-green-screen-studio-filming-advice2024.pdf", "https://www.elgato.com/us/en/explorer/products/green-screens/green-screen-quick-start-guide/", "https://www.adorama.com/WEPB130.html"]}, {"id": "s4", "title": "찍기 4 — 대본 보면서 한 편 찍기 (노트북을 카메라 아래에 / 휴대폰 하나로 · 한 문장씩)", "why": "대본을 외우지 않아도 됩니다. 글을 렌즈에 가깝게 둘수록 읽는 눈이 렌즈를 보는 것처럼 보이고, 글 줄을 좁게 할수록 눈이 좌우로 덜 움직입니다(teleprompter.com). 뒤 카메라로 찍으면 휴대폰 화면이 반대쪽을 보니, 대본은 노트북이나 태블릿에 크게 띄워 렌즈 바로 아래 둡니다. 이것을 권합니다. 휴대폰 하나로만 해야 할 때는 앞 카메라에, 갤럭시 「팝업 화면」으로 띄운 삼성 노트 대본을 씁니다. 이때는 블루투스 핀마이크가 녹음되지 않을 수 있습니다(블루투스 마이크는 뒤 카메라 「프로 동영상」에서만 받음). 틀리면 녹화를 끊지 말고 손뼉 한 번 치고 그 문장부터 다시 합니다(98 문서). 손뼉 소리와 쉼이 나중에 자를 자리가 됩니다. 캡컷에도 「텔레프롬프터」가 있습니다(캡컷 공식 도움말). 하지만 찍은 영상이 캡컷 안에서 만들어져 98 문서의 약관 걱정에 걸리므로 여기서는 쓰지 않습니다.", "steps": ["휴대폰 「설정」 → 「알림」 → 「방해 금지」를 켭니다. 찍는 동안 전화나 알림이 울리지 않습니다.", "[노트북으로 할 때 — 권함] 노트북에서 대본 파일을 「메모장」으로 엽니다.", "키보드의 Ctrl 키를 누른 채 마우스 휠을 위로 굴려 글자를 크게 합니다. 메모장 위쪽 「보기」 → 「확대/축소」에서도 할 수 있습니다.", "메모장 창의 오른쪽 가장자리를 마우스로 끌어 창을 좁게 만듭니다. 한 줄이 짧아야 눈이 좌우로 덜 움직입니다.", "쇼츠 대본(30초 안팎)은 한 화면에 전부 보이도록 글자 크기와 창 크기를 맞춥니다. 찍는 동안 노트북을 만지지 않기 위해서입니다.", "노트북을 휴대폰 삼각대 바로 아래(또는 바로 옆)에 두고, 대본 첫 줄이 렌즈 바로 밑에 오게 합니다. 태블릿을 써도 방법은 같습니다.", "의자에 앉아 대본을 읽어 봅니다. 눈을 찡그려야 보이면 3번으로 돌아가 더 키웁니다.", "녹화를 시작합니다. 의자에 앉아 「동영상 촬영」이라고 말합니다(찍기 1의 음성 명령). 음성 명령이 안 되면 녹화 단추를 누르고 자리에 앉습니다.", "두 박자 쉬고 시작합니다. 대본 한 문장을 눈으로 읽고, 고개를 들어 렌즈를 보고, 그 문장을 말하고, 한 박자 쉽니다. 문장마다 이렇게 되풀이합니다.", "틀리면 녹화를 멈추지 않습니다. 손뼉을 한 번 치고, 한 박자 쉬고, 그 문장 처음부터 다시 말합니다.", "마지막 문장 뒤에 두 박자 쉬고, 일어나서 휴대폰의 멈춤 단추를 누릅니다.", "[휴대폰 하나로 할 때] 「삼성 노트」에 대본을 적고 글자를 크게 해 둡니다.", "「카메라」 → 「동영상」에서 앞뒤 카메라 바꾸는 단추(빙글 도는 화살표)를 눌러 앞 카메라로 바꿉니다.", "화면 아래의 「최근 앱」 단추(세로줄 세 개 |||)를 누르고, 「삼성 노트」 그림을 누른 뒤 「팝업 화면으로 열기」를 고릅니다.", "팝업 창의 모서리를 끌어 작게 줄입니다. 창을 화면 맨 위, 앞 카메라 바로 아래로 옮깁니다. 이 창은 휴대폰 화면에만 보이고 영상에는 찍히지 않습니다.", "처음엔 10초만 찍어 봅니다. 「갤러리」에서 녹화가 끊기지 않았는지, 소리가 들어갔는지 확인한 뒤 8~11번대로 찍습니다."], "check": "시험 한 편을 끝까지 틀어 봅니다. 아래가 다 맞으면 끝입니다. ① 말하는 동안 눈이 렌즈 쪽을 보고 있다. ② 눈이 좌우나 아래로 크게 오가지 않는다. ③ 틀린 자리마다 손뼉 소리와 짧은 쉼이 있다. ④ 처음과 끝에 두 박자의 빈 시간이 있다. ⑤ 알림 소리가 끼어들지 않았다. ⑥ 핀마이크 소리가 들어갔다(찍기 2의 문지르기 시험 기준).", "mistakes": ["대본을 보면서 동시에 말한다. 눈이 아래로 향한 얼굴이 찍힌다. 「읽고 → 고개 들고 → 말하기」 순서를 지킨다(조지워싱턴대: 메모 말고 카메라를 볼 것).", "노트북 글이 렌즈에서 멀리 떨어져 있다. 영상 속 눈이 카메라 옆을 보는 것처럼 보인다(teleprompter.com).", "대본 줄이 길다. 눈이 좌우로 오가는 것이 영상에 보인다. 창을 좁게 한다.", "틀릴 때마다 녹화를 끊고 새로 찍는다. 파일이 여러 개로 쪼개져 고르기 어렵다. 끊지 말고 손뼉을 친다.", "앞 카메라로 찍으면서 블루투스 핀마이크를 믿는다. 소리는 휴대폰 마이크로 녹음된다(삼성 카메라 담당 답변: 블루투스는 뒤 카메라 「프로 동영상」에서만).", "「방해 금지」를 켜지 않는다. 찍는 중에 전화가 와서 녹화가 멈추거나 알림 소리가 들어간다."], "sources": ["https://www.teleprompter.com/blog/how-to-use-a-teleprompter-for-a-video-podcast", "https://impact.smhs.gwu.edu/sites/g/files/zaskib836/files/2022-03/Video%20Selfies.pdf", "https://www.samsungsvc.co.kr/solution/40676", "https://r1.community.samsung.com/t5/%EA%B0%A4%EB%9F%AD%EC%8B%9C-s/%ED%8C%81-%EC%B5%9C%EA%B7%BC%EC%95%B1-%EB%B6%84%ED%95%A0-%ED%99%94%EB%A9%B4-%EB%B0%8F-%EB%A9%80%ED%8B%B0%EC%9C%88%EB%8F%84%EC%9A%B0/td-p/32163976", "https://r1.community.samsung.com/t5/%EA%B0%A4%EB%9F%AD%EC%8B%9C-s/tip-%ED%8C%9D%EC%97%85-%ED%99%94%EB%A9%B4-%EC%82%AC%EC%9A%A9%ED%95%B4%EB%B3%B4%EA%B8%B0/td-p/5918388", "https://r1.community.samsung.com/t5/%EC%84%9C%EB%B9%84%EC%8A%A4-%EA%B8%B0%ED%83%80/%ED%8C%9D%EC%97%85%EC%B0%BD-%ED%88%AC%EB%AA%85%EB%8F%84-%EC%84%A4%EC%A0%95-%EB%AA%BB%ED%95%9C%EB%8B%A4%EA%B8%B8%EB%9E%98-one-ui-7%EC%9D%84-%EC%95%88%EA%B9%94%EA%B3%A0-%EC%9E%88%EC%8A%B5%EB%8B%88%EB%8B%A4/td-p/34449977", "https://www.capcut.com/ko-kr/help/use-front-camera-in-teleprompter", "https://www.majorgeeks.com/content/page/how_to_change_zoom_in_or_out_of_text_in_notepad.html", "https://r1.community.samsung.com/t5/camcyclopedia/galaxy-camera-faq-%EC%82%AC%EC%A7%84-%EB%8F%99%EC%98%81%EC%83%81-%EC%9B%90%EA%B2%A9-%EC%B4%AC%EC%98%81-%EB%B0%A9%EB%B2%95/ba-p/23020830", "https://r1.community.samsung.com/t5/%EA%B0%A4%EB%9F%AD%EC%8B%9C-s/%EA%B0%A4%EB%9F%AD%EC%8B%9C-s10-5g-%EB%8F%99%EC%98%81%EC%83%81-%EB%85%B9%ED%99%94-%EC%9D%8C%EC%84%B1-%EC%98%A4%EB%A5%98/m-p/20480074"]}], "edit": [{"id": "e1", "title": "편집 1 — 브루(Vrew)를 컴퓨터에 깔고 라이트로 결제하기 (처음 한 번)", "why": "브루는 찍은 말을 글자로 받아 줘서, 문서 고치듯 틀린 문장 글자를 지우면 영상도 같이 잘려요. 한국 회사(보이저엑스) 프로그램이라 도움말이 한국어고 전화(02-6250-5366)도 돼요. 무료판은 영상에 브루 마크가 남아서, 마크를 지우려면 「라이트」(월 14,900원 · 1년에 143,000원 한 번에 내면 달마다 약 11,900원)가 필요해요. 이 컴퓨터는 브루가 권하는 사양보다 훨씬 좋아서 무겁지 않게 돌아가요.", "steps": ["컴퓨터에서 인터넷 창을 열고 주소 칸에 vrew.ai 를 칩니다.", "화면의 「다운로드」(윈도우용)를 눌러 설치 파일을 받고, 받은 파일을 두 번 눌러 설치합니다.", "바탕화면에 생긴 브루를 엽니다. 처음 화면에서 회원가입(구글 계정으로 해도 됩니다)을 합니다.", "브루 화면 오른쪽 위의 요금제(또는 「업그레이드」)를 누르고 「라이트」를 고릅니다. 1년에 한 번 내는 것이 달마다 내는 것보다 쌉니다.", "결제는 사장님이 직접 카드로 합니다. (메인은 카드 번호를 넣지 않아요.)", "결제가 끝나면 브루를 껐다가 다시 켭니다. 오른쪽 위에 「라이트」가 보이면 됩니다."], "check": "브루를 켰을 때 오른쪽 위에 내 이름과 「라이트」가 보여요.", "mistakes": ["무료판으로 한 편을 다 만든 뒤 내보내 보니 브루 마크가 박혀 있다 — 라이트 결제를 먼저 하세요.", "설치 파일을 받기만 하고 두 번 누르지 않아 설치가 안 된 채로 찾는다."], "sources": ["https://vrew.ai/ko/", "https://docs.channel.io/vrew-kr/ko/articles/공지-2025년-11월-말-브루-요금이-인상됩니다-1126-반영-완료-22808225"]}, {"id": "e2", "title": "편집 2 — 휴대폰 영상을 QR로 가져오고 자막 받기(대본 붙여넣기)", "why": "휴대폰 영상을 케이블 없이 원본 그대로 컴퓨터로 옮기는 가장 쉬운 길이 브루의 QR 가져오기예요. 사장님이 대본을 직접 쓰시니 「원고」를 함께 넣으면 자막 글자가 대본 그대로 맞춰져서 고칠 일이 거의 없어요.", "steps": ["브루에서 「새로 만들기」를 누릅니다.", "「모바일에서 비디오 · 오디오 불러오기」를 누르면 화면에 QR 그림이 나옵니다.", "갤럭시 카메라로 그 QR을 비추고, 뜨는 주소를 누릅니다. 휴대폰 화면에서 오늘 찍은 영상을 고르고 보냅니다.", "컴퓨터 브루에 영상이 들어오면, 말하는 언어를 「한국어」로 고릅니다.", "원고(대본)를 넣는 칸이 나오면 사장님이 쓴 대본을 붙여 넣습니다. (대본 파일에서 전체 선택 Ctrl+A → 복사 Ctrl+C → 브루 칸에 붙여넣기 Ctrl+V)", "「확인」을 누르면 브루가 말을 글자로 받습니다. 1분 영상이면 잠깐이면 끝나요.", "화면에 자막 글자 줄들이 생기고, 줄을 누르면 그 부분 영상이 나옵니다."], "check": "화면 아래(또는 가운데)에 대본과 같은 자막 줄이 쭉 생기고, 줄을 누르면 그 말이 나와요.", "mistakes": ["언어를 한국어로 안 고르고 넘어가 자막이 엉뚱하게 나온다.", "휴대폰과 컴퓨터가 서로 다른 와이파이일 때 QR 보내기가 느리거나 안 될 수 있다 — 같은 집 와이파이에 붙여 두세요(확인 못 한 부분: 막히면 화면을 찍어 보내 주세요)."], "sources": ["https://vrew.ai/ko/feature/smartphone-file-transfer", "https://vrew.ai/ko/feature/ai-video-subtitle"]}, {"id": "e3", "title": "편집 3 — 쉰 곳은 버튼 하나로, 틀린 문장은 글자를 지워서 자르기", "why": "찍을 때 틀리면 손뼉을 한 번 치고 그 문장을 처음부터 다시 말해 두세요. 그러면 편집에서는 틀린 쪽 글자 줄만 지우면 끝나요. 말 사이 쉰 곳은 「무음 구간 줄이기」가 한 번에 줄여 줘요.", "steps": ["위쪽 메뉴의 「편집」(또는 「홈」)에서 「무음 구간 줄이기」를 누릅니다.", "줄일 길이를 묻는 창이 나오면 처음 그대로 두고 「확인」을 누릅니다. (쉰 곳이 한꺼번에 짧아져요)", "이제 자막 줄을 위에서부터 읽어 내려갑니다. 틀리게 말한 줄(손뼉 친 앞 문장)을 찾습니다.", "그 줄의 글자를 마우스로 끌어 고르고 자판의 Delete(지우기) 키를 누릅니다. 그 부분 영상이 같이 잘려요.", "처음부터 끝까지 한 번 재생해서 말이 자연스럽게 이어지는지 봅니다. 잘못 지웠으면 Ctrl+Z 로 되돌립니다."], "check": "처음부터 틀어 보면 쉰 곳 없이 말이 이어지고, 틀린 문장이 하나도 안 남아요.", "mistakes": ["무음 줄이기를 너무 세게 해서 숨 쉴 틈도 없이 말이 붙는다 — 처음 값 그대로 두세요.", "틀린 문장을 지우다 옆 줄까지 같이 지운다 — 바로 Ctrl+Z."], "sources": ["https://vrew.ai/ko/feature/text-based-video-editing", "https://vrew.ai/ko/feature/auto-silence-removal"]}, {"id": "e4", "title": "편집 4 — 세로 9:16 맞추고, 자막 꼴 정하고, 내보내기", "why": "쇼츠는 세로 화면이에요. 한 번 자막 꼴(글꼴 · 크기 · 위치)을 정해 두면 다음부터는 같은 꼴로 나와서 채널이 한 사람 것처럼 보여요. 자막 글자에 초록색은 쓰지 마세요 — 다음 단계(초록 빼기)에서 같이 빠져요.", "steps": ["위쪽 메뉴 「파일」 → 「화면 비율」에서 「9:16」(유튜브 쇼츠)을 고릅니다.", "자막 줄 하나를 누르고, 오른쪽 서식 칸에서 글꼴 · 크기 · 색(흰 글자에 검은 테두리 권함)을 정합니다. 「전체 자막에 적용」이 있으면 누릅니다.", "자막 위치는 「중하단」쯤으로 둡니다(얼굴을 가리지 않게).", "오른쪽 위 「내보내기」를 누르고 「영상 파일(mp4)」을 고릅니다.", "해상도는 1080p, 저장할 곳은 「바탕화면」으로 정하고 「내보내기」를 누릅니다."], "check": "바탕화면에 mp4 파일이 생기고, 두 번 눌러 틀면 세로 화면에 자막이 대본대로 나와요(브루 마크 없음).", "mistakes": ["9:16을 안 고르고 가로로 내보낸다 — 유튜브가 쇼츠로 안 받아요.", "자막을 초록으로 해서 다음 단계에서 글자가 사라진다."], "sources": ["https://vrew.ai/ko/feature/subtitle-editing", "https://vrew.ai/ko/feature/video-aspect-ratio-conversion"]}, {"id": "e5", "title": "편집 5 — 클립챔프로 초록 빼고 배경판 깔기 (이미 깔려 있음, 무료)", "why": "브루에는 초록 빼기가 없어서, 이 한 단계만 윈도우에 이미 들어 있는 클립챔프(무료)로 해요. 배경판 그림을 아래에, 사람 영상을 위에 놓고 「녹색 화면」 효과를 켜면 초록이 빠지고 배경판이 보여요. 1080p로 워터마크 없이 내보내는 것도 무료예요.", "steps": ["컴퓨터 왼쪽 아래 시작 단추를 누르고 「Clipchamp」를 쳐서 엽니다(이미 깔려 있어요). 처음이면 마이크로소프트 계정으로 들어갑니다.", "「새 비디오 만들기」를 누르고, 화면 비율을 「9:16」으로 바꿉니다.", "「미디어 가져오기」로 두 파일을 넣습니다: 편집 4에서 내보낸 영상, 그리고 배경판 그림.", "배경판 그림을 아래쪽 줄(타임라인)에 먼저 끌어 놓고, 그 위 줄에 사람 영상을 끌어 놓습니다. 배경판 그림 길이를 영상 길이만큼 늘립니다.", "사람 영상을 누르고, 오른쪽 「효과」 탭에서 「녹색 화면」을 켭니다.", "초록이 덜 빠지면 「임계값」 막대를 조금씩 오른쪽으로 밉니다. 머리카락 가장자리가 지저분하면 반대로 조금 왼쪽으로.", "오른쪽 위 「내보내기」 → 「1080p」를 고르고 저장합니다."], "check": "틀어 보면 초록이 하나도 안 보이고 사람 뒤에 배경판이 깔려 있어요. 자막도 그대로 보여요.", "mistakes": ["사람 영상을 아래, 배경판을 위에 놓아서 배경판만 보인다 — 줄 순서를 바꾸세요.", "초록 천에 그림자 · 주름이 있어서 얼룩덜룩 남는다 — 찍기 3(천 걸기)으로 돌아가 빛을 고르게."], "sources": ["https://support.microsoft.com/en-us/Clipchamp/how-to-use-the-green-screen-effect-in-clipchamp", "https://clipchamp.com/ko/video-editor-no-watermark/"]}], "upload": [{"id": "u0", "title": "올리기 0 — 컴퓨터에서 바로 올리기 (편집을 컴퓨터로 하니 이게 가장 짧은 길)", "why": "편집을 컴퓨터에서 끝냈으니 파일을 휴대폰으로 다시 보낼 필요 없이 컴퓨터에서 바로 올려요. 세로이고 3분 이하면 유튜브가 알아서 쇼츠로 받아요. 처음 시험은 주소를 아는 사람만 보는 「일부 공개」로 올려요.", "steps": ["인터넷 창 주소 칸에 studio.youtube.com 을 치고, 채널 「책사」 계정으로 들어갑니다.", "오른쪽 위 「만들기」를 누르고 「동영상 업로드」를 누릅니다.", "「파일 선택」을 눌러 바탕화면의 완성 영상을 고릅니다.", "제목 칸에 제목(물음 꼴)을, 설명 칸에 설명을 붙여 넣습니다.", "아래로 내려 「아니요, 아동용이 아닙니다」를 고르고 「다음」을 세 번 누릅니다.", "「공개 상태」에서 「일부 공개」를 고르고 「저장」을 누릅니다.", "나오는 영상 주소를 복사해 두면 휴대폰에서 열어 볼 수 있어요."], "check": "유튜브 스튜디오 「콘텐츠」 목록에 영상이 「일부 공개」로 보이고, 주소를 휴대폰에서 열면 쇼츠 화면으로 재생돼요.", "mistakes": ["가로 영상이나 3분 넘는 영상을 올려 쇼츠가 아닌 일반 영상이 된다.", "처음부터 「공개」로 올렸다가 실수가 보인다 — 처음 몇 편은 「일부 공개」로 보고 고친 뒤 공개로 바꾸세요."], "sources": ["https://support.google.com/youtube/answer/57407?hl=ko", "https://support.google.com/youtube/answer/15424877?hl=ko"]}, {"id": "u1", "title": "휴대폰으로 쇼츠 한 편 올리기 — 첫 시험은 「일부 공개」로", "why": "찍고 편집한 영상을 채널에 올리는 마지막 칸입니다. 첫 편은 「일부 공개」로 올립니다. 주소를 아는 사람만 볼 수 있어서, 쇼츠로 제대로 들어갔는지와 커버(썸네일)가 어떻게 보이는지를 남들보다 먼저 볼 수 있습니다. 쇼츠로 들어가는 조건은 두 가지입니다. 화면이 세로이거나 정사각형일 것, 그리고 길이가 3분 이하일 것(2024년 10월 15일부터 상한 3분, 유튜브 공식 도움말). 우리 쇼츠는 30초 안팎이라 세로로만 내보내면 됩니다.", "steps": ["준비: 캡컷에서 세로로 내보낸 영상이 휴대폰 「갤러리」에 있는지 확인합니다. 길이가 3분을 넘으면 안 됩니다.", "휴대폰에서 빨간 「YouTube」 앱을 엽니다. 오른쪽 아래 동그란 프로필 사진을 눌러, 맨 위 이름이 「책사」인지 확인합니다. 다른 이름이면 그 이름을 눌러 책사 계정으로 바꿉니다.", "화면 맨 아래 가운데 「＋」(만들기)를 누릅니다.", "「동영상 업로드」를 누릅니다. 사진·동영상에 접근해도 되냐고 묻는 창이 처음 한 번 뜨면 「허용」을 누릅니다.", "목록에서 방금 내보낸 영상(보통 맨 앞)을 누릅니다.", "편집 화면(글자·필터·음악)이 나오면 아무것도 넣지 말고 「다음」을 누릅니다. 음악은 넣지 않습니다(저작권 규칙, docs/98 7절).", "「세부정보 추가」 화면이 나옵니다. 「제목」 칸을 누르고 그 편의 질문 제목을 붙여넣습니다. 글 칸을 길게 누르면 「붙여넣기」가 나옵니다. 제목은 100자(영문 기준)까지 들어갑니다.", "커버 고르기: 같은 화면 위쪽 영상 작은 그림에 있는 연필(「수정」)을 누릅니다. 아래 줄을 손가락으로 밀어서 얼굴과 판 글자가 둘 다 잘 보이는 장면에 멈추고 「완료」를 누릅니다.", "「공개 범위」를 누르고 「일부 공개」를 고른 뒤 뒤로 갑니다. 「공개」는 누구나, 「일부 공개」는 링크를 가진 사람만, 「비공개」는 나와 내가 고른 사람만 볼 수 있습니다.", "「시청자층 선택」을 누르고 「아니요, 아동용이 아닙니다」를 고른 뒤 뒤로 갑니다.", "「업로드」를 누릅니다. 다 올라갈 때까지 앱을 닫지 말고 와이파이에 연결된 채로 둡니다.", "설명 넣기: 프로필 사진 → 「내 동영상」 → 방금 올린 쇼츠 옆 점 세 개(「더보기」) → 「수정」을 누릅니다. 「설명」 칸에 그 편 설명 글(docs/98 쇼츠 설명란 틀)을 붙여넣고 「저장」을 누릅니다.", "시험 보기: 같은 「더보기」에서 「공유」 → 「링크 복사」를 누르고, 카카오톡 「나와의 채팅」에 붙여넣은 뒤 눌러서 열어 봅니다. 세로 전체 화면으로 열리고, 커버와 제목이 맞으면 시험은 끝입니다.", "실제 편부터는 9번 단계에서 「공개」를 고릅니다. 시험 영상도 공개하려면: 「더보기」 → 「수정」 → 「공개 상태」 → 「공개」 → 「저장」."], "check": "프로필 사진 → 「내 동영상」에 들어가 Shorts 쪽에 그 영상이 있으면 됩니다. 복사한 링크로 열었을 때 쇼츠처럼 세로 전체 화면으로 나와야 합니다. 「공개 범위」 글자가 「일부 공개」로 되어 있는지도 봅니다.", "mistakes": ["캡컷에서 가로(16:9)로 내보내 일반 동영상으로 올라갑니다. 내보내기 전에 화면 비율이 9:16인지 봅니다.", "「비공개」와 「일부 공개」를 헷갈립니다. 비공개는 링크를 보내도 남이 못 봅니다.", "「예, 아동용입니다」를 잘못 누릅니다. 「더보기」 → 「수정」 → 「시청자층」에서 다시 바꿀 수 있습니다.", "유튜브 보관함 음악을 넣습니다. 보관함 오디오를 쓰면 15초로 잘리고, docs/98은 음악을 넣지 않기로 했습니다.", "개인 구글 계정으로 올립니다. 2번 단계에서 「책사」 이름을 꼭 확인합니다.", "업로드 중에 앱을 닫거나 모바일 데이터가 끊깁니다."], "sources": ["https://support.google.com/youtube/answer/12779649?hl=ko", "https://support.google.com/youtube/answer/15424877?hl=ko", "https://support.google.com/youtube/answer/57407?hl=ko", "https://support.google.com/youtube/answer/157177?hl=ko", "https://support.google.com/youtube/answer/10343433?hl=ko", "https://support.google.com/youtube/answer/72431?hl=ko", "https://support.google.com/youtube/answer/57404?hl=ko", "https://support.google.com/youtube/answer/9527654?hl=ko"]}, {"id": "u2", "title": "채널 꾸미기 첫날 — 프로필 사진 · 배너 · 채널 설명 · 링크", "why": "채널 이름을 눌러 들어온 사람이 처음 보는 곳입니다. 쇼츠 설명란의 주소는 눌리지 않습니다. 그래서 채널 머리의 첫 링크가 쇼츠에서 사이트로 가는 몇 안 되는 길입니다(docs/98 다리 그림). 휴대폰에서 어디서 무엇이 되는지 공식 도움말 기준은 이렇습니다. 프로필 사진·배너·설명은 「YouTube」 앱에서 됩니다. 링크는 「YouTube Studio」 앱(또는 컴퓨터)에서만 됩니다.", "steps": ["준비: 프로필 사진(정사각형), 배너 그림, 채널 설명 글, 링크 넷(docs/98의 이름·주소)을 메인에게 받아 둡니다. 컴퓨터 카카오톡 「나와의 채팅」으로 받아서, 휴대폰 카카오톡에서 그림을 눌러 저장하면 휴대폰 「갤러리」에 들어갑니다.", "「Play 스토어」 앱을 열고 위 검색 칸에 「YouTube Studio」를 쳐서, 구글이 만든 앱의 「설치」를 누릅니다. 다 깔리면 「열기」를 누르고 위에 「책사」 채널이 보이는지 확인합니다.", "프로필 사진: 「YouTube」 앱 → 오른쪽 아래 프로필 사진 → 「내 채널」(화면에 따라 「채널 보기」) → 「수정」(연필)을 누릅니다. 동그란 프로필 사진을 누르고 갤러리에서 받아 둔 그림을 고른 뒤 「저장」을 누릅니다.", "배너: 같은 「수정」 화면에서 오른쪽 위 넓은 배너 그림을 누르고, 받아 둔 배너를 고른 뒤 「저장」을 누릅니다.", "채널 설명: 「YouTube」 앱 → 프로필 사진 → 「채널 보기」 → 설명 아래 「수정」을 누릅니다. 설명 칸을 길게 눌러 「붙여넣기」로 채널 설명 글(docs/98 「채널 설명(붙여넣기)」)을 넣고 「저장」을 누릅니다. 설명 첫 줄은 채널의 정체 한 줄 그대로: 「다른 사람이 진리를 깨달을 수 있게 해 주는 유튜버」(10-08 사장님 말).", "링크: 「YouTube Studio」 앱을 엽니다. 오른쪽 위 프로필 사진을 누르고, 채널 설명 옆 「수정」을 누릅니다.", "「링크」 아래 「수정」을 누릅니다.", "「추가」를 누르고 첫 링크의 제목(「이달 출산택일 표(무료)」)과 주소를 붙여넣은 뒤 「완료」를 누릅니다. 첫 링크만 구독 버튼 위에 크게 보이니, 가장 데려가고 싶은 곳을 맨 처음에 넣습니다.", "같은 방법으로 나머지 셋(그날 시각 전부 · 보고서 신청 · 네이버폼으로 신청)을 차례로 「추가」 → 「완료」합니다.", "「저장」을 누릅니다.", "확인: 「YouTube」 앱 → 프로필 사진 → 「채널 보기」를 누르고 사진·배너·설명·첫 링크가 보이는지 봅니다. 첫 링크를 눌러 사이트가 열리는지도 봅니다."], "check": "「채널 보기」 화면에 새 프로필 사진과 배너가 보이고, 설명 첫 줄(「다른 사람이 진리를 깨달을 수 있게 해 주는 유튜버」)과 첫 링크(이달 출산택일 표)가 구독 버튼 위에 보이면 됩니다. 링크를 누르면 chaeksa.kr 화면이 열려야 합니다.", "mistakes": ["배너 가장자리에 글자를 둡니다. 휴대폰에서는 배너 가운데 일부만 보입니다. 글자와 로고는 2048×1152 그림 기준 가운데 1235×338 안에 둡니다(권장 크기 2560×1440, 6MB 이하).", "프로필 사진에 움직이는 GIF를 씁니다. JPG·PNG·GIF(움직이지 않는 것)·BMP, 15MB 이하만 됩니다.", "링크 순서를 거꾸로 넣어 네이버폼이 첫 자리에 갑니다.", "핸들(@chaeksa2026)이나 채널 이름을 건드립니다. 둘 다 14일에 두 번까지만 바꿀 수 있으니 그대로 둡니다.", "설명에 손님 이야기나 상담 사례를 넣습니다(docs/98 7절 금지)."], "sources": ["https://support.google.com/youtube/answer/10456525?hl=ko", "https://support.google.com/youtube/answer/2657964?hl=ko"]}, {"id": "u3", "title": "기능 인증 — 전화(중급)와 얼굴 영상 또는 신분증(고급)", "why": "인증을 해야 열리는 기능이 있습니다. 중급(전화 인증)은 15분 넘는 영상, 사진으로 넣는 맞춤 썸네일(쇼츠 맞춤 썸네일 포함, 컴퓨터에서), 컴퓨터 라이브, 팟캐스트를 엽니다. 고급(얼굴 영상 또는 신분증, 아니면 채널 기록)은 이것들을 엽니다: 쇼츠에 「관련 동영상」 붙이기, 긴 영상 설명란·게시물의 눌리는 링크, 댓글 고정, 채널 세부정보의 눌리는 링크, 챕터, 수익 창출 신청. 지금 공식 기준 링크 규칙: 쇼츠 설명란과 쇼츠 댓글의 주소는 고급 기능이 있어도 눌리지 않습니다. 쇼츠에서 눌리는 것은 관련 동영상 링크, 멘션·해시태그, 그린 스크린·리믹스 표시뿐입니다. 쇼츠 → 긴 영상 → 사이트로 가는 다리(관련 동영상)를 놓으려면 고급 인증이 꼭 필요합니다.", "steps": ["컴퓨터에서 크롬을 열고 주소창에 studio.youtube.com 을 친 뒤 엔터를 누릅니다. 오른쪽 위 동그라미를 눌러 「책사」 채널인지 확인합니다.", "왼쪽 맨 아래 톱니바퀴 「설정」 → 뜬 창 왼쪽 「채널」 → 위쪽 「기능 사용 자격 요건」을 누릅니다.", "「중급 기능」 줄을 눌러 펼치고 「전화번호 인증」을 누릅니다.", "나라가 대한민국인지 보고, 휴대폰 번호를 넣고, 인증 코드를 문자 메시지로 받기를 고릅니다. 휴대폰 문자로 온 숫자를 그대로 넣고 확인 단추를 누릅니다.", "같은 화면에서 「고급 기능」 줄을 펼치고 「기능 액세스」를 누릅니다.", "둘 중 하나를 고릅니다. 「영상 인증 사용」(얼굴을 몇 초 찍기) 또는 「신분증 사용」(여권 또는 운전면허증)입니다. 고른 뒤 「다음」 → 「이메일 받기」를 누릅니다.", "휴대폰 「Gmail」 앱을 엽니다. 책사 채널 구글 계정으로 온 YouTube 메일을 열고 「인증 시작」을 누릅니다.", "얼굴 영상일 때: 와이파이에 연결합니다. 밝지만 눈부시지 않은 곳에서 휴대폰을 눈높이로 들고, 화면에 나 혼자 나오게 합니다. 화면 안내대로 점을 눈으로 따라가거나 고개를 돌립니다. 끝나면 제출합니다.", "신분증일 때: 「동의」를 누르고 화면 안내대로 신분증을 찍은 뒤 「제출」을 누릅니다. 신분증 생년월일이 구글 계정 생년월일과 같아야 합니다.", "하루(보통 24시간) 뒤 컴퓨터에서 2번 단계 화면을 다시 열고 「고급 기능」 줄이 켜졌는지 봅니다.", "켜졌으면 다리를 놓습니다: 컴퓨터 YouTube 스튜디오 → 왼쪽 「콘텐츠」 → 쇼츠를 누름 → 「관련 동영상」에서 내 긴 영상을 고름 → 「저장」."], "check": "「기능 사용 자격 요건」 화면에서 중급·고급 기능 줄이 둘 다 사용 가능 상태로 바뀌면 됩니다. 쇼츠 수정 화면에서 「관련 동영상」을 고를 수 있고, 휴대폰에서 그 쇼츠를 열었을 때 아래에 긴 영상으로 가는 줄이 보이면 다리가 놓인 것입니다.", "mistakes": ["쇼츠 설명란에 주소를 적어 두고 눌릴 거라고 믿습니다. 고급 기능이 있어도 쇼츠 설명란·댓글 주소는 안 눌립니다.", "「관련 동영상」에 예약해 둔 영상이나 비공개 영상을 고르려 합니다. 「공개」 또는 「일부 공개」 영상만 고를 수 있습니다. 그래서 긴 영상을 먼저 공개합니다.", "얼굴 영상 인증 때 다른 사람이 화면에 들어오거나, 방이 어둡거나, 모바일 데이터로 합니다.", "책사가 아닌 다른 채널 화면에서 인증합니다. 전화번호 하나는 1년에 채널 두 개까지만 인증할 수 있습니다.", "인증 메일을 컴퓨터에서 열려고 합니다. 「인증 시작」은 휴대폰에서 눌러야 합니다."], "sources": ["https://support.google.com/youtube/answer/9890437?hl=ko", "https://support.google.com/youtube/answer/9891124?hl=ko", "https://support.google.com/youtube/answer/171664?hl=ko", "https://support.google.com/youtube/answer/13748639?hl=ko", "https://support.google.com/youtube/answer/14075157?hl=ko"]}, {"id": "u4", "title": "올린 뒤 숫자 보기 — YouTube Studio 앱에서 조회수 · 계속 본 비율 · 어디서 왔나", "why": "쇼츠가 사람을 붙잡았는지는 숫자로 봅니다. 그다음 편의 첫 2초 말과 제목을 고칠 근거입니다. 주의할 점이 있습니다. 2026년 8월 24일부터 조회수는 쇼츠·긴 영상 모두 「재생이 시작되는 순간」 하나로 셉니다(공식). 휙 넘긴 사람도 조회수 1이 됩니다. 실제로 멈춰서 본 사람은 「시청자 참여도」(처음 몇 초가 지난 뒤에도 계속 본 비율)로 봅니다. 어디서 왔는지(Shorts 피드 · YouTube 검색 · 채널 페이지 · 탐색 기능 · 외부)는 「시청자가 내 Shorts 동영상을 찾는 방법」에 나옵니다.", "steps": ["올린 지 하루 이상 지난 뒤 휴대폰 「YouTube Studio」 앱을 엽니다.", "채널 전체: 아래 메뉴 「분석」 → 위쪽 「개요」를 누릅니다. 조회수·시청 시간·구독자 변화를 봅니다.", "위쪽 탭을 옆으로 밀어 「콘텐츠」를 누릅니다. 「Shorts」 칸이 있으면 누릅니다.", "「시청자가 내 Shorts 동영상을 찾는 방법」 카드에서 가장 큰 칸을 봅니다(Shorts 피드인지, YouTube 검색인지, 채널 페이지인지).", "「시청자 참여도」 카드에서 계속 본 비율(%)을 봅니다.", "영상 한 편씩: 아래 메뉴 「콘텐츠」 → 볼 쇼츠를 누르고 → 「분석」을 누릅니다.", "위쪽 「개요」에서 그 편의 조회수를 보고, 「참여도」에서 시청 지속 그래프(몇 초에서 많이 떠났나)를 봅니다.", "보고 있는 화면을 사진으로 남깁니다. 갤럭시 오른쪽 옆 버튼과 음량 아래 버튼을 동시에 가볍게 눌렀다 떼면 갤러리에 저장됩니다.", "공책이나 휴대폰 메모에 편마다 한 줄씩 적습니다: 편 이름 · 조회수 · 시청자 참여도(%) · 가장 많이 온 곳. 찍은 사진은 대화창에 「이번 주 숫자」라고 같이 보냅니다."], "check": "편마다 조회수, 시청자 참여도(%), 가장 많이 온 곳 세 가지가 한 줄씩 적혀 있으면 됩니다.", "mistakes": ["조회수만 보고 잘됐다고 판단합니다. 2026-08-24부터 조회수는 재생 시작만으로도 올라갑니다. 시청자 참여도를 같이 봅니다.", "올리자마자 몇 번씩 들여다봅니다. 한 주에 한 번(월요일)만 봅니다.", "「일부 공개」 시험 영상 숫자를 실제 편과 섞어 적습니다.", "「어디서 왔나」의 「외부」를 우리 사이트 유입으로 착각합니다. 사이트로 몇 명 갔는지는 유튜브가 아니라 메인이 사이트 집계(yt- 꼬리표)로 봅니다(docs/98 1절)."], "sources": ["https://support.google.com/youtube/answer/9002587?hl=ko", "https://support.google.com/youtube/answer/9314415?hl=ko", "https://support.google.com/youtube/answer/12220281?hl=ko", "https://support.google.com/youtube/answer/9314355?hl=ko", "https://support.google.com/youtube/answer/2991785?hl=ko", "https://www.samsungsvc.co.kr/solution/40583"]}, {"id": "u5", "title": "한 주 순서 한 장 — 대본 → 찍기 → 편집 → 올리기 → 숫자", "why": "한 편씩 그때그때 하면 천과 빛을 매번 다시 맞춰야 하고, 결국 못 올립니다(채널 개설 3주 동안 0편, docs/98). 한 주 몫을 한 자리에서 몰아 찍고, 올리는 날을 정해 두면 손이 덜 갑니다. 편성(쇼츠 화·목·토 오전, 긴 영상은 월요일 올리는 그 자리에서 공개)은 docs/98 4~5절을 그대로 따릅니다.", "steps": ["대본 날(주 1회, 예: 일요일): 그 주 쇼츠 세 편의 대본을 씁니다. 편마다 질문 제목 한 줄, 첫 2초에 할 답 한 줄, 끝 판 글자를 적습니다.", "촬영 날(주 1회, 두 주 몫을 몰아도 됩니다): 초록 천·빛·핀 마이크를 맞추고, 세 편을 한 자리에서 이어 찍습니다. 같은 옷, 같은 자리로 합니다.", "편집(편마다): 캡컷에서 초록 빼기 → 틀린 곳 자르기 → 자막 → 세로(9:16)로 내보내기. 갤러리에 세 편이 있는지 확인합니다.", "올리기(화·목·토 오전): 그날 몫 한 편을 레슨 1 순서대로 올리고, 9번 단계에서 「공개」를 고릅니다. 첫 주 첫 편만 「일부 공개」로 시험합니다.", "긴 영상이 있는 주(월요일): 긴 영상을 먼저 「공개」로 올립니다. 고급 인증이 끝났다면 컴퓨터 스튜디오에서 그 주 쇼츠마다 「관련 동영상」으로 그 긴 영상을 붙입니다(레슨 3의 11번 단계).", "숫자(다음 월요일): 레슨 4 순서대로 지난주 세 편의 조회수·시청자 참여도·가장 많이 온 곳을 적고, 캡처를 대화창에 「이번 주 숫자」로 보냅니다.", "두 주(쇼츠 6편) 뒤 한 번 판단: docs/98 1절 기준선대로, 숫자가 낮은 편은 주제를 바꾸기보다 첫 2초 말과 제목을 먼저 바꿔 다음 대본에 반영합니다."], "check": "월요일 아침에 지난주 세 편이 「내 동영상」에 「공개」로 올라가 있고, 공책에 편마다 숫자 한 줄이 적혀 있으면 한 바퀴가 돈 것입니다.", "mistakes": ["찍는 날을 편마다 따로 잡아서 천·빛을 매번 다시 맞춥니다.", "올리는 날을 놓쳐 한 날에 세 편을 몰아 올립니다.", "긴 영상을 예약으로 걸어 둡니다. 예약 중인 영상은 비공개 상태라 쇼츠의 관련 동영상으로 고를 수 없습니다.", "숫자를 매일 봅니다. 월요일 한 번이면 됩니다.", "대본에 없는 말을 즉흥으로 덧붙입니다. 상담 이야기가 새어 나갈 수 있습니다(docs/98 7절)."], "sources": ["https://support.google.com/youtube/answer/14075157?hl=ko", "https://support.google.com/youtube/answer/12779649?hl=ko", "https://support.google.com/youtube/answer/12220281?hl=ko", "https://support.google.com/youtube/answer/2991785?hl=ko"]}], "kit": {"pick": "꼭 필요한 묶음은 1,104,070원입니다(2026-10-07 조회값). DJI Mic Mini 2S(송신기 1 + 모바일 수신기 + 충전 케이스) 130,000원, NEEWER NL-288 LED 판 3대(얼굴 1 · 천 2, 스탠드 포함) 546,000원, 유쾌한생각 원터치 롤업 크로마키 250×200cm 330,000원, SmallRig PT-30 삼각대(무선 셔터 포함) 45,570원, 집 컴퓨터 화면 대본용 로지텍 R500s 52,500원으로 짰습니다. 있으면 좋은 것은 Desview T3 거울식 프롬프터 159,000원, 얼굴 빛을 고독스 소프트박스로 바꾸는 값(차액 +93,820원), 여분 셔터 2,490원으로 255,310원이 더 듭니다. 다 사면 1,359,380원입니다.", "why": "고른 기준은 사장님 손이 덜 가는 것, 처음 맞춘 뒤 다시 만질 일이 없는 것, 갤럭시 뒤 카메라와 맞는 것 세 가지입니다.\n\n1. 대본 보기: 집 컴퓨터 모니터에 대본을 띄우고, 휴대폰은 모니터 바로 위에 둡니다. 넘기기는 로지텍 R500s로 합니다. 받는 단자를 컴퓨터에 꽂기만 하면 되고 짝짓기가 필요 없어 가장 쉽습니다. 거울식(Desview T3)은 눈이 렌즈를 똑바로 보는 장점이 있습니다. 하지만 대본을 띄울 기기가 하나 더 있어야 하고 처음 맞출 것이 늘어서 「있으면 좋은 것」으로 돌렸습니다. 말을 따라 대본이 흐르는 앱(PromptSmart VoiceTrack)은 공식 설명이 「영어만」이라 뺐습니다.\n\n2. 마이크: 모바일 수신기를 갤럭시 USB-C에 바로 꽂는 DJI 제품입니다. 2S는 송신기 안에도 따로 녹음됩니다(32-bit float, 28시간). 그래서 휴대폰이 마이크를 못 잡는 실수가 생겨도 목소리가 남습니다. 비용이 들어도 된다고 하셔서 같은 구성 Mini 2(68,400원) 대신 2S를 골랐습니다. 갤럭시 기본 카메라에서 이 마이크를 확실하게 고르는 길은 삼성 공식 도움말의 「프로 동영상 → 마이크 그림 → USB」입니다. 그래서 산 날 문지르기 시험을 꼭 합니다.\n\n3. 조명: 링라이트가 아니라 LED 판입니다. 링라이트는 렌즈 정면에서 비추니 안경알과 눈에 동그란 빛이 비치고 얼굴이 납작해 보입니다. 판을 30~45도 옆에 두는 것이 표준입니다. 판 앞에 확산판이 붙은 같은 제품 세 대로 맞췄습니다. 갓을 조립할 일이 없고, 빛 색과 밝기를 셋 다 똑같이 맞추기 쉽고, 리모컨 하나로 조절합니다. 초록 빼기는 천이 고르게 밝아야 깨끗하게 되므로 천을 비추는 빛 두 대를 「꼭」에 넣었습니다.\n\n4. 크로마키: 케이스에서 위로 당겨 올리는 롤업형입니다. 천을 걸고 펴고 집게로 집을 일이 없고, 늘 팽팽해서 주름 그림자가 적습니다. 가로 250cm라 천에서 1.2~1.5m 떨어져 앉아도 좌우 여유가 있습니다.\n\n5. 삼각대: 조명스탠드처럼 생긴 형태라 셀카봉 삼각대보다 덜 흔들립니다. 50~170cm, 휴대폰 집게와 무선 리모컨이 들어 있어 ⑥ 셔터 리모컨까지 해결됩니다.\n\n6. 사는 차례: docs/98 343줄의 「목소리만 먼저」에 맞춰 마이크부터 사서 시험합니다. 마이크만은 가능하면 매장에서 사장님 휴대폰에 꽂아 시험하고 삽니다.\n\n값은 DJI 한국 공식 스토어, 니워 한국 공식몰, 다나와 최저가를 오늘 조회한 숫자입니다. 판매처와 재고에 따라 바뀝니다.", "options": [{"name": "① 대본 보기(꼭) — 집 윈도우 컴퓨터 화면에 대본 + 로지텍 R500s 프레젠터(넘기기 리모컨)", "price": "52,500원(다나와 최저가, 2026-10-07). 대본 화면은 지금 있는 컴퓨터를 그대로 씀", "strengths": "새 기기를 들이지 않습니다. 컴퓨터 화면에 큰 글자 대본을 띄우고, 손에 쥔 리모컨으로 한 문장씩 넘깁니다. 로지텍 공식 설명으로는 USB 수신기와 블루투스 둘 다 되고, 수신기를 꽂으면 짝짓기 없이 쓸 수 있으며, 최장 20m, 윈도우를 지원합니다. 휴대폰을 모니터 바로 위에 두고 대본 첫 줄을 화면 맨 위에 놓으면 렌즈와 글줄이 가까워 눈이 크게 어긋나지 않습니다(docs/98 4절과 같은 배치).", "weaknesses": "눈이 렌즈보다 조금 아래를 보게 되어 거울식만큼 「정면」은 아닙니다. 메인이 만들 흐르는 프롬프터(HTML)는 아직 없습니다(앞선 조사에서 저장소에 파일 없음). 그 전에는 메모장 확대로 씁니다. R500s 단추가 어떤 키(→, PageDown, 스페이스)를 보내는지는 확인하지 못했습니다. 메인이 프롬프터에서 그 키를 모두 받게 만들면 됩니다. 레이저 포인터가 달려 있으니 눈에 비추지 않게 합니다.", "fit": "사장님이 컴퓨터 책상 앞에 앉아 찍는 배치에 맞고, 가장 쉬운 길입니다. 휴대폰 한 대로 앞 카메라 + 팝업 대본을 쓰는 방법은 외부 마이크가 안 들어갈 수 있어(앞선 조사) 권하지 않습니다.", "sources": ["https://www.logitech.com/ko-kr/products/presenters/r500s-laser-presentation-remote.910-006521.html", "https://search.danawa.com/dsearch.php?query=%EB%A1%9C%EC%A7%80%ED%85%8D+R500s", "https://apps.apple.com/app/id894811756", "C:/Users/LEE/Desktop/궁극의 책사/docs/98_유튜브_전략.md"]}, {"name": "① 대본 보기(있으면 좋은 것) — Desview T3 거울식(빔스플리터) 프롬프터", "price": "159,000원(국내 정품 다나와 최저가). 해외구매는 99,780원. 대본을 띄울 두 번째 기기(쓰던 휴대폰이나 11인치까지의 태블릿)는 따로", "strengths": "갤럭시를 유리 뒤에 물리고 뒤 카메라로 찍으면서, 렌즈 바로 앞 유리에 비친 대본을 읽습니다. 그래서 눈이 렌즈를 똑바로 봅니다. 촬영용 휴대폰 집게와 대본 기기 집게가 들어 있고 둘 다 세로 · 가로로 끼울 수 있습니다. 70/30 유리입니다. 블루투스 리모컨이 들어 있어 iOS · 안드로이드 앱에서 시작 · 멈춤 · 빠르게 · 느리게 · 글자 크기 · 좌우 뒤집기를 합니다. 유리 크기는 18.6×14.45cm이고, 대본 기기 집게는 최대 19cm입니다.", "weaknesses": "대본을 띄울 기기가 하나 더 있어야 합니다(사장님 집에 태블릿이나 쓰던 휴대폰이 있는지 모릅니다). 유리가 작아서 멀리 앉으면 글자가 작게 보입니다. 앱 설치와 리모컨 짝짓기처럼 처음 맞출 것이 늘어납니다. SmallRig PT-30(2kg까지)에 T3 + 갤럭시 + 대본 기기를 다 올려도 되는 무게인지, Desview 앱이 한국어 대본을 잘 보여 주는지는 확인하지 못했습니다. 비교한 것: NEEWER X14(14인치 유리, 3m까지 읽힘)는 니워 한국몰 389,000원인데 지금 품절이고 휴대폰 촬영 집게 언급이 없습니다. Elgato 프롬프터(다나와 378,000원)는 컴퓨터에 연결해 쓰는 형태라 사장님께 어렵습니다.", "fit": "첫 달은 컴퓨터 화면으로 찍어 보고, 「눈이 아래로 간다」가 거슬리면 그때 더합니다. 쓰던 휴대폰이 있으면 기기값 없이 됩니다.", "sources": ["https://videoguys.com.au/collections/desview/products/desview-t3-teleprompter", "https://prod.danawa.com/info/?pcode=14516600", "https://search.danawa.com/dsearch.php?query=Desview+T3+%ED%94%84%EB%A1%AC%ED%94%84%ED%84%B0", "https://neewer.com/en-kr/collections/teleprompterbundle/products/neewer-x14-aluminum-alloy-foldable-teleprompter-beam-splitter-70-30-glass-66602277", "https://search.danawa.com/dsearch.php?query=%ED%94%84%EB%A1%AC%ED%94%84%ED%84%B0"]}, {"name": "② 무선 핀마이크(꼭) — DJI Mic Mini 2S (송신기 1 + 모바일 수신기 + 충전 케이스)", "price": "130,000원(DJI 한국 공식 스토어). 싼 쪽은 DJI Mic Mini 2 같은 구성 68,400원", "strengths": "모바일 수신기를 갤럭시 USB-C에 바로 꽂습니다(선 없음). 송신기는 약 12g으로 옷깃에 자석이나 집게로 붙입니다. 2S는 송신기 안에 32-bit float 내부 녹음이 있습니다(약 14.5GB, 24-bit 기준 28시간). 그래서 휴대폰이 마이크를 못 잡아도 목소리가 송신기에 남습니다. AI 노이즈 캔슬링이 2단계이고, 기본 단계는 선풍기 · 에어컨 · 울림을 줄입니다. 송신기는 약 11시간 갑니다. DJI 휴대폰 호환 목록(v1.2, 2026-04-21)에는 갤럭시 S22 · S22+ · S22 Ultra · S23+ · S23 Ultra · S24 · S24+ · S24 Ultra · S25 · S25+가 올라 있습니다.", "weaknesses": "갤럭시 기본 카메라의 일반 「동영상」에서 바로 녹음되는지는 공식으로 확인하지 못했습니다. 삼성 공식 도움말은 「프로 동영상 → 마이크 그림 → USB」로 고르는 길만 적어 두었고(Note20 · Z 시리즈 · S21~S23 기준), SamMobile(2026-03)은 일반 동영상은 기본이 휴대폰 마이크라고 썼습니다. 그래서 산 날 문지르기 시험이 필수이고, 안 되면 프로 동영상으로 찍습니다. 호환 목록에 S23 기본형 · S25 Ultra · S26 · A 시리즈는 없습니다. 내부 녹음 파일을 쓰려면 송신기를 컴퓨터에 꽂아 꺼내 영상과 맞춰야 합니다(메인 몫). 내부 녹음이 저절로 켜지는지 앱에서 켜야 하는지는 확인하지 못했습니다. 비교한 것: RØDE Wireless Micro(USB-C)는 다나와 119,000~276,930원으로 판매처마다 차이가 크고 내부 녹음이 없습니다.", "fit": "뒤 카메라로 1m 넘게 떨어져 찍으면 휴대폰 마이크가 방 울림까지 담습니다(앞선 조사). 그래서 핀마이크는 꼭 필요합니다. 말하는 사람이 사장님 한 분이라 송신기 1개면 됩니다.", "sources": ["https://store.dji.com/kr/product/dji-mic-mini-2s", "https://store.dji.com/kr/product/dji-mic-mini-2", "https://www.dji.com/kr/mic-mini-2s/specs", "https://www.mynewsdesk.com/uk/dji/pressreleases/dji-mic-mini-2s-launches-globally-equipping-creators-with-internal-recording-up-to-28-hours-and-ai-upgraded-noise-canceling-3459831", "https://dl.djicdn.com/downloads/MIC_MINI_2/20260421/compatibility/DJI_MIC_Series_Mobile_Phone_Compatibility_List_EN_final.pdf", "https://www.dji.com/downloads/products/mic-mini", "https://www.samsung.com/us/support/answer/ANS00087562", "https://www.sammobile.com/news/how-to-capture-better-audio-with-samsung-mobile-camera-app/", "https://search.danawa.com/dsearch.php?query=RODE+Wireless+Micro+USB-C"]}, {"name": "③ 조명(꼭) — NEEWER NL-288 LED 판 3대(얼굴 1 · 천 2). 링라이트는 고르지 않음", "price": "546,000원. NL-288ARC 2팩 스탠드 키트 344,000원 + NL288A 1대 키트 165,000원(둘 다 니워 한국 공식몰, 재고 있음) + 고독스 303 조명 스탠드(260cm) 37,000원(다나와)", "strengths": "판 앞에 확산판이 붙어 있어 갓(소프트박스)을 조립하지 않아도 빛이 고르게 퍼집니다. 세 대가 같은 제품이라 빛 색(3200~5600K)과 밝기(1~100%)를 똑같이 맞추기 쉽고, 2.4G 리모컨으로 의자에 앉아서 조절합니다. 연색성(CRI) 97 이상, 1m에서 1400lux이고, 벽 전원 어댑터가 들어 있습니다. 얼굴 빛 1대는 정면에서 30~45도 옆, 눈높이보다 조금 위에 둡니다. 천 빛 2대는 천의 좌우 앞에서 비스듬히 비춥니다(앞선 조사 찍기 3). 링라이트를 빼는 까닭: 렌즈 정면의 동그란 빛이 안경알과 눈에 고리 모양으로 비치고 얼굴이 납작해 보입니다. 30~45도 옆에 둔 판이나 소프트박스가 표준입니다.", "weaknesses": "판이 37.6×26.6cm라 큰 소프트박스보다 얼굴 빛이 덜 부드럽습니다(있으면 좋은 것의 소프트박스 얼굴 빛으로 보완). NL288A 단품에는 스탠드가 없어 따로 삽니다. 니워 한국몰 값에 관세 · 배송비가 들어 있는지, 배송이 며칠 걸리는지 확인하지 못했습니다. 2팩 키트의 스탠드 높이 표기가 없습니다. 같은 니워 소프트박스 키트(NK103 · NK104)는 한국몰에서 품절입니다.", "fit": "초록 빼기는 천이 고르게 밝아야 깨끗하게 됩니다. 커튼을 닫고 이 세 대만 쓰면 편마다 얼굴색이 같게 나옵니다(docs/98).", "sources": ["https://neewer.com/en-kr/collections/2-pack-bundles/products/neewer-18-led-video-light-panel-lighting-kit-with-remote-66600493", "https://neewer.com/en-kr/products/neewer-288-large-led-video-light-panel-66600117", "https://uk.neewer.com/products/neewer-288-large-led-video-light-panel-66600117", "https://search.danawa.com/dsearch.php?query=%EA%B3%A0%EB%8F%85%EC%8A%A4+%EB%9D%BC%EC%9D%B4%ED%8A%B8+%EC%8A%A4%ED%83%A0%EB%93%9C"     + '<ol class="steps">' + l.steps.map((s, i) => { const key = l.id + '.' + i; return '<li><label for="c-' + key + '"><input type="checkbox" id="c-' + key + '" data-key="' + key + '"' + (done[key] ? ' checked' : '') + '><span><span class="k">' + (i + 1) + '</span>' + esc(s) + '</span></label></li>'; }).join('') + '</ol>'
    + '<div class="box check"><b>끝나면 이렇게 보여요</b>' + esc(l.check) + '</div>'
    + '<details><summary>자주 하는 실수</summary><ul>' + l.mistakes.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></details>'
    + '<details><summary>왜 이렇게 하나요</summary><p>' + esc(l.why) + '</p></details>'
    + (l.sources.length ? '<details><summary>어디서 확인했나</summary><p class="src">' + l.sources.map((u) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u.replace(/^https?:\/\//, '').slice(0, 70)) + '</a>').join('<br>') + '</p></details>' : '')
    + '</section>';
}
function firstHTML() {
  return '<section class="panel route"><h2 style="font-size:20px">오늘 10분, 한 바퀴만 돌아 봐요</h2>'
    + '<p class="note">처음엔 잘 찍는 것보다 「찍고 → 다듬고 → 올리는」 길을 한 번 다 지나가 보는 게 먼저예요. 핀마이크 · 조명 · 초록 천은 두 번째 바퀴부터 붙여요. 자막은 브루가 첫 바퀴부터 대본대로 달아 줘요.</p>'
    + '<ol>' + FIRST.map((f, i) => '<li><span class="n">' + (i + 1) + '</span><span><a href="#' + f[0] + '" data-go="' + f[0] + '">' + esc(f[1]) + '</a><br><span class="note">' + esc(f[2]) + '</span></span></li>').join('') + '</ol></section>'
    + '<section class="warn"><b>도구 —</b> 편집은 브루(Vrew) 라이트를 이 컴퓨터에서 써요(월 14,900원 · 1년 143,000원). 틀린 문장을 글자 지우듯 자르고, 대본을 넣으면 자막이 대본대로 맞춰져요. 초록 빼기만 윈도우에 이미 깔린 클립챔프(무료)로 해요. 장비는 「장비」 탭에 사는 차례대로 있어요 — 마이크부터.</section>'
    + '<section class="panel"><h2 style="font-size:18px">두 번째 바퀴부터</h2><p class="note">장비 탭의 마이크 사기 → 찍기 2(빛 · 소리, 마이크 시험) → 찍기 3(초록 천) → 찍기 4(대본 보며 찍기) → 편집 5(초록 빼고 배경판) 차례로 하나씩 더해요. 한 주 순서는 「올리기」 갈래의 마지막 레슨에 한 장으로 있어요.</p></section>';
}
function kitHTML() {
  const K = D.kit;
  return '<section class="panel"><h2 style="font-size:20px">장비 — 사는 차례대로</h2><p class="note">' + esc(K.pick) + '</p><p class="note">결제는 사장님이 직접 해요. 값은 2026-10-07 조회값이라 판매처 · 재고에 따라 달라져요. 마이크는 가능하면 매장에서 사장님 휴대폰에 꽂아 보고 사요(산 날 「찍기 2」의 문지르기 시험).</p></section>'
    + '<details class="panel"><summary>왜 이것들인가</summary><p>' + esc(K.why).split(String.fromCharCode(10)).join('<br>') + '</p></details>'
    + K.options.map((o) => '<section class="lesson"><h2>' + esc(o.name) + '</h2><div class="box check"><b>값</b>' + esc(o.price) + '</div><p class="note">' + esc(o.fit) + '</p>'
      + '<details><summary>좋은 점 · 아쉬운 점</summary><p>' + esc(o.strengths) + '</p><p>' + esc(o.weaknesses) + '</p></details>'
      + (o.sources && o.sources.length ? '<details><summary>어디서 보나 · 사나</summary><p class="src">' + o.sources.map((u) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u.replace(/^https?:\/\//, '').slice(0, 70)) + '</a>').join('<br>') + '</p></details>' : '') + '</section>').join('');
}
function promptHTML() {
  const t = store.get('script', ''), fs = store.get('fs', 44);
  return '<section class="panel"><h2 style="font-size:20px">대본 크게 보기</h2>'
    + '<p class="note">컴퓨터 모니터에서 이 쪽을 열고, 휴대폰은 모니터 바로 위에 두세요. 대본을 붙여 넣고 「크게 보기」를 누르면 검은 화면에 한 줄씩 크게 나와요. 넘기기 리모컨(로지텍 R500s)이나 자판의 → · 스페이스 · Page Down 으로 다음 줄, ← · Page Up 으로 앞 줄이에요. 화면을 눌러도 넘어가요. 한 줄 = 한 번에 말할 만큼으로 줄을 바꿔 두면 읽기 편해요.</p>'
    + '<label for="script" class="note">대본(줄마다 한 문장)</label><textarea id="script" placeholder="예)\n안녕하세요, 사주를 계산하는 책사예요.\n오늘은 …">' + esc(t) + '</textarea>'
    + '<div class="row"><label for="fs">글자 크기</label><input type="range" id="fs" min="28" max="80" step="2" value="' + fs + '"><span class="note" id="fsv">' + fs + '</span></div>'
    + '<div class="row"><button type="button" class="btn" id="goPr">크게 보기</button><button type="button" class="btn ghost" id="clr">비우기</button></div></section>';
}
function render() {
  document.querySelectorAll('nav.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
  const m = document.getElementById('main');
  if (tab === 'first') m.innerHTML = firstHTML();
  else if (tab === 'prompt') m.innerHTML = promptHTML();
  else if (tab === 'kit') m.innerHTML = kitHTML();
  else m.innerHTML = '<p class="note">' + NAME[tab] + ' 레슨 ' + D[tab].length + '개 — 위에서부터 차례로 해요.</p>' + D[tab].map(lessonHTML).join('');
  m.style.display = 'flex'; m.style.flexDirection = 'column'; m.style.gap = '16px';
}
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]');
  if (t) { tab = t.dataset.tab; store.set('tab', tab); render(); window.scrollTo(0, 0); return; }
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); tab = secOf(g.dataset.go); store.set('tab', tab); render(); const el = document.getElementById(g.dataset.go); if (el) el.scrollIntoView({ block: 'start' }); return; }
  if (e.target.id === 'goPr') return openPr();
  if (e.target.id === 'clr') { store.set('script', ''); render(); return; }
});
document.addEventListener('change', (e) => {
  const k = e.target.dataset && e.target.dataset.key; if (!k) return;
  if (e.target.checked) done[k] = 1; else delete done[k];
  store.set('done', done);
  const id = k.split('.')[0], l = byId[id], p = document.querySelector('[data-prog="' + id + '"]');
  if (l && p) { const n = count(l), m = l.steps.length; p.textContent = (n === m ? '다 했어요 · ' : '') + n + ' / ' + m + ' 걸음'; p.classList.toggle('done', n === m); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'script') store.set('script', e.target.value);
  if (e.target.id === 'fs') { store.set('fs', +e.target.value); const v = document.getElementById('fsv'); if (v) v.textContent = e.target.value; }
});
let L = [], li = 0, lock = null;
function show() {
  const fs = store.get('fs', 44);
  const a = document.getElementById('prLine'), b = document.getElementById('prNext');
  a.style.fontSize = fs + 'px'; b.style.fontSize = Math.round(fs * 0.45) + 'px';
  a.textContent = li < L.length ? L[li] : '끝 — 「닫기」를 누르세요'; b.textContent = L[li + 1] || '';
  document.getElementById('prCnt').textContent = Math.min(li + 1, L.length) + ' / ' + L.length;
}
async function openPr() {
  L = String(store.get('script', '')).split(/\n+/).map((s) => s.trim()).filter(Boolean);
  if (!L.length) { const ta = document.getElementById('script'); if (ta) ta.focus(); return; }
  li = 0; document.getElementById('pr').hidden = false; show();
  try { lock = await navigator.wakeLock.request('screen'); } catch (e) { lock = null; }
}
document.getElementById('prClose').addEventListener('click', (e) => { e.stopPropagation(); document.getElementById('pr').hidden = true; try { lock && lock.release(); } catch (x) {} });
document.getElementById('pr').addEventListener('click', (e) => { if (e.target.id === 'prClose') return; if (e.clientX < window.innerWidth * 0.2) li = Math.max(0, li - 1); else li = Math.min(L.length, li + 1); show(); });
document.addEventListener('keydown', (e) => { if (document.getElementById('pr').hidden) return; if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(e.key)) { li = Math.min(L.length, li + 1); show(); e.preventDefault(); } if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { li = Math.max(0, li - 1); show(); e.preventDefault(); } if (e.key === 'Escape') document.getElementById('prClose').click(); });
render();
</script>
